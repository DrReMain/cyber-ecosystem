            type: object
            properties:
                provider:
                    type: string
                redirectUri:
                    type: string
        cyber.system.v1.BeginBindCredentialResponse:
            type: object
            properties:
                authorizeUrl:
                    type: string
                    description: |-
                        Plain, not a wrapper: a successful begin always mints the redirect —
                         success implies presence.
        cyber.system.v1.BeginIdentityLoginRequest:
            type: object
            properties:
                provider:
                    type: string
                redirectUri:
                    type: string
        cyber.system.v1.BeginIdentityLoginResponse:
            type: object
            properties:
                authorizeUrl:
                    type: string
                    description: |-
                        Plain, not a wrapper: a successful begin always mints the redirect —
                         success implies presence.
        cyber.system.v1.BindCredentialRequest:
            type: object
            properties:
                provider:
                    type: string
                wechat:
                    $ref: '#/components/schemas/cyber.system.v1.WeChatIdentityPayload'
                sms:
                    $ref: '#/components/schemas/cyber.system.v1.SmsIdentityPayload'
                state:
                    type: string
                    description: |-
                        The state must be one minted on an authenticated rung (SendBindSmsCode
                         or BeginBindCredential) and carries the minting session: the exchange
                         refuses a state born in another session or anonymous, so a phished code
                         cannot be injected into a foreign bind flow. Login faces accept any
                         live state of their provider — the code itself is the login proof.
        cyber.system.v1.BindCredentialResponse:
            type: object
            properties:
                wechatProfile:
                    allOf:
                        - $ref: '#/components/schemas/cyber.system.v1.WeChatProfile'
                    description: |-
                        Same shape as the login response's: binding a wechat identity is the
                         wizard pill's moment — the openid binds and the nickname/avatar arrive
                         in the same exchange, so the caller fills the form without a second hop.
        cyber.system.v1.CalendarOverride:
            type: object
            properties:
                date:
                    type: string
                allowed:
                    type: boolean
                    description: true = allowed on this date, false = denied.
            description: A single-date exception on the calendar; dates are server-local.
        cyber.system.v1.CalendarParams:
            type: object
            properties:
                base:
                    type: string
                    description: Periodic default when no override matches the day.
                overrides:
                    type: array
                    items:
                        $ref: '#/components/schemas/cyber.system.v1.CalendarOverride'
                    description: At most one entry per date (deep-validated on save).
            description: |-
                Calendar constraint: a periodic base plus per-date overrides that win over
                 it. Three forms: WEEKDAYS + deny overrides = workday calendar (holidays);
                 NONE + allow overrides = on-call/inspection calendar; ALL + deny
                 overrides = lockdown calendar.
        cyber.system.v1.ChangePasswordRequest:
