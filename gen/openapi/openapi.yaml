                        The 4 MiB cap is a contract constant, deliberately matched to the
                         native gRPC default receive cap so the gRPC leg needs no
                         MaxRecvMsgSize override. A file near the cap can still overflow the
                         framed message by its field overhead — the connect/HTTP path (the
                         primary consumer) has no such limit; gRPC callers keep headroom.
                    format: bytes
            description: uploadFile
        cyber.system.v1.UploadFileResponse:
            type: object
            properties:
                file:
                    $ref: '#/components/schemas/cyber.system.v1.File'
        cyber.system.v1.UploadPartUrl:
            type: object
            properties:
                partNumber:
                    type: integer
                    description: Same carve-out as PresignedPut.url.
                    format: int32
                url:
                    type: string
        cyber.system.v1.UploadSession:
            type: object
            properties:
                uploadId:
                    type: string
                    description: Same carve-out family; opaque backend session id.
                partSize:
                    type: string
                partCount:
                    type: integer
                    format: int32
                partUrls:
                    type: array
                    items:
                        $ref: '#/components/schemas/cyber.system.v1.UploadPartUrl'
                    description: |-
                        All part URLs minted upfront (signing is local and cheap); expiry
                         mid-flight is recovered via ListUploadedParts re-minting.
                expiresAt:
                    type: string
                    format: date-time
        cyber.system.v1.UploadedPart:
            type: object
            properties:
                partNumber:
                    type: integer
                    description: Same carve-out as PresignedPut.url.
                    format: int32
                etag:
                    type: string
        cyber.system.v1.User:
            type: object
            properties:
                id:
                    type: string
                createdAt:
                    type: string
                    format: date-time
                updatedAt:
                    type: string
                    format: date-time
                email:
                    type: string
                deptId:
                    type: string
                roles:
                    type: array
                    items:
                        type: string
                enabled:
                    type: boolean
                avatar:
                    type: string
        cyber.system.v1.VerifySessionResponse:
            type: object
            properties:
                userId:
                    type: string
                tenantId:
                    type: string
                sessionId:
                    type: string
                email:
                    type: string
tags:
    - name: AgentConfigAdminService
    - name: AgentConfigService
    - name: AuditService
    - name: AuthService
    - name: ChatService
    - name: DeptService
    - name: FilePresignService
      description: |-
        File presign channel: the client-direct upload path. The
         service registers metadata and mints time-limited presigned URLs; bytes
         travel client → object storage without crossing this stack. Addressing is
         compiled into every minted URL (minted against the storage backend's
         advertised public endpoint), so the client holds no storage configuration
         of its own — CreateUpload's response shape IS the routing decision.
         Same audience as the proxy channel: a builtin capability every
         authenticated principal holds, while FileService stays the admin
         management plane.
         Resume needs no client-side persistence: multipart sessions live in the
         file row + the backend's part set, and ListUploadedParts replays both
         (uploaded parts with ETags, fresh URLs for the missing ones).
    - name: FileProxyService
      description: |-
        File proxy channel: the app-generic small-file upload path.
         Bytes ride the unary RPC body through the service to object storage — no
         presigning, no CORS, no client-side S3 surface. The payload cap is a
         contract constant, not a tunable. This lives in its own proto because its
         audience is the opposite of FileService's: a builtin capability every
         authenticated principal holds — an operator must not be able to lock a
         user out of their own file space — while FileService stays the admin
         management plane.
         The response carries the File entity, never a URL: callers persist the
         file id, access URLs are minted at render time, and storage
         backends can migrate without touching stored references.
    - name: FileService
    - name: IntrospectService
    - name: PolicyService
    - name: ResourceService
    - name: RoleService
    - name: TransferService
      description: |-
        Transfer service. Exposes the streaming transport primitives
         (SSE / client-stream / bidi / HttpBody) to clients.
    - name: UserService
