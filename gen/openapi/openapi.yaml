                gamePreference:
                    allOf:
                        - $ref: '#/components/schemas/cyber.esports.v1.GamePreferenceInput'
                    description: |-
                        Replace-set: presence rewrites the whole preference list (present with
                         empty lists clears it). The business custom-game cap is a product
                         constant enforced server-side; the repeated bounds below are static
                         backstops only.
                sex:
                    enum:
                        - PROFILE_SEX_UNSPECIFIED
                        - PROFILE_SEX_MALE
                        - PROFILE_SEX_FEMALE
                        - PROFILE_SEX_UNDETERMINED
                    type: string
                    format: enum
            description: |-
                updateProfile — presence-based partial update: a field left out stays
                 untouched; each onboarding step saves its own slice.
        cyber.esports.v1.UpdateProfileResponse:
            type: object
            properties:
                profile:
                    $ref: '#/components/schemas/cyber.esports.v1.Profile'
        cyber.esports.v1.UpdateSkuPriceRequest:
            type: object
            properties:
                skuCode:
                    type: string
                priceFen:
                    type: string
                listPriceFen:
                    type: string
        cyber.esports.v1.UpdateSkuPriceResponse:
            type: object
            properties:
                sku:
                    $ref: '#/components/schemas/cyber.esports.v1.AdminSku'
        cyber.esports.v1.UpdateTestConfigRequest:
            type: object
            properties:
                testId:
                    type: string
                backgroundInvalidSeconds:
                    type: integer
                    format: int32
                engineParams:
