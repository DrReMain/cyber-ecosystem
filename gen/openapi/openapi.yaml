components:
    schemas:
        cyber.agent.v1.AgentConfig:
            type: object
            properties:
                id:
                    type: string
                createdAt:
                    type: string
                    format: date-time
                updatedAt:
                    type: string
                    format: date-time
                userId:
                    type: string
                baseUrl:
                    type: string
                apiKeySet:
                    type: boolean
        cyber.agent.v1.AgentConfigView:
            type: object
            properties:
                id:
                    type: string
                createdAt:
                    type: string
                    format: date-time
                updatedAt:
                    type: string
                    format: date-time
                userId:
                    type: string
                userAccount:
                    type: string
                userAvatar:
                    type: string
                baseUrl:
                    type: string
                apiKeySet:
                    type: boolean
        cyber.agent.v1.ChatRequest:
            type: object
            properties:
                model:
                    type: string
                    description: |-
                        Model id as named by the user's endpoint (GET /v1/models vocabulary);
                         required, 1..128 chars.
                sessionId:
                    type: string
                    description: |-
                        Existing session id (max 20 chars); empty = the server creates a session
                         for this exchange.
                content:
                    type: string
                    description: |-
                        The new user turn; required, 1..32768 chars. History is loaded
                         server-side from the session.
            description: |-
                Constraints are enforced by explicit checks in the service handler: the
                 unary protovalidate middleware never sees streaming requests, so annotations
                 here would be dead rules.
        cyber.agent.v1.ChatResponse:
            type: object
            properties:
                contentDelta:
                    type: string
                    description: Incremental assistant text since the previous frame.
                reasoningDelta:
                    type: string
                    description: Incremental model reasoning (thinking output) since the previous frame.
                finishReason:
                    type: string
                    description: Present only on the final frame ("stop"/"length"/...), empty while streaming.
                sessionId:
                    type: string
                    description: |-
                        Present only on the first frame of a newly created session (strictly
                         before any delta); unset otherwise — protojson omits it.
            description: |-
                One streaming frame: deltas are incremental (append-only) and at most one
                 is set per frame; the final frame carries finish_reason with empty deltas.
                 Failures terminate the stream as a Connect error, never as a frame.
        cyber.agent.v1.ChatSession:
            type: object
            properties:
                id:
                    type: string
                createdAt:
                    type: string
                    format: date-time
                updatedAt:
                    type: string
                    format: date-time
                title:
                    type: string
                    description: First user message clipped server-side at creation; user-renamable.
            description: list sessions
        cyber.agent.v1.DeleteMyAgentConfigResponse:
            type: object
            properties: {}
        cyber.agent.v1.DeleteSessionResponse:
            type: object
            properties: {}
        cyber.agent.v1.GetMyAgentConfigResponse:
            type: object
            properties:
                agentConfig:
                    $ref: '#/components/schemas/cyber.agent.v1.AgentConfig'
        cyber.agent.v1.GetSessionMessagesResponse:
            type: object
            properties:
                page:
                    $ref: '#/components/schemas/cyber.shared.common.v1.PageResponse'
                list:
                    type: array
                    items:
                        $ref: '#/components/schemas/cyber.agent.v1.SessionMessage'
                    description: 'Fixed order: created_at DESC (page 1 = newest turns; later pages go back).'
        cyber.agent.v1.ListAgentConfigsResponse:
            type: object
            properties:
                page:
                    $ref: '#/components/schemas/cyber.shared.common.v1.PageResponse'
                list:
                    type: array
                    items:
                        $ref: '#/components/schemas/cyber.agent.v1.AgentConfigView'
        cyber.agent.v1.ListModelsResponse:
            type: object
            properties:
                models:
                    type: array
                    items:
                        type: string
                    description: Model ids exposed by the user's endpoint, order preserved.
        cyber.agent.v1.ListSessionsResponse:
            type: object
            properties:
                page:
                    $ref: '#/components/schemas/cyber.shared.common.v1.PageResponse'
                list:
                    type: array
                    items:
                        $ref: '#/components/schemas/cyber.agent.v1.ChatSession'
                    description: 'Fixed order: updated_at DESC (latest activity first).'
        cyber.agent.v1.SessionMessage:
            type: object
            properties:
                id:
                    type: string
                createdAt:
                    type: string
                    format: date-time
                role:
                    type: string
                    description: |-
                        Free-form role vocabulary (user/assistant today; tool parts are the S4
                         evolution) — deliberately unpatterned.
                content:
                    type: string
                reasoning:
                    type: string
                    description: Accumulated model reasoning on the assistant turn; empty on user turns.
                model:
                    type: string
                    description: Model id that produced the assistant turn; empty on user turns.
            description: get session messages
        cyber.agent.v1.UpdateMyAgentConfigRequest:
            type: object
            properties:
                baseUrl:
                    type: string
                apiKey:
                    type: string
            description: update
        cyber.agent.v1.UpdateMyAgentConfigResponse:
            type: object
            properties: {}
        cyber.agent.v1.UpdateSessionRequest:
            type: object
            properties:
                sessionId:
                    type: string
                    description: Session id; absent and unowned both resolve to not found (no existence leak).
                title:
                    type: string
                    description: New title; replaces the creation-time clip.
            description: update session
        cyber.agent.v1.UpdateSessionResponse:
            type: object
            properties: {}
        cyber.esports.v1.ActivationBatch:
            type: object
            properties:
                batchNo:
                    type: string
                    description: |-
                        Human-shape batch number (B-YYMM-XXXX) — the string support quotes
                         on the phone.
                reportType:
                    enum:
                        - REPORT_TYPE_UNSPECIFIED
                        - REPORT_TYPE_COGNITIVE
                        - REPORT_TYPE_CAREER
                        - REPORT_TYPE_SCHOOL
                    type: string
                    format: enum
                count:
                    type: integer
                    description: Codes minted in this batch.
                    format: int32
                usedCount:
                    type: integer
                    description: Codes already redeemed.
                    format: int32
                expiresAt:
                    type: string
                    format: date-time
                createdAt:
                    type: string
                    format: date-time
                disabledAt:
                    type: string
                    description: |-
                        Absent = live batch; present = the moment the operator disabled it.
                         Disabling voids every unredeemed code in the batch on the spot —
                         grants already landed stay landed, the same permanence a settled
                         order gets.
                    format: date-time
            description: |-
                One generation call's mint: the unit an operator disables, exports,
                 and reads burn-down by. Count facts are aggregates over the code rows
                 — the batch row carries only batch-level truth (family, deadline, the
                 disable flip), so the two can never drift.
        cyber.esports.v1.ActivationCode:
            type: object
            properties:
                code:
                    type: string
                reportType:
                    enum:
                        - REPORT_TYPE_UNSPECIFIED
                        - REPORT_TYPE_COGNITIVE
                        - REPORT_TYPE_CAREER
                        - REPORT_TYPE_SCHOOL
                    type: string
                    format: enum
                quantity:
                    type: integer
                    format: int32
                usedCount:
                    type: integer
                    format: int32
                expiresAt:
                    type: string
                    format: date-time
                createdAt:
                    type: string
                    format: date-time
                batchNo:
                    type: string
                    description: |-
                        The minting batch this code belongs to; absent only on rows older
                         than the batch model itself.
                redeemedAt:
                    type: string
                    description: |-
                        The redeem's trail, hydrated from the grant the redeem landed:
                         absent on an unredeemed code. user_id is the member link target;
                         nickname is the local profile fold operators read.
                    format: date-time
                userId:
                    type: string
                nickname:
                    type: string
        cyber.esports.v1.AdminOrder:
            type: object
            properties:
                order:
                    $ref: '#/components/schemas/cyber.esports.v1.Order'
                userId:
                    type: string
                    description: |-
                        The member behind the order — the link target into the member
                         module's detail page; always present, unlike the hydrated identity
                         fields that may have nothing to show.
                nickname:
                    type: string
                phoneMasked:
                    type: string
                skuName:
                    type: string
                    description: |-
                        The sku's display title at read time; off-shelf and deleted rows
                         still hydrate (order history outlives catalog changes).
                refund:
                    allOf:
                        - $ref: '#/components/schemas/cyber.esports.v1.OrderRefundView'
                    description: |-
                        The derived refund fact on a paid order; absent = never refunded.
                         One full refund per order — the operator face mints it, the channel
                         idempotency key (out_refund_no) is derived from the order no.
            description: |-
                An order row as the operator reads it: the wire Order plus the
                 hydrated facts the list columns need. Absent hydration fields are the
                 lazy shape (no profile row yet, roster gone) — never an error.
        cyber.esports.v1.AdminSku:
            type: object
            properties:
                sku:
                    $ref: '#/components/schemas/cyber.esports.v1.Sku'
                onShelf:
                    type: boolean
                updatedBy:
                    type: string
                    description: |-
                        Operator id of the last write (audit join); empty on seed rows no
                         operator has touched.
            description: |-
                A catalog row as the operator sees it: the member-plane Sku plus the
                 facts that plane never carries — shelf state and the last writer.
        cyber.esports.v1.AgreementConsent:
            type: object
            properties:
                userId:
                    type: string
                nickname:
                    type: string
                phoneMasked:
                    type: string
                doc:
                    enum:
                        - AGREEMENT_DOC_UNSPECIFIED
                        - AGREEMENT_DOC_USER
                        - AGREEMENT_DOC_PRIVACY
                    type: string
                    format: enum
                versionNo:
                    type: string
                    description: |-
                        Denormalized on purpose: the version row may be deleted after the
                         fact, the evidence keeps the string it landed on.
                consentedAt:
                    type: string
                    format: date-time
                loginMethod:
                    enum:
                        - AGREEMENT_LOGIN_METHOD_UNSPECIFIED
                        - AGREEMENT_LOGIN_METHOD_SMS_CODE
                        - AGREEMENT_LOGIN_METHOD_PASSWORD
                        - AGREEMENT_LOGIN_METHOD_WECHAT
                    type: string
                    format: enum
            description: |-
                One consent row: the compliance-evidence unit. user_id with its two
                 display folds — nickname from the local profile, masked phone from
                 the system roster — because the operator answers disputes by reading
                 this table, not by joining three systems by hand.
        cyber.esports.v1.AgreementCurrent:
            type: object
            properties:
                doc:
                    enum:
                        - AGREEMENT_DOC_UNSPECIFIED
                        - AGREEMENT_DOC_USER
                        - AGREEMENT_DOC_PRIVACY
                    type: string
                    format: enum
                no:
                    type: string
                effectiveAt:
                    type: string
                    format: date-time
            description: |-
                One document's current answer — the version line the legal page and
                 the login gate render.
        cyber.esports.v1.AgreementVersion:
            type: object
            properties:
                id:
                    type: string
                doc:
                    enum:
                        - AGREEMENT_DOC_UNSPECIFIED
                        - AGREEMENT_DOC_USER
                        - AGREEMENT_DOC_PRIVACY
                    type: string
                    format: enum
                no:
                    type: string
                title:
                    type: string
                    description: |-
                        The display title the create path derives from the document type
                         (《用户服务协议》 / 《隐私政策》); stored per row so historical rows
                         keep the title they were published under.
                effectiveAt:
                    type: string
                    format: date-time
                agreedCount:
                    type: integer
                    format: int32
                isCurrent:
                    type: boolean
                body:
                    type: string
            description: |-
                One version row of one document. agreed_count is a fold over the
                 consent rows (distinct users), carried per row so the table renders
                 without a second query per version.
        cyber.esports.v1.Announcement:
            type: object
            properties:
                id:
                    type: string
                kind:
                    enum:
                        - ANNOUNCEMENT_KIND_UNSPECIFIED
                        - ANNOUNCEMENT_KIND_BANNER
                        - ANNOUNCEMENT_KIND_MESSAGE
                    type: string
                    format: enum
                scope:
                    enum:
                        - ANNOUNCEMENT_SCOPE_UNSPECIFIED
                        - ANNOUNCEMENT_SCOPE_ALL
                        - ANNOUNCEMENT_SCOPE_MEMBERSHIP
                    type: string
                    format: enum
                title:
                    type: string
                content:
                    type: string
                status:
                    enum:
                        - ANNOUNCEMENT_STATUS_UNSPECIFIED
                        - ANNOUNCEMENT_STATUS_DRAFT
                        - ANNOUNCEMENT_STATUS_PUBLISHED
                        - ANNOUNCEMENT_STATUS_OFFLINE
                    type: string
                    format: enum
                publishedAt:
                    type: string
                    description: Absent until published — the delivery moment.
                    format: date-time
                offlineAt:
                    type: string
                    description: Absent until offlined.
                    format: date-time
                publishedBy:
                    type: string
                    description: The operator who published; drafts carry none.
                createdAt:
                    type: string
                    format: date-time
                updatedAt:
                    type: string
                    format: date-time
        cyber.esports.v1.BackgroundSpan:
            type: object
            properties:
                elapsedMs:
                    type: integer
                    format: int32
                durationMs:
                    type: integer
                    format: int32
            description: |-
                The engine marks backgrounding spans; validity is judged server-side at
                 submit against TestConfig.background_invalid_seconds.
        cyber.esports.v1.Banner:
            type: object
            properties:
                title:
                    type: string
                content:
                    type: string
                publishedAt:
                    type: string
                    format: date-time
            description: |-
                The banner face is a read of the published banner announcements; it
                 carries no operator lifecycle fields.
        cyber.esports.v1.CareerImprovement:
            type: object
            properties:
                dimension:
                    type: string
                    description: |-
                        The legal dimension key; a row exists only for a rendered
                         dimension — a missing dimension has no gap to state.
                current:
                    type: number
                    format: double
                target:
                    type: number
                    description: The excellence line the rubric defines — server-owned, seed-fed.
                    format: double
                gapPercent:
                    type: integer
                    description: How far short of the target, in percent of it.
                    format: int32
                suggestions:
                    type: array
                    items:
                        type: string
                    description: Seeded prescription copy, the library's own words.
        cyber.esports.v1.CareerRecommendation:
            type: object
            properties:
                careerArea:
                    type: string
                    description: The seeded area code — the single source of the area's identity.
                name:
                    type: string
                matchedScore:
                    type: number
                    description: The area's match against the member's rendered dimensions, 0-100.
                    format: double
                basisDimensions:
                    type: array
                    items:
                        type: string
                    description: The dimensions the match weighed, legal keys.
                eliminationRate:
                    type: number
                    description: |-
                        Library facts, seeded with the area — percent of entrants washed
                         out and the training-load tier's own wording.
                    format: double
                trainingIntensity:
                    type: string
                suggestion:
                    type: string
        cyber.esports.v1.CharacterCounterDetail:
            type: object
            properties:
                rounds:
                    type: array
                    items:
                        $ref: '#/components/schemas/cyber.esports.v1.CharacterCounterRound'
            description: |-
                character_counter — lineup counter-picking; the counter score is a
                 server-side judgment against the counter matrix.
        cyber.esports.v1.CharacterCounterRound:
            type: object
            properties:
                roundNumber:
                    type: integer
                    format: int32
                enemyLineup:
                    type: array
                    items:
                        type: string
                selectedLineup:
                    type: array
                    items:
                        type: string
                timeSpentMs:
                    type: integer
                    format: int32
        cyber.esports.v1.CloseFeedbackRequest:
            type: object
            properties:
                feedbackId:
                    type: string
        cyber.esports.v1.CloseFeedbackResponse:
            type: object
            properties:
                ticket:
                    $ref: '#/components/schemas/cyber.esports.v1.FeedbackTicket'
        cyber.esports.v1.CloseOrderRequest:
            type: object
            properties:
                orderNo:
                    type: string
        cyber.esports.v1.CloseOrderResponse:
            type: object
            properties:
                order:
                    $ref: '#/components/schemas/cyber.esports.v1.Order'
        cyber.esports.v1.ClosePaymentOrderRequest:
            type: object
            properties:
                orderNo:
                    type: string
        cyber.esports.v1.ClosePaymentOrderResponse:
            type: object
            properties:
                order:
                    $ref: '#/components/schemas/cyber.esports.v1.AdminOrder'
        cyber.esports.v1.CognitiveDimension:
            type: object
            properties:
                dimension:
                    type: string
                value:
                    type: number
                    description: The weighted percentile sum, rounded to an integer (0-100 scale).
                    format: double
                tier:
                    enum:
                        - REPORT_TIER_UNSPECIFIED
                        - REPORT_TIER_S
                        - REPORT_TIER_A
                        - REPORT_TIER_B
                        - REPORT_TIER_C
                    type: string
                    format: enum
            description: |-
                One rendered dimension of the cognitive model. The dimension keys are
                 the legal eight-word vocabulary; the wording a client renders them
                 with stays with the client.
        cyber.esports.v1.ComplianceConfig:
            type: object
            properties:
                birthCollect:
                    type: boolean
                payAgeLine:
                    type: integer
                    format: int32
                minorPrompt:
                    type: string
                missingBirthPrompt:
                    type: string
                renewalRemindDays:
                    type: integer
                    description: |-
                        Days before membership expiry the renewal reminder shows; the
                         shipped default 7 answers when no row sets it.
                    format: int32
            description: |-
                The settled config every face of these knobs reads. birth_collect and
                 pay_age_line are the effective values (an absent row answers the
                 shipped defaults); the two prompts carry the operator's override only —
                 absent means each face renders its own localized default, because the
                 shipped copy is locale-dependent text the server cannot fold into one
                 string, while an override is operator-authored literal copy shown as-is
                 in every locale (the sku-name precedent for operator text).
        cyber.esports.v1.CreateAgreementVersionRequest:
            type: object
            properties:
                doc:
                    enum:
                        - AGREEMENT_DOC_UNSPECIFIED
                        - AGREEMENT_DOC_USER
                        - AGREEMENT_DOC_PRIVACY
                    type: string
                    format: enum
                no:
                    type: string
                    description: |-
                        Free-form version string the operator quotes (v1.0.0, v1.5-draft…);
                         uniqueness per document is enforced by the store, format is not.
                effectiveAt:
                    type: string
                    format: date-time
                body:
                    type: string
        cyber.esports.v1.CreateAgreementVersionResponse:
            type: object
            properties:
                version:
                    $ref: '#/components/schemas/cyber.esports.v1.AgreementVersion'
        cyber.esports.v1.CreateAnnouncementRequest:
            type: object
            properties:
                kind:
                    enum:
                        - ANNOUNCEMENT_KIND_UNSPECIFIED
                        - ANNOUNCEMENT_KIND_BANNER
                        - ANNOUNCEMENT_KIND_MESSAGE
                    type: string
                    format: enum
                scope:
                    enum:
                        - ANNOUNCEMENT_SCOPE_UNSPECIFIED
                        - ANNOUNCEMENT_SCOPE_ALL
                        - ANNOUNCEMENT_SCOPE_MEMBERSHIP
                    type: string
                    format: enum
                title:
                    type: string
                content:
                    type: string
        cyber.esports.v1.CreateAnnouncementResponse:
            type: object
            properties:
                announcement:
                    $ref: '#/components/schemas/cyber.esports.v1.Announcement'
        cyber.esports.v1.CreateOrderRequest:
            type: object
            properties:
                skuCode:
                    type: string
                channel:
                    type: string
                    description: |-
                        The access context the client environment decided: in-WeChat pays by
                         invoke, a phone browser by jump, a desktop by QR. The server validates
                         it against the active provider's channel set and the hints it needs.
                scopeRef:
                    type: string
                    description: |-
                        The test record a trial sku unlocks — required for trial, must be
                         absent for membership; the caller must own the record.
                returnUrl:
                    type: string
                    description: Post-payment landing page for jump channels.
        cyber.esports.v1.CreateOrderResponse:
            type: object
            properties:
                order:
                    $ref: '#/components/schemas/cyber.esports.v1.Order'
                credential:
                    $ref: '#/components/schemas/cyber.esports.v1.PayCredential'
        cyber.esports.v1.CreateSkuRequest:
            type: object
            properties:
                name:
                    type: string
                kind:
                    enum:
                        - SKU_KIND_UNSPECIFIED
                        - SKU_KIND_TRIAL
                        - SKU_KIND_MEMBERSHIP
                    type: string
                    format: enum
                priceFen:
                    type: string
                listPriceFen:
                    type: string
                    description: List price; defaults to price_fen when absent.
                periodDays:
                    type: integer
                    description: |-
                        Membership window; required for membership skus, rejected for trial
                         skus — the kind check answers with the sku-kind error.
                    format: int32
                description:
                    type: string
        cyber.esports.v1.CreateSkuResponse:
            type: object
            properties:
                sku:
                    $ref: '#/components/schemas/cyber.esports.v1.AdminSku'
        cyber.esports.v1.DeleteAgreementVersionResponse:
            type: object
            properties: {}
            description: |-
                Deletion answers nothing: the row is gone and the list refetch
                 renders the truth.
        cyber.esports.v1.DigestAbilityLine:
            type: object
            properties:
                ability:
                    type: string
                bestScore:
                    type: number
                    description: The cross-session best score — the ability board's bar.
                    format: double
                bestGrade:
                    type: string
                    description: |-
                        The best attempt's grade; null when that attempt carried no cohort
                         answer.
                bestPercentile:
                    type: number
                    description: The best's percentile; null while the cohort says nothing.
                    format: double
                sessionsTested:
                    type: integer
                    description: How many distinct sessions carried a valid attempt for the ability.
                    format: int32
                lastAt:
                    type: string
                    format: date-time
        cyber.esports.v1.DigestSessionLine:
            type: object
            properties:
                sessionId:
                    type: string
                genre:
                    type: string
                finished:
                    type: boolean
                    description: |-
                        All steps done — the history card's finished state; false keeps the
                         resume entry alive.
                doneCount:
                    type: integer
                    format: int32
                stepCount:
                    type: integer
                    format: int32
                createdAt:
                    type: string
                    format: date-time
                anchorRecordId:
                    type: string
                    description: |-
                        The session's anchor — the report entry; absent while nothing
                         scored. The line carries no verdict of its own: the composite face
                         reads GetSessionReport with this id.
        cyber.esports.v1.DualZoneBehavior:
            type: object
            properties:
                elapsedMs:
                    type: integer
                    format: int32
                zone:
                    type: string
                    description: Open vocabulary {left | right} — legacy LEFT/RIGHT lowercased.
                event:
                    type: string
                    description: Open vocabulary {collision | dodge}.
                position:
                    $ref: '#/components/schemas/cyber.esports.v1.Point'
                obstacleId:
                    type: integer
                    format: int32
        cyber.esports.v1.DualZoneDetail:
            type: object
            properties:
                behaviors:
                    type: array
                    items:
                        $ref: '#/components/schemas/cyber.esports.v1.DualZoneBehavior'
            description: |-
                dual_zone — two-lane dodging; the behavior stream carries zone sides and
                 collision/dodge events with optional geometry.
        cyber.esports.v1.EconomicSimDetail:
            type: object
            properties:
                lastHits:
                    type: array
                    items:
                        $ref: '#/components/schemas/cyber.esports.v1.EconomicSimLastHit'
                purchases:
                    type: array
                    items:
                        $ref: '#/components/schemas/cyber.esports.v1.EconomicSimPurchase'
                missedMinions:
                    type: integer
                    description: |-
                        Minions that died untended — a missed lane creep leaves no event, so
                         the count rides the top level (legacy missedMinions).
                    format: int32
                finalHealthHp:
                    type: integer
                    description: Terminal health on the legacy 0-1500 hp wire scale (health% × 15).
                    format: int32
            description: economic_sim — last-hitting and spending economy.
        cyber.esports.v1.EconomicSimLastHit:
            type: object
            properties:
                elapsedMs:
                    type: integer
                    format: int32
                isLastHit:
                    type: boolean
                goldEarned:
                    type: integer
                    format: int32
                minionType:
                    type: string
                    description: Open vocabulary {melee | ranged | cannon} — the minion on the block.
                minionHealth:
                    type: integer
                    description: |-
                        The minion's remaining health at the tap — the window verdict is a
                         server-side judgment from it (legacy judged client-side).
                    format: int32
        cyber.esports.v1.EconomicSimPurchase:
            type: object
            properties:
                elapsedMs:
                    type: integer
                    format: int32
                itemName:
                    type: string
                cost:
                    type: integer
                    format: int32
        cyber.esports.v1.ExportActivationCodesRequest:
            type: object
            properties:
                batchNo:
                    type: string
                    description: |-
                        An export hands out usable code values — that hand-out is the
                         sensitive act, so the RPC carries ACTION_WRITE and lands one audit
                         line per export even though it changes nothing.
                         Absent = every batch; present = the named batch's codes.
                codeStatus:
                    enum:
                        - ACTIVATION_CODE_STATUS_UNSPECIFIED
                        - ACTIVATION_CODE_STATUS_UNUSED
                        - ACTIVATION_CODE_STATUS_REDEEMED
                    type: string
                    description: |-
                        Absent = every code; the natural ask is the unredeemed remainder an
                         operator is about to hand out.
                    format: enum
                code:
                    type: string
                    description: |-
                        Same find-one filter as the list — an export answers the visible
                         filter, never a wider set.
        cyber.esports.v1.ExportActivationCodesResponse:
            type: object
            properties:
                codes:
                    type: array
                    items:
                        $ref: '#/components/schemas/cyber.esports.v1.ActivationCode'
                    description: |-
                        The whole filtered set in one answer, no paging — a batch tops out
                         at a thousand codes, so the export stays one payload.
        cyber.esports.v1.ExportAgreementConsentsRequest:
            type: object
            properties:
                doc:
                    enum:
                        - AGREEMENT_DOC_UNSPECIFIED
                        - AGREEMENT_DOC_USER
                        - AGREEMENT_DOC_PRIVACY
                    type: string
                    description: |-
                        Same filters as the list — an export answers the visible filter,
                         never a wider set. The whole filtered set in one answer, no paging:
                         an operator export is bounded by how narrow they filtered, and the
                         day that stops being true is the day this grows a streaming shape.
                    format: enum
                versionNo:
                    type: string
                keyword:
                    type: string
                createdAtA:
                    type: string
                    format: date-time
                createdAtZ:
                    type: string
                    format: date-time
        cyber.esports.v1.ExportAgreementConsentsResponse:
            type: object
            properties:
                consents:
                    type: array
                    items:
                        $ref: '#/components/schemas/cyber.esports.v1.AgreementConsent'
        cyber.esports.v1.Feedback:
            type: object
            properties:
                id:
                    type: string
                category:
                    enum:
                        - FEEDBACK_CATEGORY_UNSPECIFIED
                        - FEEDBACK_CATEGORY_FEATURE_BUG
                        - FEEDBACK_CATEGORY_ASSESSMENT
                        - FEEDBACK_CATEGORY_REPORT
                        - FEEDBACK_CATEGORY_PAYMENT
                        - FEEDBACK_CATEGORY_ACCOUNT
                        - FEEDBACK_CATEGORY_OTHER
                    type: string
                    format: enum
                content:
                    type: string
                contact:
                    type: string
                    description: |-
                        Where the operator may reach the member, offered optionally at
                         submit; absent is the member choosing in-app contact only.
                status:
                    enum:
                        - FEEDBACK_STATUS_UNSPECIFIED
                        - FEEDBACK_STATUS_PENDING
                        - FEEDBACK_STATUS_REPLIED
                        - FEEDBACK_STATUS_CLOSED
                    type: string
                    format: enum
                createdAt:
                    type: string
                    format: date-time
                updatedAt:
                    type: string
                    format: date-time
            description: |-
                The ticket root: what the list row renders. Content is denormalized
                 as the conversation's first message so the list needs no join.
        cyber.esports.v1.FeedbackMessage:
            type: object
            properties:
                id:
                    type: string
                sender:
                    enum:
                        - FEEDBACK_MESSAGE_SENDER_UNSPECIFIED
                        - FEEDBACK_MESSAGE_SENDER_USER
                        - FEEDBACK_MESSAGE_SENDER_ADMIN
                    type: string
                    format: enum
                content:
                    type: string
                createdAt:
                    type: string
                    format: date-time
            description: |-
                One turn of the conversation, oldest first — the initial submission
                 included, so the detail is one ordered list.
        cyber.esports.v1.FeedbackTicket:
            type: object
            properties:
                id:
                    type: string
                userId:
                    type: string
                nickname:
                    type: string
                    description: |-
                        The local profile's nickname; a member without one keeps null —
                         the honest shape, never an error.
                category:
                    enum:
                        - FEEDBACK_CATEGORY_UNSPECIFIED
                        - FEEDBACK_CATEGORY_FEATURE_BUG
                        - FEEDBACK_CATEGORY_ASSESSMENT
                        - FEEDBACK_CATEGORY_REPORT
                        - FEEDBACK_CATEGORY_PAYMENT
                        - FEEDBACK_CATEGORY_ACCOUNT
                        - FEEDBACK_CATEGORY_OTHER
                    type: string
                    format: enum
                content:
                    type: string
                contact:
                    type: string
                status:
                    enum:
                        - FEEDBACK_STATUS_UNSPECIFIED
                        - FEEDBACK_STATUS_PENDING
                        - FEEDBACK_STATUS_REPLIED
                        - FEEDBACK_STATUS_CLOSED
                    type: string
                    format: enum
                createdAt:
                    type: string
                    format: date-time
                updatedAt:
                    type: string
                    format: date-time
            description: |-
                The operator's ticket row: the member ticket with the nickname fold,
                 so the queue reads one table instead of joining the profile plane.
        cyber.esports.v1.FlashAimingDetail:
            type: object
            properties:
                shots:
                    type: array
                    items:
                        $ref: '#/components/schemas/cyber.esports.v1.FlashAimingShot'
                misses:
                    type: integer
                    description: |-
                        Expired-or-replaced targets, legacy: targetsMissed. No click exists for
                         these, so the shot stream can never rebuild the count.
                    format: int32
            description: flash_aiming — snap shots at flashing targets.
        cyber.esports.v1.FlashAimingShot:
            type: object
            properties:
                targetId:
                    type: string
                target:
                    $ref: '#/components/schemas/cyber.esports.v1.Point'
                targetSize:
                    type: number
                    format: double
                click:
                    $ref: '#/components/schemas/cyber.esports.v1.Point'
                deviation:
                    type: number
                    format: double
                aimTimeMs:
                    type: integer
                    format: int32
        cyber.esports.v1.FollowUpFeedbackRequest:
            type: object
            properties:
                feedbackId:
                    type: string
                content:
                    type: string
        cyber.esports.v1.FollowUpFeedbackResponse:
            type: object
            properties:
                feedback:
                    allOf:
                        - $ref: '#/components/schemas/cyber.esports.v1.Feedback'
                    description: 'The ticket as it stands after the follow-up: pending again.'
        cyber.esports.v1.Game:
            type: object
            properties:
                id:
                    type: string
                    description: |-
                        Immutable code join key (e.g. "lol") — same law as tenant/population
                         codes: born once, referenced forever.
                name:
                    type: string
                category:
                    type: string
                    description: |-
                        Seeded fps/moba; the vocabulary is admin-managed and open — new
                         categories classify in without a contract change.
                iconUrl:
                    type: string
                description:
                    type: string
                createdAt:
                    type: string
                    format: date-time
                updatedAt:
                    type: string
                    format: date-time
        cyber.esports.v1.GamePreferenceInput:
            type: object
            properties:
                gameIds:
                    type: array
                    items:
                        type: string
                customNames:
                    type: array
                    items:
                        type: string
        cyber.esports.v1.GenerateActivationCodesRequest:
            type: object
            properties:
                reportType:
                    enum:
                        - REPORT_TYPE_UNSPECIFIED
                        - REPORT_TYPE_COGNITIVE
                        - REPORT_TYPE_CAREER
                        - REPORT_TYPE_SCHOOL
                    type: string
                    format: enum
                count:
                    type: integer
                    format: int32
                expireDays:
                    type: integer
                    format: int32
        cyber.esports.v1.GenerateActivationCodesResponse:
            type: object
            properties:
                codes:
                    type: array
                    items:
                        type: string
                    description: |-
                        The codes in full, this once and on every later list — generation
                         answers what was minted so the operator hands them out.
                batchNo:
                    type: string
                    description: |-
                        The batch these codes share — the handle for the detail page and
                         every later status flip. Plain string, not a wrapper: generation
                         succeeded means the batch exists, absence is not a state this field
                         can carry.
        cyber.esports.v1.GetAbilityDigestRequest:
            type: object
            properties: {}
        cyber.esports.v1.GetAbilityDigestResponse:
            type: object
            properties:
                sessionsTotal:
                    type: integer
                    description: |-
                        Sessions carrying at least one valid attempt — practice runs never
                         count as sessions.
                    format: int32
                sessionsFps:
                    type: integer
                    format: int32
                sessionsMoba:
                    type: integer
                    format: int32
                abilities:
                    type: array
                    items:
                        $ref: '#/components/schemas/cyber.esports.v1.DigestAbilityLine'
                    description: |-
                        One line per measured ability of the six-word vocabulary; an untested
                         ability is an absent entry, never a zero row (the covered-count face
                         reads the absence).
                sessions:
                    type: array
                    items:
                        $ref: '#/components/schemas/cyber.esports.v1.DigestSessionLine'
                    description: |-
                        The latest session line per genre — at most one row each, absent
                         when the genre was never played.
                reportAccess:
                    allOf:
                        - $ref: '#/components/schemas/cyber.esports.v1.ReportAccessVerdict'
                    description: |-
                        The cognitive family's gate, folded from the same three facts the
                         gated faces read — the entry page's two report cards key their
                         unlock tags on this one verdict, so the center needs no second call.
                trendAdvancedAccess:
                    allOf:
                        - $ref: '#/components/schemas/cyber.esports.v1.ReportAccessVerdict'
                    description: |-
                        The trend page's advanced-tier gate — the trend entry card's
                         advanced/base tag reads this, the same verdict the trend face itself
                         embeds; the base tier stays free for anyone who has tested.
                membershipUnlockedReports:
                    type: integer
                    description: |-
                        How many reports this account unlocked inside member windows — each
                         such row is permanent, so the count is all-time, never per-period
                         (the admin plane's per-window attribution is a different fold). The
                         profile member card's "kept forever" count line reads it off this
                         same call. Plain scalar: the count exists whenever the call
                         succeeds, and the card renders a true zero as zero (a member who has
                         tested nothing), never as unknown.
                    format: int32
                lastMembershipUntil:
                    type: string
                    description: |-
                        The furthest window end among standing-status rows, live or lapsed —
                         null only when the account never held one (an admin-terminated window
                         folds away with its revoked status). The member page's three-state
                         fold reads this one fact: member_until answers liveness only, and a
                         naturally-lapsed window drops to null there while its end date lives
                         on here.
                    format: date-time
        cyber.esports.v1.GetAgreementCurrentResponse:
            type: object
            properties:
                docs:
                    type: array
                    items:
                        $ref: '#/components/schemas/cyber.esports.v1.AgreementCurrent'
                    description: |-
                        One row per document that has a current version; a document without
                         one is absent, and the legal page falls back to its placeholder.
        cyber.esports.v1.GetCareerReportRequest:
            type: object
            properties: {}
        cyber.esports.v1.GetCareerReportResponse:
            type: object
            properties:
                access:
                    allOf:
                        - $ref: '#/components/schemas/cyber.esports.v1.ReportAccessVerdict'
                    description: |-
                        Career is open by the standing default; the verdict carries the
                         policy word if the operator closed or member-gated it.
                recommendations:
                    type: array
                    items:
                        $ref: '#/components/schemas/cyber.esports.v1.CareerRecommendation'
                    description: |-
                        Career areas ordered by match, descending. The area vocabulary and
                         its library facts (elimination rate, training intensity, advice)
                         are seeded server-side and travel with the rows — library copy is
                         data, not page wording.
                improvements:
                    type: array
                    items:
                        $ref: '#/components/schemas/cyber.esports.v1.CareerImprovement'
                    description: |-
                        The gap board and the prescription cards render from one array:
                         weakest dimensions first, the target line and suggestions carried
                         per row so the client never hardcodes a rubric constant.
        cyber.esports.v1.GetCognitiveReportRequest:
            type: object
            properties: {}
        cyber.esports.v1.GetCognitiveReportResponse:
            type: object
            properties:
                access:
                    allOf:
                        - $ref: '#/components/schemas/cyber.esports.v1.ReportAccessVerdict'
                    description: |-
                        Cognitive is closed to the ToC member by default; the verdict's
                         reason names which fact answered — policy, membership, or a
                         redeemed code.
                coveredAbilities:
                    type: integer
                    description: |-
                        How many of the six-word ability vocabulary the member has measured
                         — the report header's covered count. Not gate-sensitive: the digest
                         face answers the same number to anyone.
                    format: int32
                testedDimensions:
                    type: integer
                    description: |-
                        How many dimension rows carry a value, over the eight the model
                         defines — the completeness headline, same shape the record board
                         carries.
                    format: int32
                totalDimensions:
                    type: integer
                    format: int32
                dimensions:
                    type: array
                    items:
                        $ref: '#/components/schemas/cyber.esports.v1.CognitiveDimension'
                    description: |-
                        Only dimensions whose every source ability has both a history-best
                         score and a cohort answer; a partially-fed dimension is an absent
                         row, never a zero axis — the same missing-never-zero law the record
                         board holds. Values are the weighted sum of the source abilities'
                         history-best percentiles, rounded to integers, weights server-side
                         and single-sourced.
                composite:
                    type: number
                    description: |-
                        Equal-weight mean over the rendered dimensions only — a missing
                         dimension never counts as zero. Null when no dimension rendered.
                    format: double
                tier:
                    enum:
                        - REPORT_TIER_UNSPECIFIED
                        - REPORT_TIER_S
                        - REPORT_TIER_A
                        - REPORT_TIER_B
                        - REPORT_TIER_C
                    type: string
                    description: |-
                        The composite's tier under the same ladder the record board judges
                         by; UNSPECIFIED while the composite is null.
                    format: enum
                trendAdvancedAccess:
                    allOf:
                        - $ref: '#/components/schemas/cyber.esports.v1.ReportAccessVerdict'
                    description: |-
                        The trend page's advanced gate — the to-trend CTA is an upsell that
                         renders only while the advanced tier is closed, so the verdict
                         travels with this face too; a member never meets the upsell aimed
                         at themselves.
        cyber.esports.v1.GetComplianceConfigResponse:
            type: object
            properties:
                config:
                    $ref: '#/components/schemas/cyber.esports.v1.ComplianceConfig'
        cyber.esports.v1.GetFeedbackResponse:
            type: object
            properties:
                ticket:
                    $ref: '#/components/schemas/cyber.esports.v1.FeedbackTicket'
                messages:
                    type: array
                    items:
                        $ref: '#/components/schemas/cyber.esports.v1.FeedbackMessage'
                    description: The conversation, oldest first, initial submission included.
        cyber.esports.v1.GetMatchSessionResponse:
            type: object
            properties:
                session:
                    $ref: '#/components/schemas/cyber.esports.v1.MatchSession'
                created:
                    type: boolean
                    description: |-
                        True when this call created the session (intro face); false when a
                         session resumed (continue face). Success implies present.
        cyber.esports.v1.GetMemberResponse:
            type: object
            properties:
                member:
                    $ref: '#/components/schemas/cyber.esports.v1.Member'
        cyber.esports.v1.GetMembershipResponse:
            type: object
            properties:
                membership:
                    $ref: '#/components/schemas/cyber.esports.v1.MembershipSummary'
                periods:
                    type: array
                    items:
                        $ref: '#/components/schemas/cyber.esports.v1.MembershipPeriod'
                    description: Newest first.
                ageBand:
                    type: string
                    description: |-
                        Identity header facts beside the membership: derived age band, the
                         three-state sex the profile carries, and the wechat binding fact from
                         the system identity.
                sex:
                    enum:
                        - PROFILE_SEX_UNSPECIFIED
                        - PROFILE_SEX_MALE
                        - PROFILE_SEX_FEMALE
                        - PROFILE_SEX_UNDETERMINED
                    type: string
                    format: enum
                wechatBound:
                    type: boolean
        cyber.esports.v1.GetMyFeedbackResponse:
            type: object
            properties:
                feedback:
                    $ref: '#/components/schemas/cyber.esports.v1.Feedback'
                messages:
                    type: array
                    items:
                        $ref: '#/components/schemas/cyber.esports.v1.FeedbackMessage'
        cyber.esports.v1.GetOrderResponse:
            type: object
            properties:
                order:
                    $ref: '#/components/schemas/cyber.esports.v1.Order'
        cyber.esports.v1.GetPaymentOrderResponse:
            type: object
            properties:
                order:
                    $ref: '#/components/schemas/cyber.esports.v1.AdminOrder'
                unlock:
                    allOf:
                        - $ref: '#/components/schemas/cyber.esports.v1.OrderUnlockView'
                    description: Absent on a pending order — nothing has unlocked yet.
        cyber.esports.v1.GetProfileResponse:
            type: object
            properties:
                profile:
                    $ref: '#/components/schemas/cyber.esports.v1.Profile'
                memberUntil:
                    type: string
                    description: |-
                        The furthest live membership window's end; null = no live membership —
                         the same liveness read the merge preview promises, riding the probe the
                         home greet already reads so membership adds no extra call. Clients
                         render presence, never re-derive expiry.
                    format: date-time
        cyber.esports.v1.GetReportAccessResponse:
            type: object
            properties:
                allowed:
                    type: boolean
                    description: |-
                        Plain bool by design: two states are the whole vocabulary — there is
                         no third "absent" reading a wrapper would preserve.
                reason:
                    enum:
                        - REPORT_ACCESS_REASON_UNSPECIFIED
                        - REPORT_ACCESS_REASON_POLICY_OPEN
                        - REPORT_ACCESS_REASON_MEMBERSHIP_ACTIVE
                        - REPORT_ACCESS_REASON_CODE_REDEEMED
                        - REPORT_ACCESS_REASON_POLICY_CLOSED
                        - REPORT_ACCESS_REASON_NO_ENTITLEMENT
                    type: string
                    format: enum
        cyber.esports.v1.GetReportRequest:
            type: object
            properties:
                recordId:
                    type: string
        cyber.esports.v1.GetReportResponse:
            type: object
            properties:
                recordId:
                    type: string
                unlocked:
                    type: boolean
                    description: The unlock state at read time — the ledger's answer, never this face's.
                tier:
                    enum:
                        - REPORT_TIER_UNSPECIFIED
                        - REPORT_TIER_S
                        - REPORT_TIER_A
                        - REPORT_TIER_B
                        - REPORT_TIER_C
                    type: string
                    description: |-
                        The tier badge renders in the free tier, S/A/B/C by the composite
                         percentile (top 5/15/40 percent); once the record is unlocked the
                         snapshot pins the badge so later rubric changes never move it.
                    format: enum
                compositePercentile:
                    type: number
                    description: |-
                        The composite percentile: the equal-weight mean of the measured
                         abilities' percentiles — a missing ability never counts as zero.
                         Null when no measured ability carries a percentile at all.
                    format: double
                abilities:
                    type: array
                    items:
                        $ref: '#/components/schemas/cyber.esports.v1.ReportAbility'
                    description: |-
                        The measured primary abilities, one radar axis each; a missing
                         ability is an absent entry, never a zero axis.
                subAbilities:
                    type: array
                    items:
                        $ref: '#/components/schemas/cyber.esports.v1.ReportAbility'
                    description: |-
                        The genre's secondary contributions (fps: decisionEfficiency; moba:
                         aimingAccuracy and trackingStability) — radar satellites, same shape.
                comparison:
                    allOf:
                        - $ref: '#/components/schemas/cyber.esports.v1.ReportComparison'
                    description: |-
                        Unlocked-only: how each ability moved against the same ability on
                         this member's previous attempt — the previous session's record, not
                         the previous retry inside this one.
                improvements:
                    type: array
                    items:
                        $ref: '#/components/schemas/cyber.esports.v1.ReportImprovement'
                    description: |-
                        Unlocked-only: the improvement board, weakest abilities first. The
                         target is the tier ladder's excellence line (the A threshold),
                         expressed in the same percentile currency as everything else.
                testedDimensions:
                    type: integer
                    description: |-
                        The completeness headline: how many of the record's genre-order
                         abilities were measured, over how many the genre orders.
                    format: int32
                totalDimensions:
                    type: integer
                    format: int32
        cyber.esports.v1.GetSessionReportRequest:
            type: object
            properties:
                sessionId:
                    type: string
        cyber.esports.v1.GetSessionReportResponse:
            type: object
            properties:
                sessionId:
                    type: string
                genre:
                    type: string
                anchorRecordId:
                    type: string
                    description: |-
                        The session's latest scored record — the composite verdict's owner;
                         absent while nothing scored (the same derivation the match face
                         carries, never this face's to claim).
                tier:
                    enum:
                        - REPORT_TIER_UNSPECIFIED
                        - REPORT_TIER_S
                        - REPORT_TIER_A
                        - REPORT_TIER_B
                        - REPORT_TIER_C
                    type: string
                    description: |-
                        The anchor's verdict: the frozen snapshot when one exists, the live
                         judgement otherwise — the free tier's own law, same as the record
                         board. UNSPECIFIED while no anchor exists.
                    format: enum
                compositePercentile:
                    type: number
                    format: double
                abilities:
                    type: array
                    items:
                        $ref: '#/components/schemas/cyber.esports.v1.SessionAbilityLine'
                    description: |-
                        One line per ability the session measured, in the lineup's order —
                         an unmeasured step never lands a line, never a zero line.
                testedDimensions:
                    type: integer
                    description: The completeness headline over the genre's ordered abilities.
                    format: int32
                totalDimensions:
                    type: integer
                    format: int32
                startedAt:
                    type: string
                    format: date-time
                attemptDetails:
                    type: array
                    items:
                        $ref: '#/components/schemas/cyber.esports.v1.SessionAttemptDetail'
                    description: |-
                        Every valid attempt the session's lineup admitted, in submit order —
                         the read-back detail rows, the detail-row group's single source. A
                         curve-pending attempt rides the same list with a null authoritative
                         score: the score the member earned is visible the moment it exists,
                         never held hostage to the game's calibration curve (curves freeze
                         one game at a time). The per-line attempt_scores stay the calibrated
                         receipt; this list is the full truth, pending rows included.
        cyber.esports.v1.GetTestAttemptResponse:
            type: object
            properties:
                attempt:
                    $ref: '#/components/schemas/cyber.esports.v1.TestAttemptRow'
                rawDetail:
                    type: object
                    description: |-
                        The raw fact stream as stored — the audit trail behind the verdict,
                         presented verbatim rather than re-typed per engine.
        cyber.esports.v1.GetTestConfigResponse:
            type: object
            properties:
                config:
                    $ref: '#/components/schemas/cyber.esports.v1.TestConfig'
        cyber.esports.v1.GetTestResponse:
            type: object
            properties:
                test:
                    $ref: '#/components/schemas/cyber.esports.v1.Test'
                introduction:
                    type: string
                    description: |-
                        Long-form how-to copy, per test — seeded from the six ability texts
                         and free to diverge per test; copy changes are content, never contract.
        cyber.esports.v1.GetTrendReportRequest:
            type: object
            properties: {}
        cyber.esports.v1.GetTrendReportResponse:
            type: object
            properties:
                sessionsTotal:
                    type: integer
                    description: |-
                        Sessions carrying at least one scored record — the same count the
                         digest face answers; zero renders the honest empty page.
                    format: int32
                abilities:
                    type: array
                    items:
                        $ref: '#/components/schemas/cyber.esports.v1.TrendAbilitySeries'
                    description: |-
                        One series per ability that carries at least one cohort-answered
                         point; an ability with no answer is an absent series, never a flat
                         zero line.
                advancedAccess:
                    allOf:
                        - $ref: '#/components/schemas/cyber.esports.v1.ReportAccessVerdict'
                    description: |-
                        The advanced tier's gate (cross-report comparison, prescriptions,
                         percentile drift) rides the membership verdict — the base tier is
                         free for anyone who has tested. The advanced content itself is a
                         later face; the verdict travels now so the page renders its locked
                         state from one call.
        cyber.esports.v1.GetUnreadCountResponse:
            type: object
            properties:
                count:
                    type: integer
                    description: |-
                        Plain scalar: the count exists whenever the call succeeds, and the
                         badge renders a true zero as zero, never as unknown.
                    format: int32
        cyber.esports.v1.GrantMembershipRequest:
            type: object
            properties:
                userId:
                    type: string
                skuCode:
                    type: string
            description: |-
                grantMembership — the operator's manual twin of a settled order: the
                 same ledger row the settle path writes, with "manual" as the granting
                 artifact, and the start picked by the ledger (now, or the live period's
                 expiry when one exists — renewal means seamless continuation).
        cyber.esports.v1.GrantMembershipResponse:
            type: object
            properties:
                membership:
                    $ref: '#/components/schemas/cyber.esports.v1.MembershipSummary'
        cyber.esports.v1.ListActivationBatchesResponse:
            type: object
            properties:
                page:
                    $ref: '#/components/schemas/cyber.shared.common.v1.PageResponse'
                batches:
                    type: array
                    items:
                        $ref: '#/components/schemas/cyber.esports.v1.ActivationBatch'
                    description: Newest batch first.
                totalBatches:
                    type: integer
                    description: |-
                        Fold over every batch, independent of the applied filters — the
                         footer's one count line instead of one query per number.
                    format: int32
                totalCodes:
                    type: integer
                    format: int32
                usedCodes:
                    type: integer
                    format: int32
        cyber.esports.v1.ListActivationCodesResponse:
            type: object
            properties:
                page:
                    $ref: '#/components/schemas/cyber.shared.common.v1.PageResponse'
                codes:
                    type: array
                    items:
                        $ref: '#/components/schemas/cyber.esports.v1.ActivationCode'
        cyber.esports.v1.ListAgreementConsentsResponse:
            type: object
            properties:
                page:
                    $ref: '#/components/schemas/cyber.shared.common.v1.PageResponse'
                consents:
                    type: array
                    items:
                        $ref: '#/components/schemas/cyber.esports.v1.AgreementConsent'
                    description: Newest first.
        cyber.esports.v1.ListAgreementVersionsResponse:
            type: object
            properties:
                versions:
                    type: array
                    items:
                        $ref: '#/components/schemas/cyber.esports.v1.AgreementVersion'
                    description: |-
                        Current version first per document, then the rest newest-effective
                         first; no paging — a document's version ledger is a handful of rows.
        cyber.esports.v1.ListAnnouncementsResponse:
            type: object
            properties:
                announcements:
                    type: array
                    items:
                        $ref: '#/components/schemas/cyber.esports.v1.Announcement'
                    description: |-
                        Newest created first — an announcement ledger is a handful of rows
                         per season, no paging.
        cyber.esports.v1.ListBannersResponse:
            type: object
            properties:
                banners:
                    type: array
                    items:
                        $ref: '#/components/schemas/cyber.esports.v1.Banner'
                    description: |-
                        A banner set is a handful of rows by nature — newest published
                         first, no paging.
        cyber.esports.v1.ListCatalogSkusResponse:
            type: object
            properties:
                skus:
                    type: array
                    items:
                        $ref: '#/components/schemas/cyber.esports.v1.AdminSku'
        cyber.esports.v1.ListFeedbacksResponse:
            type: object
            properties:
                page:
                    $ref: '#/components/schemas/cyber.shared.common.v1.PageResponse'
                tickets:
                    type: array
                    items:
                        $ref: '#/components/schemas/cyber.esports.v1.FeedbackTicket'
                    description: |-
                        Newest first — the table's reading order; the seat's working
                         filter (the state segments) narrows it to the queue.
        cyber.esports.v1.ListGamesResponse:
            type: object
            properties:
                games:
                    type: array
                    items:
                        $ref: '#/components/schemas/cyber.esports.v1.Game'
        cyber.esports.v1.ListMembersResponse:
            type: object
            properties:
                page:
                    $ref: '#/components/schemas/cyber.shared.common.v1.PageResponse'
                members:
                    type: array
                    items:
                        $ref: '#/components/schemas/cyber.esports.v1.Member'
        cyber.esports.v1.ListMembershipsResponse:
            type: object
            properties:
                page:
                    $ref: '#/components/schemas/cyber.shared.common.v1.PageResponse'
                memberships:
                    type: array
                    items:
                        $ref: '#/components/schemas/cyber.esports.v1.MembershipSummary'
                totalCount:
                    type: integer
                    description: |-
                        Status fold over every member holding a membership row, independent
                         of the applied filters — the tabs and the footer count line read one
                         answer instead of one query each.
                    format: int32
                activeCount:
                    type: integer
                    format: int32
                expiringSoonCount:
                    type: integer
                    format: int32
                expiredCount:
                    type: integer
                    format: int32
        cyber.esports.v1.ListMessagesResponse:
            type: object
            properties:
                page:
                    $ref: '#/components/schemas/cyber.shared.common.v1.PageResponse'
                messages:
                    type: array
                    items:
                        $ref: '#/components/schemas/cyber.esports.v1.Message'
                    description: Newest first.
                unreadCount:
                    type: integer
                    description: |-
                        Plain scalar: the count exists whenever the call succeeds, and the
                         badge renders a true zero as zero, never as unknown.
                    format: int32
        cyber.esports.v1.ListMyFeedbacksResponse:
            type: object
            properties:
                page:
                    $ref: '#/components/schemas/cyber.shared.common.v1.PageResponse'
                feedbacks:
                    type: array
                    items:
                        $ref: '#/components/schemas/cyber.esports.v1.Feedback'
                    description: |-
                        Most recently active first — a ticket with a fresh answer or
                         follow-up jumps the queue.
        cyber.esports.v1.ListOrdersResponse:
            type: object
            properties:
                page:
                    $ref: '#/components/schemas/cyber.shared.common.v1.PageResponse'
                orders:
                    type: array
                    items:
                        $ref: '#/components/schemas/cyber.esports.v1.Order'
        cyber.esports.v1.ListPaymentOrdersResponse:
            type: object
            properties:
                page:
                    $ref: '#/components/schemas/cyber.shared.common.v1.PageResponse'
                orders:
                    type: array
                    items:
                        $ref: '#/components/schemas/cyber.esports.v1.AdminOrder'
        cyber.esports.v1.ListQuestionBankResponse:
            type: object
            properties:
                page:
                    $ref: '#/components/schemas/cyber.shared.common.v1.PageResponse'
                questions:
                    type: array
                    items:
                        $ref: '#/components/schemas/cyber.esports.v1.QuestionBankRow'
        cyber.esports.v1.ListReportAccessPoliciesResponse:
            type: object
            properties:
                policies:
                    type: array
                    items:
                        $ref: '#/components/schemas/cyber.esports.v1.ReportPolicyRow'
        cyber.esports.v1.ListSkusResponse:
            type: object
            properties:
                skus:
                    type: array
                    items:
                        $ref: '#/components/schemas/cyber.esports.v1.Sku'
                payGate:
                    $ref: '#/components/schemas/cyber.esports.v1.PayGate'
        cyber.esports.v1.ListTestAttemptsResponse:
            type: object
            properties:
                page:
                    $ref: '#/components/schemas/cyber.shared.common.v1.PageResponse'
                attempts:
                    type: array
                    items:
                        $ref: '#/components/schemas/cyber.esports.v1.TestAttemptRow'
        cyber.esports.v1.ListTestsResponse:
            type: object
            properties:
                tests:
                    type: array
                    items:
                        $ref: '#/components/schemas/cyber.esports.v1.Test'
        cyber.esports.v1.ListUserMessagesResponse:
            type: object
            properties:
                page:
                    $ref: '#/components/schemas/cyber.shared.common.v1.PageResponse'
                messages:
                    type: array
                    items:
                        $ref: '#/components/schemas/cyber.esports.v1.Message'
                    description: Newest first, the letterbox's own order.
                unreadCount:
                    type: integer
                    description: The same count the member's unread badge reads.
                    format: int32
        cyber.esports.v1.MarkAllMessagesReadRequest:
            type: object
            properties: {}
        cyber.esports.v1.MarkAllMessagesReadResponse:
            type: object
            properties: {}
        cyber.esports.v1.MarkMessageReadRequest:
            type: object
            properties:
                messageId:
                    type: string
        cyber.esports.v1.MarkMessageReadResponse:
            type: object
            properties: {}
            description: |-
                Empty on purpose: marking read is fire-and-forget — a message another
                 device already read (or a racing id) is the same outcome as success.
        cyber.esports.v1.MarkPaidRequest:
            type: object
            properties:
                orderNo:
                    type: string
        cyber.esports.v1.MarkPaidResponse:
            type: object
            properties:
                handled:
                    type: boolean
                    description: |-
                        True when the minted push settled the order — success implies the
                         value; the query surface converges the rest.
        cyber.esports.v1.MatchSession:
            type: object
            properties:
                id:
                    type: string
                genre:
                    type: string
                    description: |-
                        The session's type-axis value (fps|moba|...) — frozen at creation;
                         changing it is a new session, never a mutation.
                difficulty:
                    type: string
                    description: |-
                        Mode-axis word vocabulary: experience | standard; every attempt in
                         the session scores on this mode.
                steps:
                    type: array
                    items:
                        $ref: '#/components/schemas/cyber.esports.v1.MatchStep'
                    description: The locked arrangement, emitted in match_config render_order.
                done:
                    type: array
                    items:
                        type: string
                    description: |-
                        Step codes with at least one attempt record since session start —
                         derived from records, never client-asserted.
                retestLeft:
                    type: object
                    additionalProperties:
                        type: integer
                        format: int32
                    description: Remaining attempts per step code (budget minus records); the "N/3" face.
                createdAt:
                    type: string
                    format: date-time
                firstSession:
                    type: boolean
                    description: |-
                        True when this session is the member's first ever — the 3-vs-1 retest
                         budget face (the budget itself rides the session row).
                anchorRecordId:
                    type: string
                    description: |-
                        The session's latest scored record — the ability report's anchor.
                         Derived from records like done (never client-asserted); absent while
                         no record carries a score yet, so a finished-but-all-invalid session
                         honestly has no report to enter.
        cyber.esports.v1.MatchStep:
            type: object
            properties:
                ability:
                    type: string
                    description: |-
                        The ability the step was drawn for (a match_config row) and the drawn
                         test's catalog code — names hydrate client-side from the test list.
                testCode:
                    type: string
        cyber.esports.v1.Member:
            type: object
            properties:
                userId:
                    type: string
                    description: Identity part, hydrated from the system roster.
                account:
                    type: string
                avatar:
                    type: string
                enabled:
                    type: boolean
                registeredAt:
                    type: string
                    description: |-
                        The identity row's creation time — the registration trace the
                         identity core carries.
                    format: date-time
                nickname:
                    type: string
                    description: Profile part; an absent profile row renders as all-unset fields.
                birthYear:
                    type: integer
                    format: int32
                birthMonth:
                    type: integer
                    format: int32
                ageBand:
                    type: string
                games:
                    type: array
                    items:
                        $ref: '#/components/schemas/cyber.esports.v1.ProfileGame'
        cyber.esports.v1.MembershipPeriod:
            type: object
            properties:
                grantedAt:
                    type: string
                    format: date-time
                expiresAt:
                    type: string
                    format: date-time
                source:
                    enum:
                        - MEMBERSHIP_SOURCE_UNSPECIFIED
                        - MEMBERSHIP_SOURCE_ORDER
                        - MEMBERSHIP_SOURCE_MANUAL
                        - MEMBERSHIP_SOURCE_LEGACY_CODE
                    type: string
                    format: enum
                sourceRef:
                    type: string
                    description: |-
                        The raw source artifact — order number, "manual", or the legacy code
                         id — for support traceability.
                status:
                    enum:
                        - MEMBERSHIP_STATUS_UNSPECIFIED
                        - MEMBERSHIP_STATUS_ACTIVE
                        - MEMBERSHIP_STATUS_EXPIRING_SOON
                        - MEMBERSHIP_STATUS_EXPIRED
                        - MEMBERSHIP_STATUS_TERMINATED
                    type: string
                    format: enum
            description: |-
                One append-only renewal row of the history timeline. Termination and
                 renewal both add facts here; no row is ever rewritten out of history —
                 a superseded period keeps its own window and source.
        cyber.esports.v1.MembershipSummary:
            type: object
            properties:
                userId:
                    type: string
                nickname:
                    type: string
                    description: Local profile nickname; empty when the member is still lazy.
                phoneMasked:
                    type: string
                    description: |-
                        System identity projection — the number operators recognize members
                         by, never the raw digits.
                grantedAt:
                    type: string
                    description: |-
                        Period start. A first grant starts now; a renewal starts at the prior
                         period's expiry, so consecutive periods tile without gaps or overlaps.
                    format: date-time
                expiresAt:
                    type: string
                    format: date-time
                daysLeft:
                    type: integer
                    description: |-
                        Whole days left until expiry; null once the period is over (expired
                         or terminated) — the count line disappears with the period.
                    format: int32
                status:
                    enum:
                        - MEMBERSHIP_STATUS_UNSPECIFIED
                        - MEMBERSHIP_STATUS_ACTIVE
                        - MEMBERSHIP_STATUS_EXPIRING_SOON
                        - MEMBERSHIP_STATUS_EXPIRED
                        - MEMBERSHIP_STATUS_TERMINATED
                    type: string
                    format: enum
                source:
                    enum:
                        - MEMBERSHIP_SOURCE_UNSPECIFIED
                        - MEMBERSHIP_SOURCE_ORDER
                        - MEMBERSHIP_SOURCE_MANUAL
                        - MEMBERSHIP_SOURCE_LEGACY_CODE
                    type: string
                    format: enum
                periodCount:
                    type: integer
                    description: Periods so far, this one included — the renewal history's own count.
                    format: int32
                unlockCount:
                    type: integer
                    description: |-
                        Trials permanently unlocked inside this period — member-window grants
                         the expiry never takes back.
                    format: int32
            description: |-
                A member's current (or most recent) membership period with the facts
                 the lifecycle page reads: one row per member, the newest period
                 answering.
        cyber.esports.v1.MergeAccountSummary:
            type: object
            properties:
                userId:
                    type: string
                phoneMask:
                    type: string
                    description: Masked phone when the side holds an sms credential, else null.
                wechat:
                    type: boolean
                    description: True when the side holds a wechat credential.
                sessions:
                    type: integer
                    description: Distinct assessment sessions with a valid attempt.
                    format: int32
                memberUntil:
                    type: string
                    description: The furthest live membership window; null = no live membership.
                    format: date-time
                unlocked:
                    type: boolean
                    description: Any unlocked report family.
            description: |-
                One side's confirm-page facts. Identifier-shaped values arrive masked by
                 the system service; clients render, never re-derive. The plain scalars
                 (user_id, wechat, sessions, unlocked) ride the success-implies-present
                 carve-out: every preview computes them, so zero means a real zero (no
                 sessions, no wechat, nothing unlocked) — never "not computed".
        cyber.esports.v1.Message:
            type: object
            properties:
                id:
                    type: string
                type:
                    enum:
                        - MESSAGE_TYPE_UNSPECIFIED
                        - MESSAGE_TYPE_ANNOUNCEMENT
                        - MESSAGE_TYPE_REPORT
                        - MESSAGE_TYPE_MEMBERSHIP
                        - MESSAGE_TYPE_FEEDBACK_REPLY
                    type: string
                    format: enum
                title:
                    type: string
                content:
                    type: string
                refId:
                    type: string
                    description: |-
                        Present when the type carries a deep link — report holds the
                         attempt's id, feedback_reply the feedback id; absent otherwise.
                isRead:
                    type: boolean
                createdAt:
                    type: string
                    format: date-time
            description: One row of the member's letterbox.
        cyber.esports.v1.MovingTargetDetail:
            type: object
            properties:
                shots:
                    type: array
                    items:
                        $ref: '#/components/schemas/cyber.esports.v1.MovingTargetShot'
            description: |-
                moving_target — tracking across movement patterns; the pattern phase is a
                 fact the server needs to reproduce per-pattern aggregates (legacy had it
                 only as a client-side summary).
        cyber.esports.v1.MovingTargetShot:
            type: object
            properties:
                elapsedMs:
                    type: integer
                    format: int32
                target:
                    $ref: '#/components/schemas/cyber.esports.v1.Point'
                crosshair:
                    $ref: '#/components/schemas/cyber.esports.v1.Point'
                deviation:
                    type: number
                    format: double
                hit:
                    type: boolean
                pattern:
                    type: string
                    description: Open vocabulary {straight | curve | zigzag | circle | random | variable}.
        cyber.esports.v1.MultiTargetDetail:
            type: object
            properties:
                picks:
                    type: array
                    items:
                        $ref: '#/components/schemas/cyber.esports.v1.MultiTargetPick'
                missedHigh:
                    type: integer
                    description: |-
                        High-tier targets lost to expiry, legacy: missedHighValue. The picks
                         stream carries only picked targets, so the loss count has no other carrier.
                    format: int32
            description: |-
                multi_target — priority firing under value tiers. The legacy pick stream
                 carried no tier; the tier rides here now so the server can rebuild every
                 priority aggregate from facts.
        cyber.esports.v1.MultiTargetPick:
            type: object
            properties:
                targetId:
                    type: string
                tier:
                    type: string
                    description: Open vocabulary {high | medium | low | trap}.
                isHit:
                    type: boolean
                elapsedMs:
                    type: integer
                    format: int32
        cyber.esports.v1.NotifyPaymentRequest:
            type: object
            properties:
                provider:
                    type: string
                    description: |-
                        Provider name routing to the platform's payment container — the same
                         value set the platform configures (wechat, mock).
                headers:
                    type: object
                    additionalProperties:
                        type: string
                    description: |-
                        The push exactly as it arrived; the provider's Notifier verifies the
                         channel signature before anything settles. A map, not entries: the
                         channels signing payment pushes never repeat a header.
                body:
                    type: string
                    format: bytes
        cyber.esports.v1.NotifyPaymentResponse:
            type: object
            properties:
                handled:
                    type: boolean
                    description: |-
                        True when this face absorbed the event — settled, or a kind this build
                         audits by design (a refund logs and acks). False = parsed and verified
                         but nothing folded: the edge answers non-ack, so the channel's own
                         retries keep the event visible instead of silently dropping an unknown
                         money fact.
        cyber.esports.v1.NumberStarsClick:
            type: object
            properties:
                number:
                    type: integer
                    format: int32
                elapsedMs:
                    type: integer
                    format: int32
                position:
                    $ref: '#/components/schemas/cyber.esports.v1.Point'
        cyber.esports.v1.NumberStarsDetail:
            type: object
            properties:
                rounds:
                    type: array
                    items:
                        $ref: '#/components/schemas/cyber.esports.v1.NumberStarsRound'
            description: |-
                number_stars — numeric sequence tapping; the round's target sequence plus
                 the click stream let the server rebuild accuracy and decision intervals
                 (legacy asserted isCorrect/expectedNumber client-side — now derived).
        cyber.esports.v1.NumberStarsRound:
            type: object
            properties:
                roundNumber:
                    type: integer
                    format: int32
                numbers:
                    type: array
                    items:
                        type: integer
                        format: int32
                clicks:
                    type: array
                    items:
                        $ref: '#/components/schemas/cyber.esports.v1.NumberStarsClick'
        cyber.esports.v1.OffenseDefenseDecision:
            type: object
            properties:
                scenarioId:
                    type: string
                choice:
                    type: string
                    description: Open vocabulary {attack | defense | retreat}; absent = unanswered.
                decisionTimeMs:
                    type: integer
                    format: int32
                timeout:
                    type: boolean
        cyber.esports.v1.OffenseDefenseDetail:
            type: object
            properties:
                decisions:
                    type: array
                    items:
                        $ref: '#/components/schemas/cyber.esports.v1.OffenseDefenseDecision'
            description: |-
                offense_defense — scenario decisions; correctness is judged server-side
                 against the scenario answer key (legacy isCorrect dropped).
        cyber.esports.v1.OfflineAnnouncementRequest:
            type: object
            properties:
                announcementId:
                    type: string
        cyber.esports.v1.OfflineAnnouncementResponse:
            type: object
            properties:
                announcement:
                    $ref: '#/components/schemas/cyber.esports.v1.Announcement'
        cyber.esports.v1.Order:
            type: object
            properties:
                orderNo:
                    type: string
                skuCode:
                    type: string
                scope:
                    enum:
                        - ORDER_SCOPE_UNSPECIFIED
                        - ORDER_SCOPE_TRIAL
                        - ORDER_SCOPE_PERIOD
                    type: string
                    format: enum
                scopeRef:
                    type: string
                    description: |-
                        Trial: the test record this order unlocks. Period: null — the window
                         shape comes from the sku.
                provider:
                    type: string
                channel:
                    type: string
                amountFen:
                    type: string
                state:
                    enum:
                        - ORDER_STATE_UNSPECIFIED
                        - ORDER_STATE_PENDING
                        - ORDER_STATE_PAID
                        - ORDER_STATE_CLOSED
                    type: string
                    format: enum
                transactionId:
                    type: string
                    description: Channel transaction id once paid; null before.
                createdAt:
                    type: string
                    format: date-time
                expiresAt:
                    type: string
                    description: Payment deadline; the order is not payable after it.
                    format: date-time
                paidAt:
                    type: string
                    format: date-time
        cyber.esports.v1.OrderRefundView:
            type: object
            properties:
                refundNo:
                    type: string
                    description: The caller-minted channel idempotency key ('R'+order_no).
                channelRefundId:
                    type: string
                    description: The channel's own refund id — the support/portal join key.
                state:
                    enum:
                        - REFUND_STATE_UNSPECIFIED
                        - REFUND_STATE_PROCESSING
                        - REFUND_STATE_SUCCEEDED
                        - REFUND_STATE_ABNORMAL
                    type: string
                    format: enum
                amountFen:
                    type: string
                reason:
                    type: string
                    description: The operator's paper trail for the offline exception.
                refundedAt:
                    type: string
                    description: The channel-side success moment; null until the refund succeeds.
                    format: date-time
            description: What a paid order's one full refund looks like to the operator.
        cyber.esports.v1.OrderUnlockView:
            type: object
            properties:
                recordId:
                    type: string
                    description: 'Trial: the report record permanently unlocked by this order.'
                grantedAt:
                    type: string
                    description: |-
                        Membership: the window this order opened and how many unlocks
                         landed inside it (permanently kept).
                    format: date-time
                expiresAt:
                    type: string
                    format: date-time
                unlockCount:
                    type: integer
                    description: 'Wrapped: zero unlocks is a real paid state, not an absent one.'
                    format: int32
            description: What a paid order actually unlocked, folded at read time.
        cyber.esports.v1.PayCredential:
            type: object
            properties:
                kind:
                    enum:
                        - PAY_CREDENTIAL_KIND_UNSPECIFIED
                        - PAY_CREDENTIAL_KIND_INVOKE
                        - PAY_CREDENTIAL_KIND_JUMP_URL
                        - PAY_CREDENTIAL_KIND_QR_CODE
                    type: string
                    format: enum
                value:
                    type: string
                    description: |-
                        Success implies present — create answers with the payer's
                         continuation material or fails.
        cyber.esports.v1.PayGate:
            type: object
            properties:
                payAgeLine:
                    type: integer
                    description: |-
                        Plain scalars by the success-implies-present carve-out: an absent
                         config row still answers the shipped defaults (18 and 7), so the
                         gate always speaks.
                    format: int32
                renewalRemindDays:
                    type: integer
                    description: |-
                        Days before membership expiry the renewal reminder shows — the same
                         name the compliance knob answers, one vocabulary end to end.
                    format: int32
                minorPrompt:
                    type: string
                    description: |-
                        Operator overrides shown as-is in every locale (the sku-name
                         precedent for operator text); null = the face renders its own
                         localized default.
                missingBirthPrompt:
                    type: string
            description: |-
                The compliance facts the pay wall gates on, folded into the catalog
                 read (the same fold GetProfileResponse.member_until rides on: the wall
                 reads the gate with a call it already makes, zero extra hop).
        cyber.esports.v1.PeekMatchSessionResponse:
            type: object
            properties:
                session:
                    allOf:
                        - $ref: '#/components/schemas/cyber.esports.v1.MatchSession'
                    description: |-
                        Absent when no active session exists — message-field presence is
                         the null/zero contract for entities; a present session is the
                         resume face's whole truth.
        cyber.esports.v1.Point:
            type: object
            properties:
                x:
                    type: number
                    format: double
                y:
                    type: number
                    format: double
        cyber.esports.v1.PreviewMergeRequest:
            type: object
            properties:
                phone:
                    type: string
                wechat:
                    $ref: '#/components/schemas/cyber.esports.v1.WeChatMergeProof'
                state:
                    type: string
                    description: 'Wechat branch only: the bind-minted one-shot state.'
            description: |-
                The merge offer's decision input. The sms branch carries the bare phone —
                 occupancy is not a secret the bind flow doesn't already reveal, and the
                 merge itself re-proves with a fresh code. The wechat branch carries the
                 OAuth proof: only the exchange learns the openid, so the preview burns
                 state and code exactly like a bind attempt would.
        cyber.esports.v1.PreviewMergeResponse:
            type: object
            properties:
                status:
                    enum:
                        - MERGE_PREVIEW_STATUS_UNSPECIFIED
                        - MERGE_PREVIEW_STATUS_FREE
                        - MERGE_PREVIEW_STATUS_SELF
                        - MERGE_PREVIEW_STATUS_KEEP_CALLER
                        - MERGE_PREVIEW_STATUS_KEEP_OTHER
                        - MERGE_PREVIEW_STATUS_BLOCKED
                    type: string
                    format: enum
                caller:
                    $ref: '#/components/schemas/cyber.esports.v1.MergeAccountSummary'
                other:
                    $ref: '#/components/schemas/cyber.esports.v1.MergeAccountSummary'
        cyber.esports.v1.Profile:
            type: object
            properties:
                id:
                    type: string
                    description: Owning key resolved from the session; never client-supplied.
                nickname:
                    type: string
                    description: |-
                        2-12 chars once set — the onboarding display constraint, carried from
                         legacy experience data.
                birthYear:
                    type: integer
                    format: int32
                birthMonth:
                    type: integer
                    description: |-
                        1-12. Year+month is the collected granularity: a day would be fabricated
                         precision nothing consumes (bands are year-granular).
                    format: int32
                ageBand:
                    type: string
                    description: |-
                        Server-derived from birth year/month; null while birth is unknown. Word
                         set (frozen 8-band split): under12 | 12-14 | 15-17 | 18-22 | 23-25 |
                         26-29 | 30-40 | over40. Clients render, never compute.
                avatarUrl:
                    type: string
                guardianConsentedAt:
                    type: string
                    description: |-
                        Stamped server-side when guardian_accepted arrives with a derived age
                         under 13; null = not consented. The under-13 hard gate refuses saves
                         without it (ESPORTS_PROFILE_GUARDIAN_CONSENT_REQUIRED).
                    format: date-time
                games:
                    type: array
                    items:
                        $ref: '#/components/schemas/cyber.esports.v1.ProfileGame'
                createdAt:
                    type: string
                    format: date-time
                updatedAt:
                    type: string
                    format: date-time
                sex:
                    enum:
                        - PROFILE_SEX_UNSPECIFIED
                        - PROFILE_SEX_MALE
                        - PROFILE_SEX_FEMALE
                        - PROFILE_SEX_UNDETERMINED
                    type: string
                    description: |-
                        Three states by the sex ruling: male, female, undetermined — the last
                         is the honest "not said", never guessed from anything. The report
                         cohort's same-age-same-sex benchmark reads it; undetermined benches
                         against the same-age pool regardless of sex.
                    format: enum
            description: |-
                The member's own profile. Entity fields are wrappers: null means "not set
                 yet" (the row is born lazily on first save), never a zero value.
        cyber.esports.v1.ProfileGame:
            type: object
            properties:
                gameId:
                    type: string
                customName:
                    type: string
            description: |-
                One preference entry: exactly one of the pair is set — a catalog reference
                 or a user-typed name awaiting admin classification.
        cyber.esports.v1.PublishAnnouncementRequest:
            type: object
            properties:
                announcementId:
                    type: string
        cyber.esports.v1.PublishAnnouncementResponse:
            type: object
            properties:
                announcement:
                    $ref: '#/components/schemas/cyber.esports.v1.Announcement'
        cyber.esports.v1.QuestionBankRow:
            type: object
            properties:
                scenarioCode:
                    type: string
                payload:
                    type: object
                answer:
                    type: object
                createdAt:
                    type: string
                    format: date-time
            description: |-
                One banked scenario. The answer key rides in full — operator visibility
                 into what correctness is judged against is the point of this face.
        cyber.esports.v1.RecordAgreementConsentRequest:
            type: object
            properties:
                loginMethod:
                    enum:
                        - AGREEMENT_LOGIN_METHOD_UNSPECIFIED
                        - AGREEMENT_LOGIN_METHOD_SMS_CODE
                        - AGREEMENT_LOGIN_METHOD_PASSWORD
                        - AGREEMENT_LOGIN_METHOD_WECHAT
                    type: string
                    format: enum
        cyber.esports.v1.RecordAgreementConsentResponse:
            type: object
            properties: {}
            description: |-
                Empty on purpose: the record is fire-and-forget evidence the member
                 plane does not consume — the operator's consent query reads it, and
                 the e2e chain asserts it there.
        cyber.esports.v1.RedDotDetail:
            type: object
            properties:
                events:
                    type: array
                    items:
                        $ref: '#/components/schemas/cyber.esports.v1.RedDotEvent'
            description: red_dot — reaction tap on a moving spot.
        cyber.esports.v1.RedDotEvent:
            type: object
            properties:
                target:
                    $ref: '#/components/schemas/cyber.esports.v1.Point'
                click:
                    $ref: '#/components/schemas/cyber.esports.v1.Point'
                reactionTimeMs:
                    type: integer
                    format: int32
                deviation:
                    type: number
                    format: double
                isHit:
                    type: boolean
        cyber.esports.v1.RedeemActivationCodeRequest:
            type: object
            properties:
                code:
                    type: string
        cyber.esports.v1.RedeemActivationCodeResponse:
            type: object
            properties:
                reportType:
                    enum:
                        - REPORT_TYPE_UNSPECIFIED
                        - REPORT_TYPE_COGNITIVE
                        - REPORT_TYPE_CAREER
                        - REPORT_TYPE_SCHOOL
                    type: string
                    format: enum
                expiresAt:
                    type: string
                    description: |-
                        Null when the grant is permanent — a code's grant lasts as long as
                         the code said, and an absent expiry never ends.
                    format: date-time
                grantedAt:
                    type: string
                    format: date-time
        cyber.esports.v1.RefundPaymentOrderRequest:
            type: object
            properties:
                orderNo:
                    type: string
                reason:
                    type: string
                    description: |-
                        Why the exception was granted — required: an operator refund with no
                         recorded reason is an audit hole, not a shortcut.
        cyber.esports.v1.RefundPaymentOrderResponse:
            type: object
            properties:
                order:
                    $ref: '#/components/schemas/cyber.esports.v1.AdminOrder'
        cyber.esports.v1.ReplyFeedbackRequest:
            type: object
            properties:
                feedbackId:
                    type: string
                content:
                    type: string
        cyber.esports.v1.ReplyFeedbackResponse:
            type: object
            properties:
                ticket:
                    $ref: '#/components/schemas/cyber.esports.v1.FeedbackTicket'
        cyber.esports.v1.ReportAbility:
            type: object
            properties:
                ability:
                    type: string
                    description: The six-word ability vocabulary.
                gameCode:
                    type: string
                    description: The game whose score fed this ability (the axis's provenance).
                score:
                    type: number
                    format: double
                percentile:
                    type: number
                    format: double
                confidence:
                    enum:
                        - PEER_CONFIDENCE_UNSPECIFIED
                        - PEER_CONFIDENCE_LOW
                        - PEER_CONFIDENCE_MEDIUM
                        - PEER_CONFIDENCE_HIGH
                    type: string
                    format: enum
                sampleCount:
                    type: integer
                    format: int32
                peerAverage:
                    type: number
                    format: double
            description: |-
                One radar axis: the ability's own numbers plus the cohort answer. The
                 percentile is the same-age same-sex cohort's; a cohort too thin to say
                 anything yields a null percentile and a LOW confidence — the axis then
                 renders score-only, never a made-up percentile.
        cyber.esports.v1.ReportAccessVerdict:
            type: object
            properties:
                allowed:
                    type: boolean
                reason:
                    enum:
                        - REPORT_ACCESS_REASON_UNSPECIFIED
                        - REPORT_ACCESS_REASON_POLICY_OPEN
                        - REPORT_ACCESS_REASON_MEMBERSHIP_ACTIVE
                        - REPORT_ACCESS_REASON_CODE_REDEEMED
                        - REPORT_ACCESS_REASON_POLICY_CLOSED
                        - REPORT_ACCESS_REASON_NO_ENTITLEMENT
                    type: string
                    format: enum
            description: |-
                The same two-fact answer GetReportAccess returns, embedded in each
                 cluster face so a page carries its own gate: the judgement order
                 (code redemption outranks policy outranks the standing default) lives
                 in the entitlement module and is never re-derived here. A false
                 allowed means the face renders locked; the numbers behind a closed
                 gate never travel.
        cyber.esports.v1.ReportComparison:
            type: object
            properties:
                deltas:
                    type: array
                    items:
                        $ref: '#/components/schemas/cyber.esports.v1.ReportComparison_Delta'
        cyber.esports.v1.ReportComparison_Delta:
            type: object
            properties:
                ability:
                    type: string
                previousPercentile:
                    type: number
                    description: |-
                        The previous attempt's percentile; null when that attempt carried
                         none — the delta renders as "first measurement", not as zero.
                    format: double
                deltaPercentile:
                    type: number
                    format: double
        cyber.esports.v1.ReportImprovement:
            type: object
            properties:
                ability:
                    type: string
                currentPercentile:
                    type: number
                    format: double
                targetPercentile:
                    type: number
                    format: double
                gapPercent:
                    type: number
                    description: How far short of the target, in percent of it.
                    format: double
        cyber.esports.v1.ReportPolicyRow:
            type: object
            properties:
                reportType:
                    enum:
                        - REPORT_TYPE_UNSPECIFIED
                        - REPORT_TYPE_COGNITIVE
                        - REPORT_TYPE_CAREER
                        - REPORT_TYPE_SCHOOL
                    type: string
                    format: enum
                policy:
                    enum:
                        - REPORT_ACCESS_POLICY_UNSPECIFIED
                        - REPORT_ACCESS_POLICY_OPEN
                        - REPORT_ACCESS_POLICY_MEMBERSHIP
                        - REPORT_ACCESS_POLICY_TENANT
                        - REPORT_ACCESS_POLICY_CLOSED
                    type: string
                    format: enum
                overridden:
                    type: boolean
                    description: |-
                        False = the shipped default answering, true = a report_policy row
                         governs.
                updatedBy:
                    type: string
                updatedAt:
                    type: string
                    format: date-time
            description: |-
                One family's current answer. Absent rows are the shipped defaults echoed
                 back as-is — the override flag and the empty audit fields are the only
                 way a reader can tell a default from a deliberate setting.
        cyber.esports.v1.ResourceMatchCollect:
            type: object
            properties:
                kind:
                    type: string
                    description: Open vocabulary {minion | monster | dragon} — the resource kinds.
                elapsedMs:
                    type: integer
                    format: int32
        cyber.esports.v1.ResourceMatchCollision:
            type: object
