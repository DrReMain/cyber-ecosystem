                    type: string
                content:
                    type: string
        cyber.esports.v1.UpdateAnnouncementResponse:
            type: object
            properties:
                announcement:
                    $ref: '#/components/schemas/cyber.esports.v1.Announcement'
        cyber.esports.v1.UpdateProfileRequest:
            type: object
            properties:
                nickname:
                    type: string
                avatarUrl:
                    type: string
                birthYear:
                    type: integer
                    format: int32
                birthMonth:
                    type: integer
                    format: int32
                guardianAccepted:
                    type: boolean
                    description: |-
                        True stamps guardian_consented_at server-side — the server is the only
