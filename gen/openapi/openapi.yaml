tags:
    - name: AgentConfigAdminService
    - name: AgentConfigService
    - name: AgreementAdminService
      description: |-
        The operator face of the agreement domain: the version ledger each
         document's consent evidence hangs on, and the consent query that
         evidence answers. Creating a version makes it current on the spot —
         an operator never publishes a draft, and the login gate starts
         binding to the new version immediately; promoting an older version
         back is the same one-action move. Consent rows are never touched:
         deleting a version keeps every consent row it earned, because the
         rows denormalize the version string they landed on. Like the other
         operator planes, this service is a strippable module — deployments
         without it lose the management face, never the member face's
         recording or rendering.
    - name: AgreementService
      description: |-
        The member face of the agreement domain: the two legal documents the
         login checkbox gate binds to, and the consent record that checkbox
         leaves behind. Compliance evidence is the whole point — when a minor's
         recharge or a refund is disputed, the operator must show which version
         the user agreed to and when, so consent rows are append-only and the
         server alone decides which version a consent landed on: the client
         reports that the boxes were checked and which login path carried them,
         never a version number, because a stale client must not be able to
         pin evidence to an outdated document.
    - name: AuditService
    - name: AuthService
    - name: ChatService
    - name: ComplianceAdminService
      description: |-
        The operator face of the compliance knobs: the birth-date collection
         switch, the pay age line, the renewal reminder timing, and the two
         pay-wall prompt overrides — one singleton row behind them all, so every
         setter answers with the whole settled config and concurrent setters on
         different knobs never clobber each other (each setter updates only its
         own column). The age line is the sensitive knob: the operator face
         draws a double confirm around it and every write lands in the audit log
         like any other admin action.
         Like the other operator planes, this service is a strippable module —
         deployments without it lose the management face, never the knobs'
         answers (an absent row keeps answering the shipped defaults).
    - name: DeptService
    - name: EntitleAdminService
      description: |-
        The operator face of the entitlement domain: minting and listing type
         codes, the access policy they judge by, and the membership lifecycle an
         operator runs by hand. A code is a type code — the pricing ruling
         retired single-record codes, so redeeming opens one report family,
         never one trial's report. Generation mints each code for a single
         redeem; an operator who needs N hands-out mints N, and one generation
         call is one batch — the unit the operator disables, exports, and reads
         progress by. Codes live in clear text because operators re-copy them
         for support. A membership grant is the operator's twin of a settled
         order: it lands the same ledger row without ever touching the payment
         pipeline. This whole service is a strippable module: deployments
         without the operator plane drop it and the business faces never notice.
    - name: EntitlementService
      description: |-
        The member's entitlement faces. Redeem is idempotent per (member,
         code): handing the same code to the same member again returns the same
         entitlement, while a rival member's redeem takes the code's single use.
         Access folds every openable fact — policy config, an active membership,
         a redeemed code — into one answer with one reason, so the client never
         re-derives entitlement rules.
    - name: FeedbackAdminService
      description: |-
        The operator face of the feedback domain: the queue the support seat
         works — list by state, read the conversation, answer, close. An
         answer is one move with two effects: the ticket flips to replied AND
         the member's letterbox gains the reply's letter in the same
         transaction, so the message center's feedback notice can never point
         at an answer that did not land. A member's follow-up walks the ticket
         back to pending on their side; the operator sees it re-enter the
         queue. Closing is terminal for the conversation, not a deletion —
         the ticket and its thread stay as the record of what was asked and
         answered.
    - name: FeedbackService
      description: |-
        The member face of the feedback domain: the six-category submit form,
         the my-feedback list, and the conversation-shaped detail where a
         follow-up question walks the ticket back to pending so the operator
         sees it again. The ticket is a loop, not a form: submit → answer →
         ask again → answer again, until the member is satisfied or the
         operator closes it.
    - name: FilePresignService
      description: |-
        File presign channel: the client-direct upload path. The
         service registers metadata and mints time-limited presigned URLs; bytes
         travel client → object storage without crossing this stack. Addressing is
         compiled into every minted URL (minted against the storage backend's
         advertised public endpoint), so the client holds no storage configuration
         of its own — CreateUpload's response shape IS the routing decision.
         Same audience as the proxy channel: a builtin capability every
         authenticated principal holds, while FileService stays the admin
         management plane.
         Resume needs no client-side persistence: multipart sessions live in the
         file row + the backend's part set, and ListUploadedParts replays both
         (uploaded parts with ETags, fresh URLs for the missing ones).
    - name: FileProxyService
      description: |-
        File proxy channel: the app-generic small-file upload path.
         Bytes ride the unary RPC body through the service to object storage — no
         presigning, no CORS, no client-side S3 surface. The payload cap is a
         contract constant, not a tunable. This lives in its own proto because its
         audience is the opposite of FileService's: a builtin capability every
         authenticated principal holds — an operator must not be able to lock a
         user out of their own file space — while FileService stays the admin
         management plane.
         The response carries the File entity, never a URL: callers persist the
         file id, access URLs are minted at render time, and storage
         backends can migrate without touching stored references.
    - name: FileService
    - name: GameService
      description: |-
        Esports title catalog — game names the played title, never the test item
         (naming split). Preference voting and draw weights key off this catalog;
         the C-end never hardcodes it. Admin management and classification live on
         the admin face, not this read model.
    - name: IntrospectService
    - name: MatchService
      description: |-
        The match session — the orchestration aggregate the C-end assessment
         flow rides. One active session per member: steps are drawn once (seeded
         jitter, so lineups cannot be memorized) and locked into the row, a
         resume at any age never redraws, and a fresh draw starts only on an
         explicit genre switch (forced new seed). The difficulty mode axis lives
         on the session: every attempt inside scores on the session's mode,
         consumed at the submit seam.
    - name: MemberService
      description: |-
        Member read face for operations — the composition of a system roster
         (identities seated in a population) with the local player profiles. The
         roster is enumerated from system with the caller's own credential; an
         absent profile row is the lazy onboarding shape, never an error. One
         face one consumer grade: this is the admin plane; the C-end member
         reads their own profile through ProfileService.
    - name: MessageAdminService
      description: |-
        The operator face of the message domain: announcement management.
         An announcement is a draft the operator composes, then publishes
         once — the moment of publishing is the moment of delivery. A
         banner-kind row goes live on the home surface; a message-kind row is
         copied into every targeted member's letterbox as their own row, so
         the delivered letters survive a later offline untouched (offline
         retires the banner and stops nothing already sent). The member set
         is resolved at publish time — members arriving later never see the
         letter, exactly like a letter mailed on paper. Scheduling a publish
         for a future moment is a deliberate non-feature here; the face that
         wants it grows the field then, not before.
    - name: MessageService
      description: |-
        The member face of the message domain: the message center's letterbox
         and the home banner. Unread is server-side row state — is_read lives
         on the row, the badge asks the server, and mark-read mutates the row —
         so the count stays true across devices instead of being a client-local
         memory. Every message a member sees is one row of their own letterbox:
         announcements land as rows at publish time (a delivered letter is not
         unsent by a later offline), feedback replies land as rows in the same
         transaction the operator's answer commits, and report and membership
         notes land when their writer domains wire in.
    - name: MockCashierService
      description: |-
        The simulated cashier (the mock provider's dev face): the browser sheet
         a mock environment renders instead of the channel's own cashier.
         MarkPaid mints the channel-signed push the real channel would deliver
         and hands it to the same notify pipeline NotifyPayment serves, so a dev
         walkthrough exercises the true settle path, never a shortcut. The gate
         answers at call time, not mount time: a topology whose default provider
         is not mock refuses every order with CASHIER_DISABLED — the simulated
         cashier never exists in production, the contract states that honestly.
         The caller must own the order; another member's order answers
         NOT_FOUND, never material.
    - name: OrderAdminService
      description: |-
        The order aggregate's operator face: the whole payment flow, not the
         caller's own. Reads hydrate the identity and sku names the operator
         lists by; the detail folds the unlock outcome a paid order produced.
         Close here is the operator's variant — the same pending-only
         arbitration, minus the member plane's owner check, plus the operator
         identity on the audit trail. Refund is the offline-exception executor
         the member FAQ points at: the product sells no self-service refunds,
         so this face mints the one full refund an operator grants by hand.
    - name: OrderService
      description: |-
        The order aggregate's faces. The member plane creates and reads its own
         orders; creating again for the same grant target while a pending order
         lives returns that order. Create is also the pay gate's authority, and
         the gate outranks reuse: a member without a recorded birth is refused
         BIRTH_MISSING (the client routes to the backfill), a member under the
         compliance age line is refused AGE_BLOCKED — live order or not, a
         member the gate refuses never receives payment material. The wall's
         catalog-side pre-check is experience, this refusal is the rule.
         NotifyPayment is the service's only public face: its callers are
         payment channels pushing their envelopes, and they authenticate by the
         channel signature inside the payload, never by a session — the
         notification accelerates settlement, the query surface converges it.
    - name: PolicyService
    - name: PopulationService
      description: |-
        Population registry read face: instances of the compile-time plane
         vocabulary (backend | member). Codes are join keys — immutable once born.
         Rows are deploy-declared state, born and reconciled by the seed.
    - name: ProfileService
      description: |-
        Player profile, the C-end onboarding aggregate: nickname, birth year/month,
         the age band derived from it, guardian consent for under-13s, and game
         preference. Identity stays in system — every face here is caller-scoped:
         the owning key resolves from the session seat (system introspection) and
         never appears in a request.
    - name: ReportService
      description: |-
        The member's report read face. The single-attempt ability report is one
         record's board under the unlock state the entitlement ledger holds for
         it — a trial-scope grant on this record (the pay domain's settle, the
         pricing ruling's unlock unit), an active membership window, or a
         redeemed family code; the same three facts the family access judgement
         reads, never re-derived here. The free tier renders the tier badge, the
         ability radar and the composite percentile; the unlocked tier adds the
         per-ability peer detail, the last-attempt comparison and the improvement
         board. Numbers travel, copy does not: the five-zone wording stays with
         the client until its configuration face lands.

         Beside the record board sit the two read-back faces: the session
         scoreboard (GetSessionReport) and the cross-session aggregate
         (GetAbilityDigest) — what a member sees of scores they already earned.
         Neither runs cohort math: the frozen snapshot is their only percentile
         source, same as the record board itself.

         The cluster faces (GetCognitiveReport, GetTrendReport, GetCareerReport)
         fold cross-session history into read-only pages beyond the single
         attempt. Each response embeds its own access verdict — the same two
         facts GetReportAccess answers — so a closed policy or an inactive
         membership renders a locked face, never an error, and the numbers
         behind a closed gate never travel.
    - name: ResourceService
    - name: RoleService
    - name: SkuAdminService
      description: |-
        The sku aggregate's operator face: the whole catalog, on-shelf or not,
         plus the three write actions the catalog admin owns. Every write is
         price-sensitive territory — the operator identity rides into the row's
         audit-join column, and shelf flips reach the member plane on its next
         read (the member face queries live, no cache to invalidate). A face
         module over module/sku: zero aggregates of its own.
    - name: SkuService
      description: |-
        Purchasable catalog read face for the member plane. Values are product
         territory (P1: a single purchase permanently unlocks one trial's
         report; membership is a 31-day window); the structure carries both the
         selling price and the list price so a future discount display is a
         value change, not a contract change — no discount is displayed either
         way in M1. The list also answers the pay gate's facts, folded into the
         read the wall already makes — the member plane has no compliance read
         of its own, and the gate is sale-shaped, so the selling face carries it.
    - name: TenantService
    - name: TestAdminService
      description: |-
        The operator face of the test domain: the catalog and its runtime tuning,
         the question bank's seed rows, and the stored attempts behind every
         verdict. The member face (TestService) answers hydration and submission;
         this face answers the operator's "what is tuned, what is banked, what did
         they score" — a read-mostly plane whose one write is the config dial.
         Reuses TestService's own messages wherever the shapes coincide: the
         catalog row and the boot bag are one truth, not two. This whole service
         is a strippable module: deployments without the operator plane drop it
         and the business faces never notice.
    - name: TestService
      description: |-
        Test catalog and per-test runtime delivery — test names the scored item,
         never the played title (naming split). The C-end surfaces tests through
         the matching flow, not a browse page: the list face is the hydration
         source resolving match-step codes into display metadata, and the detail
         face carries the long-form copy; the config face is the engine boot bag.
         Grades are percentile-tiered server-side at submit time — the client
         renders returned grades, never judges them.
    - name: TransferService
      description: |-
        Transfer service. Exposes the streaming transport primitives
         (SSE / client-stream / bidi / HttpBody) to clients.
    - name: UserService
