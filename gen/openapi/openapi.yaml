                multi_target — priority firing under value tiers. The legacy pick stream
                 carried no tier; the tier rides here now so the server can rebuild every
                 priority aggregate from facts.
        cyber.esports.v1.MultiTargetPick:
            type: object
            properties:
                targetId:
                    type: string
                tier:
                    type: string
                    description: Open vocabulary {high | medium | low | trap}.
                isHit:
                    type: boolean
                elapsedMs:
                    type: integer
                    format: int32
        cyber.esports.v1.NotifyPaymentRequest:
            type: object
            properties:
                provider:
                    type: string
                    description: |-
                        Provider name routing to the platform's payment container — the same
                         value set the platform configures (wechat, mock).
                headers:
                    type: object
                    additionalProperties:
                        type: string
                    description: |-
                        The push exactly as it arrived; the provider's Notifier verifies the
                         channel signature before anything settles. A map, not entries: the
                         channels signing payment pushes never repeat a header.
                body:
                    type: string
                    format: bytes
        cyber.esports.v1.NotifyPaymentResponse:
            type: object
            properties:
                handled:
                    type: boolean
                    description: |-
                        True when this face absorbed the event — settled, or a kind this build
                         audits by design (a refund logs and acks). False = parsed and verified
                         but nothing folded: the edge answers non-ack, so the channel's own
                         retries keep the event visible instead of silently dropping an unknown
                         money fact.
        cyber.esports.v1.NumberStarsClick:
            type: object
            properties:
                number:
                    type: integer
                    format: int32
                elapsedMs:
                    type: integer
                    format: int32
                position:
                    $ref: '#/components/schemas/cyber.esports.v1.Point'
        cyber.esports.v1.NumberStarsDetail:
            type: object
            properties:
                rounds:
                    type: array
                    items:
                        $ref: '#/components/schemas/cyber.esports.v1.NumberStarsRound'
            description: |-
                number_stars — numeric sequence tapping; the round's target sequence plus
                 the click stream let the server rebuild accuracy and decision intervals
                 (legacy asserted isCorrect/expectedNumber client-side — now derived).
        cyber.esports.v1.NumberStarsRound:
            type: object
            properties:
                roundNumber:
                    type: integer
                    format: int32
                numbers:
                    type: array
                    items:
                        type: integer
                        format: int32
                clicks:
                    type: array
                    items:
                        $ref: '#/components/schemas/cyber.esports.v1.NumberStarsClick'
        cyber.esports.v1.OffenseDefenseDecision:
            type: object
            properties:
                scenarioId:
                    type: string
                choice:
                    type: string
                    description: Open vocabulary {attack | defense | retreat}; absent = unanswered.
                decisionTimeMs:
                    type: integer
                    format: int32
                timeout:
                    type: boolean
        cyber.esports.v1.OffenseDefenseDetail:
            type: object
            properties:
                decisions:
                    type: array
                    items:
                        $ref: '#/components/schemas/cyber.esports.v1.OffenseDefenseDecision'
            description: |-
                offense_defense — scenario decisions; correctness is judged server-side
                 against the scenario answer key (legacy isCorrect dropped).
        cyber.esports.v1.Order:
            type: object
            properties:
                orderNo:
                    type: string
                skuCode:
                    type: string
                scope:
                    enum:
                        - ORDER_SCOPE_UNSPECIFIED
                        - ORDER_SCOPE_TRIAL
                        - ORDER_SCOPE_PERIOD
                    type: string
                    format: enum
                scopeRef:
                    type: string
                    description: |-
                        Trial: the test record this order unlocks. Period: null — the window
                         shape comes from the sku.
                provider:
                    type: string
                channel:
                    type: string
                amountFen:
                    type: string
                state:
                    enum:
                        - ORDER_STATE_UNSPECIFIED
                        - ORDER_STATE_PENDING
                        - ORDER_STATE_PAID
                        - ORDER_STATE_CLOSED
                    type: string
                    format: enum
                transactionId:
                    type: string
                    description: Channel transaction id once paid; null before.
                createdAt:
                    type: string
                    format: date-time
                expiresAt:
                    type: string
                    description: Payment deadline; the order is not payable after it.
                    format: date-time
                paidAt:
                    type: string
                    format: date-time
        cyber.esports.v1.PayCredential:
            type: object
            properties:
                kind:
                    enum:
                        - PAY_CREDENTIAL_KIND_UNSPECIFIED
                        - PAY_CREDENTIAL_KIND_INVOKE
                        - PAY_CREDENTIAL_KIND_JUMP_URL
                        - PAY_CREDENTIAL_KIND_QR_CODE
                    type: string
                    format: enum
                value:
                    type: string
                    description: |-
                        Success implies present — create answers with the payer's
                         continuation material or fails.
        cyber.esports.v1.PeekMatchSessionResponse:
            type: object
            properties:
                session:
                    allOf:
                        - $ref: '#/components/schemas/cyber.esports.v1.MatchSession'
                    description: |-
                        Absent when no in-window session exists — message-field presence is
                         the null/zero contract for entities; a present session is the
                         resume face's whole truth.
        cyber.esports.v1.Point:
            type: object
            properties:
                x:
                    type: number
                    format: double
                y:
                    type: number
                    format: double
        cyber.esports.v1.Profile:
            type: object
            properties:
                id:
                    type: string
                    description: Owning key resolved from the session; never client-supplied.
                nickname:
                    type: string
                    description: |-
                        2-12 chars once set — the onboarding display constraint, carried from
                         legacy experience data.
                birthYear:
                    type: integer
                    format: int32
                birthMonth:
                    type: integer
                    description: |-
                        1-12. Year+month is the collected granularity: a day would be fabricated
                         precision nothing consumes (bands are year-granular).
                    format: int32
                ageBand:
                    type: string
                    description: |-
                        Server-derived from birth year/month; null while birth is unknown. Word
                         set (frozen 8-band split): under12 | 12-14 | 15-17 | 18-22 | 23-25 |
                         26-29 | 30-40 | over40. Clients render, never compute.
                avatarUrl:
                    type: string
                guardianConsentedAt:
                    type: string
                    description: |-
                        Stamped server-side when guardian_accepted arrives with a derived age
                         under 13; null = not consented. The under-13 hard gate refuses saves
                         without it (ESPORTS_PROFILE_GUARDIAN_CONSENT_REQUIRED).
                    format: date-time
                games:
                    type: array
                    items:
                        $ref: '#/components/schemas/cyber.esports.v1.ProfileGame'
                createdAt:
                    type: string
                    format: date-time
                updatedAt:
                    type: string
                    format: date-time
                sex:
                    enum:
                        - PROFILE_SEX_UNSPECIFIED
                        - PROFILE_SEX_MALE
                        - PROFILE_SEX_FEMALE
                        - PROFILE_SEX_UNDETERMINED
                    type: string
                    description: |-
                        Three states by the sex ruling: male, female, undetermined — the last
                         is the honest "not said", never guessed from anything. The report
                         cohort's same-age-same-sex benchmark reads it; undetermined benches
                         against the same-age pool regardless of sex.
                    format: enum
            description: |-
                The member's own profile. Entity fields are wrappers: null means "not set
                 yet" (the row is born lazily on first save), never a zero value.
        cyber.esports.v1.ProfileGame:
            type: object
            properties:
                gameId:
                    type: string
                customName:
                    type: string
            description: |-
                One preference entry: exactly one of the pair is set — a catalog reference
                 or a user-typed name awaiting admin classification.
        cyber.esports.v1.QuestionBankRow:
            type: object
            properties:
                scenarioCode:
                    type: string
                payload:
                    type: object
                answer:
                    type: object
                createdAt:
                    type: string
                    format: date-time
            description: |-
                One banked scenario. The answer key rides in full — operator visibility
                 into what correctness is judged against is the point of this face.
        cyber.esports.v1.RedDotDetail:
            type: object
            properties:
                events:
                    type: array
                    items:
                        $ref: '#/components/schemas/cyber.esports.v1.RedDotEvent'
            description: red_dot — reaction tap on a moving spot.
        cyber.esports.v1.RedDotEvent:
            type: object
            properties:
                target:
                    $ref: '#/components/schemas/cyber.esports.v1.Point'
                click:
                    $ref: '#/components/schemas/cyber.esports.v1.Point'
                reactionTimeMs:
                    type: integer
                    format: int32
                deviation:
                    type: number
                    format: double
                isHit:
                    type: boolean
        cyber.esports.v1.RedeemActivationCodeRequest:
            type: object
            properties:
                code:
                    type: string
        cyber.esports.v1.RedeemActivationCodeResponse:
            type: object
            properties:
                reportType:
                    enum:
                        - REPORT_TYPE_UNSPECIFIED
                        - REPORT_TYPE_COGNITIVE
                        - REPORT_TYPE_CAREER
                        - REPORT_TYPE_SCHOOL
                    type: string
                    format: enum
                expiresAt:
                    type: string
                    description: |-
                        Null when the grant is permanent — a code's grant lasts as long as
                         the code said, and an absent expiry never ends.
                    format: date-time
                grantedAt:
                    type: string
                    format: date-time
        cyber.esports.v1.ReportAbility:
            type: object
            properties:
                ability:
                    type: string
                    description: The six-word ability vocabulary.
                gameCode:
                    type: string
                    description: The game whose score fed this ability (the axis's provenance).
                score:
                    type: number
                    format: double
                percentile:
                    type: number
                    format: double
                confidence:
                    enum:
                        - PEER_CONFIDENCE_UNSPECIFIED
                        - PEER_CONFIDENCE_LOW
                        - PEER_CONFIDENCE_MEDIUM
                        - PEER_CONFIDENCE_HIGH
                    type: string
                    format: enum
                sampleCount:
                    type: integer
                    format: int32
                peerAverage:
                    type: number
                    format: double
            description: |-
                One radar axis: the ability's own numbers plus the cohort answer. The
                 percentile is the same-age same-sex cohort's; a cohort too thin to say
                 anything yields a null percentile and a LOW confidence — the axis then
                 renders score-only, never a made-up percentile.
        cyber.esports.v1.ReportComparison:
            type: object
            properties:
                deltas:
                    type: array
                    items:
                        $ref: '#/components/schemas/cyber.esports.v1.ReportComparison_Delta'
        cyber.esports.v1.ReportComparison_Delta:
            type: object
            properties:
                ability:
                    type: string
                previousPercentile:
                    type: number
                    description: |-
                        The previous attempt's percentile; null when that attempt carried
                         none — the delta renders as "first measurement", not as zero.
                    format: double
                deltaPercentile:
                    type: number
                    format: double
        cyber.esports.v1.ReportImprovement:
            type: object
            properties:
                ability:
                    type: string
                currentPercentile:
                    type: number
                    format: double
                targetPercentile:
                    type: number
                    format: double
                gapPercent:
                    type: number
                    description: How far short of the target, in percent of it.
                    format: double
        cyber.esports.v1.ReportPolicyRow:
            type: object
            properties:
                reportType:
                    enum:
                        - REPORT_TYPE_UNSPECIFIED
                        - REPORT_TYPE_COGNITIVE
                        - REPORT_TYPE_CAREER
                        - REPORT_TYPE_SCHOOL
                    type: string
                    format: enum
                policy:
                    enum:
                        - REPORT_ACCESS_POLICY_UNSPECIFIED
                        - REPORT_ACCESS_POLICY_OPEN
                        - REPORT_ACCESS_POLICY_MEMBERSHIP
                        - REPORT_ACCESS_POLICY_TENANT
                        - REPORT_ACCESS_POLICY_CLOSED
                    type: string
                    format: enum
                overridden:
                    type: boolean
                    description: |-
                        False = the shipped default answering, true = a report_policy row
                         governs.
                updatedBy:
                    type: string
                updatedAt:
                    type: string
                    format: date-time
            description: |-
                One family's current answer. Absent rows are the shipped defaults echoed
                 back as-is — the override flag and the empty audit fields are the only
                 way a reader can tell a default from a deliberate setting.
        cyber.esports.v1.ResourceMatchCollect:
            type: object
            properties:
                kind:
                    type: string
                    description: Open vocabulary {minion | monster | dragon} — the resource kinds.
                elapsedMs:
                    type: integer
                    format: int32
        cyber.esports.v1.ResourceMatchCollision:
            type: object
            properties:
                elapsedMs:
                    type: integer
                    format: int32
        cyber.esports.v1.ResourceMatchDetail:
            type: object
            properties:
                trajectory:
                    type: array
                    items:
                        $ref: '#/components/schemas/cyber.esports.v1.ResourceMatchTrajectoryPoint'
                collects:
                    type: array
                    items:
                        $ref: '#/components/schemas/cyber.esports.v1.ResourceMatchCollect'
                collisions:
                    type: array
                    items:
                        $ref: '#/components/schemas/cyber.esports.v1.ResourceMatchCollision'
            description: |-
                resource_match — collecting resources on a field; trajectory, the collect
                 sequence (kind + time), and collisions rebuild every efficiency aggregate.
        cyber.esports.v1.ResourceMatchTrajectoryPoint:
            type: object
            properties:
                position:
                    $ref: '#/components/schemas/cyber.esports.v1.Point'
                elapsedMs:
                    type: integer
                    format: int32
        cyber.esports.v1.SessionAbilityLine:
            type: object
            properties:
                ability:
                    type: string
                gameCode:
                    type: string
                    description: The game whose best attempt fed the line.
                bestScore:
                    type: number
                    description: |-
                        This session's best valid attempt — the settlement headline (a line
                         exists only when a valid attempt landed, so this is never empty).
                    format: double
                attemptScores:
                    type: array
                    items:
                        type: number
                        format: double
                    description: |-
                        Every valid attempt's authoritative score in ordinal order — the
                         "N attempts, best taken" receipt.
                bestGrade:
                    type: string
                    description: |-
                        The best attempt's grade; null when that attempt carried no cohort
                         answer.
                percentile:
                    type: number
                    description: |-
                        The ability's percentile from the anchor's frozen snapshot; null
                         while the cohort says nothing.
                    format: double
                prevSessionScore:
                    type: number
                    description: |-
                        The same ability's score on the member's previous session — null on
                         the first session (the note renders "first", never zero).
                    format: double
                historyBestScore:
                    type: number
                    description: |-
                        The cross-session best including this session's attempts — the mark
                         the comparison track and the "new personal best" note read.
                    format: double
            description: |-
                One ability's session verdict — the three numbers the settlement face
                 keeps distinct: this session's best, the previous session's word, and
                 the cross-session best.
        cyber.esports.v1.SetReportAccessPolicyRequest:
            type: object
            properties:
                reportType:
                    enum:
                        - REPORT_TYPE_UNSPECIFIED
                        - REPORT_TYPE_COGNITIVE
                        - REPORT_TYPE_CAREER
                        - REPORT_TYPE_SCHOOL
                    type: string
                    format: enum
                policy:
                    enum:
                        - REPORT_ACCESS_POLICY_UNSPECIFIED
                        - REPORT_ACCESS_POLICY_OPEN
                        - REPORT_ACCESS_POLICY_MEMBERSHIP
                        - REPORT_ACCESS_POLICY_TENANT
                        - REPORT_ACCESS_POLICY_CLOSED
                    type: string
                    format: enum
        cyber.esports.v1.SetReportAccessPolicyResponse:
            type: object
            properties:
                reportType:
                    enum:
                        - REPORT_TYPE_UNSPECIFIED
                        - REPORT_TYPE_COGNITIVE
                        - REPORT_TYPE_CAREER
                        - REPORT_TYPE_SCHOOL
                    type: string
                    format: enum
                policy:
                    enum:
                        - REPORT_ACCESS_POLICY_UNSPECIFIED
                        - REPORT_ACCESS_POLICY_OPEN
                        - REPORT_ACCESS_POLICY_MEMBERSHIP
                        - REPORT_ACCESS_POLICY_TENANT
                        - REPORT_ACCESS_POLICY_CLOSED
                    type: string
                    format: enum
        cyber.esports.v1.SkillTrajectoryDetail:
            type: object
            properties:
                randomSeed:
                    type: string
                rounds:
                    type: array
                    items:
                        $ref: '#/components/schemas/cyber.esports.v1.SkillTrajectoryRound'
            description: |-
                skill_trajectory — placement precision over draggable graphics; the seed
                 reproduces the board server-side.
        cyber.esports.v1.SkillTrajectoryRound:
            type: object
            properties:
                roundNumber:
                    type: integer
                    format: int32
                graphicId:
                    type: string
                shape:
                    type: string
                    description: Open vocabulary {circle | square | triangle | pentagon | hexagon | star}.
                graphicSize:
                    type: number
                    format: double
                colorName:
                    type: string
                originalPosition:
                    $ref: '#/components/schemas/cyber.esports.v1.Point'
                trajectory:
                    type: array
                    items:
                        $ref: '#/components/schemas/cyber.esports.v1.Point'
                playerPlacement:
                    $ref: '#/components/schemas/cyber.esports.v1.Point'
                deviation:
                    type: number
                    format: double
                placementTimeMs:
                    type: integer
                    format: int32
                selected:
                    type: boolean
                placed:
                    type: boolean
        cyber.esports.v1.Sku:
            type: object
            properties:
                skuCode:
                    type: string
                    description: |-
                        Catalog code join key (e.g. member_month) — the row ULID never
                         crosses the wire, the same law as game codes.
                name:
                    type: string
                description:
                    type: string
                kind:
                    enum:
                        - SKU_KIND_UNSPECIFIED
                        - SKU_KIND_TRIAL
                        - SKU_KIND_MEMBERSHIP
                    type: string
                    format: enum
                priceFen:
                    type: string
                    description: Fen amounts (1/100 yuan); money never rides yuan or floats anywhere.
                listPriceFen:
                    type: string
                    description: |-
                        List price — equal to price_fen in M1; carried so discounting is
                         product data, not a schema change.
                periodDays:
                    type: integer
                    description: Membership window in days; null on trial skus.
                    format: int32
                createdAt:
                    type: string
                    format: date-time
                updatedAt:
                    type: string
                    format: date-time
        cyber.esports.v1.SubmitTestAttemptRequest:
            type: object
            properties:
                testCode:
                    type: string
                    description: Code join key (e.g. "red_dot") — same law as Test.code.
                matchSessionId:
                    type: string
                    description: |-
                        Presence binds the attempt to that match session: the test must be one
                         of the session's locked steps, the ordinal and retest budget are
                         session law, and the score rides the session's difficulty mode.
                         Absence = local practice: no session, vacuous ordinal, experience
                         baseline, no budget.
                startedAt:
                    type: string
                    format: date-time
                endedAt:
                    type: string
                    format: date-time
                backgrounds:
                    type: array
                    items:
                        $ref: '#/components/schemas/cyber.esports.v1.BackgroundSpan'
                redDot:
                    $ref: '#/components/schemas/cyber.esports.v1.RedDotDetail'
                flashAiming:
                    $ref: '#/components/schemas/cyber.esports.v1.FlashAimingDetail'
                multiTarget:
                    $ref: '#/components/schemas/cyber.esports.v1.MultiTargetDetail'
                targetRecognition:
                    $ref: '#/components/schemas/cyber.esports.v1.TargetRecognitionDetail'
                trackingMoving:
                    $ref: '#/components/schemas/cyber.esports.v1.TrackingMovingDetail'
                movingTarget:
                    $ref: '#/components/schemas/cyber.esports.v1.MovingTargetDetail'
                skillTrajectory:
                    $ref: '#/components/schemas/cyber.esports.v1.SkillTrajectoryDetail'
                dualZone:
                    $ref: '#/components/schemas/cyber.esports.v1.DualZoneDetail'
                numberStars:
                    $ref: '#/components/schemas/cyber.esports.v1.NumberStarsDetail'
                offenseDefense:
                    $ref: '#/components/schemas/cyber.esports.v1.OffenseDefenseDetail'
                characterCounter:
                    $ref: '#/components/schemas/cyber.esports.v1.CharacterCounterDetail'
                resourceMatch:
                    $ref: '#/components/schemas/cyber.esports.v1.ResourceMatchDetail'
                economicSim:
                    $ref: '#/components/schemas/cyber.esports.v1.EconomicSimDetail'
        cyber.esports.v1.SubmitTestAttemptResponse:
            type: object
            properties:
                recordId:
                    type: string
                rawScore:
                    type: number
                    description: |-
                        Dual-track scoring: linear uncapped raw score, percentile-tiered
                         authoritative score with its grade — neither is client-computable.
                    format: double
                authoritativeScore:
                    type: number
                    format: double
                grade:
                    type: string
                    description: Open vocabulary {S | A | B | C} — the four-color tier law.
                ability:
                    type: string
                    description: Ability attribution receipt, six-word vocabulary shared with Test.ability.
                valid:
                    type: boolean
                    description: |-
                        False when the attempt fails server-side validity (background over
                         budget, incomplete detail) — an invalid attempt scores nothing; the
                         reason code is ops vocabulary, not user copy.
                invalidReason:
                    type: string
                retestLeft:
                    type: integer
                    description: Retest budget receipt for the "N/3 remaining" UI; E4 owns enforcement.
                    format: int32
        cyber.esports.v1.SwitchMatchGenreRequest:
            type: object
            properties:
                genre:
                    type: string
        cyber.esports.v1.SwitchMatchGenreResponse:
            type: object
            properties:
                session:
                    $ref: '#/components/schemas/cyber.esports.v1.MatchSession'
        cyber.esports.v1.TargetRecognitionClick:
            type: object
            properties:
                targetId:
                    type: string
                targetType:
                    type: string
                    description: Open vocabulary {friendly | enemy | neutral}.
                reactionTimeMs:
                    type: integer
                    format: int32
                elapsedMs:
                    type: integer
                    format: int32
        cyber.esports.v1.TargetRecognitionDetail:
            type: object
            properties:
                clicks:
                    type: array
                    items:
                        $ref: '#/components/schemas/cyber.esports.v1.TargetRecognitionClick'
                spawnedEnemy:
                    type: integer
                    description: |-
                        Enemies that existed this attempt — the hit-rate denominator legacy sent
                         pre-cooked as enemyHitRate. Blank taps stay local: target_id cannot name air.
                    format: int32
            description: |-
                target_recognition — friend/foe discrimination; correctness is judged
                 server-side against the target type, never asserted by the client.
        cyber.esports.v1.Test:
            type: object
            properties:
                id:
                    type: string
                    description: Row address; the code below is the join key.
                code:
                    type: string
                    description: |-
                        Immutable code join key (e.g. "red_dot") — engine registry, seeds, and
                         cross-domain references key off the code, same law as game codes.
                name:
                    type: string
                category:
                    type: string
                    description: |-
                        Vocabulary {fps | moba | universal} — universal feeds every genre pool
                         (skill_trajectory ruling). Open vocabulary, admin-managed; the word set
                         is seed data, not a contract enum, so new categories classify in
                         without touching this contract.
                ability:
                    type: string
                    description: |-
                        Primary ability, fixed six-word vocabulary shared with admin:
                         reactionSpeed | aimingAccuracy | trackingStability |
                         skillReleaseAccuracy | resourceAllocation | decisionEfficiency.
                         Labels and colors are client-side vocabulary; contribution weights are
                         report-domain, not this entity.
                description:
                    type: string
                unitScoreLabel:
                    type: string
                    description: |-
                        Display form of the unit score (e.g. "10 分/命中") — rendering copy
                         only; the numeric unit score is a server-side scoring input and never
                         crosses this contract.
                durationSeconds:
                    type: integer
                    description: |-
                        Canonical test length, seconds — single source for the engine
                         countdown; mirrored into TestConfig so engine boot is one call.
                    format: int32
                createdAt:
                    type: string
                    format: date-time
                updatedAt:
                    type: string
                    format: date-time
        cyber.esports.v1.TestAdminServiceGetTestConfigResponse:
            type: object
            properties:
                config:
                    $ref: '#/components/schemas/cyber.esports.v1.TestConfig'
        cyber.esports.v1.TestAdminServiceListTestsResponse:
            type: object
            properties:
                tests:
                    type: array
                    items:
                        $ref: '#/components/schemas/cyber.esports.v1.Test'
        cyber.esports.v1.TestAttemptRow:
            type: object
            properties:
                recordId:
                    type: string
                testCode:
                    type: string
                userId:
                    type: string
                matchSessionId:
                    type: string
                    description: Null for local practice — absence = no session, the submit law.
                attemptNo:
                    type: integer
                    format: int32
                startedAt:
                    type: string
                    format: date-time
                endedAt:
                    type: string
                    format: date-time
                rawScore:
                    type: number
                    description: |-
                        The dual track — an invalid attempt carries no scores. Ability rides
                         the catalog join client-side; the row carries only what it stored.
                    format: double
                authoritativeScore:
                    type: number
                    format: double
                grade:
                    type: string
                valid:
                    type: boolean
                invalidReason:
                    type: string
            description: |-
                The stored attempt as the operator reads it — the same row the member's
                 report verdicts were cut from, so no verdict can be traced to a fact
                 this face cannot show.
        cyber.esports.v1.TestConfig:
            type: object
            properties:
                testId:
                    type: string
                durationSeconds:
                    type: integer
                    description: Mirror of Test.duration_seconds — the boot bag is self-sufficient.
                    format: int32
                backgroundInvalidSeconds:
                    type: integer
                    description: |-
                        Client-side mechanics threshold: backgrounding longer than this
                         invalidates the run (server-configurable). The engine only marks the
                         attempt; validity is judged server-side at submit.
                    format: int32
                engineParams:
                    type: object
                    additionalProperties:
                        type: string
                    description: |-
                        Engine tuning bag — spawn intervals, speeds, sizes; keys are content
                         owned by the engine registry (metric spec doc), values are strings.
                         The KV shape keeps tuning ops-only: no contract churn, no regen, no
                         client release for a spawn-interval change.
        cyber.esports.v1.TrackingMovingDetail:
            type: object
            properties:
                frames:
                    type: array
                    items:
                        $ref: '#/components/schemas/cyber.esports.v1.TrackingMovingFrame'
            description: tracking_moving — sustained tracking of a moving target.
        cyber.esports.v1.TrackingMovingFrame:
            type: object
            properties:
                elapsedMs:
                    type: integer
                    format: int32
                target:
                    $ref: '#/components/schemas/cyber.esports.v1.Point'
                crosshair:
                    $ref: '#/components/schemas/cyber.esports.v1.Point'
                deviation:
                    type: number
                    format: double
                player:
                    $ref: '#/components/schemas/cyber.esports.v1.Point'
                hit:
                    type: boolean
                    description: |-
                        Presence marks a shot frame (movement frames leave both unset) — the
                         merged legacy stream mixed the two kinds with no discriminator.
                dotLifetimeMs:
                    type: integer
                    description: The dot's spawn-to-kill lifetime; rides only on shot frames.
                    format: int32
        cyber.esports.v1.UpdateProfileRequest:
            type: object
            properties:
                nickname:
                    type: string
                avatarUrl:
                    type: string
                birthYear:
                    type: integer
                    format: int32
                birthMonth:
                    type: integer
                    format: int32
                guardianAccepted:
                    type: boolean
                    description: |-
                        True stamps guardian_consented_at server-side — the server is the only
                         writer of that timestamp.
                gamePreference:
                    allOf:
                        - $ref: '#/components/schemas/cyber.esports.v1.GamePreferenceInput'
                    description: |-
                        Replace-set: presence rewrites the whole preference list (present with
                         empty lists clears it). The business custom-game cap is a product
                         constant enforced server-side; the repeated bounds below are static
                         backstops only.
                sex:
                    enum:
                        - PROFILE_SEX_UNSPECIFIED
                        - PROFILE_SEX_MALE
                        - PROFILE_SEX_FEMALE
                        - PROFILE_SEX_UNDETERMINED
                    type: string
                    format: enum
            description: |-
                updateProfile — presence-based partial update: a field left out stays
                 untouched; each onboarding step saves its own slice.
        cyber.esports.v1.UpdateProfileResponse:
            type: object
            properties:
                profile:
                    $ref: '#/components/schemas/cyber.esports.v1.Profile'
        cyber.esports.v1.UpdateTestConfigRequest:
            type: object
            properties:
                testId:
                    type: string
                backgroundInvalidSeconds:
                    type: integer
                    format: int32
                engineParams:
                    type: object
                    additionalProperties:
                        type: string
                    description: |-
                        Full replacement when present, no patch semantics — the page always
                         reads before it writes, so replace-what-you-saw is the simpler
                         contract than a merge the operator could lose rows in.
            description: |-
                The one write this plane owns. Absent fields stay untouched — the
                 operator tunes one dial at a time; duration_seconds is deliberately
                 absent because it mirrors test.duration_seconds and answers to the
                 catalog, not to this bag.
        cyber.esports.v1.UpdateTestConfigResponse:
            type: object
            properties:
                config:
                    $ref: '#/components/schemas/cyber.esports.v1.TestConfig'
