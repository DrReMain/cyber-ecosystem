        cyber.esports.v1.SessionAbilityLine:
            type: object
            properties:
                ability:
                    type: string
                gameCode:
                    type: string
                    description: The game whose best attempt fed the line.
                bestScore:
                    type: number
                    description: |-
                        This session's best valid attempt — the settlement headline (a line
                         exists only when a valid attempt landed, so this is never empty).
                    format: double
                attemptScores:
                    type: array
                    items:
                        type: number
                        format: double
                    description: |-
                        Every valid attempt's authoritative score in ordinal order — the
                         "N attempts, best taken" receipt.
                bestGrade:
                    type: string
                    description: |-
                        The best attempt's grade; null when that attempt carried no cohort
                         answer.
                percentile:
                    type: number
                    description: |-
                        The ability's percentile from the anchor's frozen snapshot; null
                         while the cohort says nothing.
                    format: double
                prevSessionScore:
                    type: number
                    description: |-
                        The same ability's score on the member's previous session — null on
                         the first session (the note renders "first", never zero).
                    format: double
                historyBestScore:
                    type: number
                    description: |-
                        The cross-session best including this session's attempts — the mark
                         the comparison track and the "new personal best" note read.
                    format: double
            description: |-
                One ability's session verdict — the three numbers the settlement face
                 keeps distinct: this session's best, the previous session's word, and
                 the cross-session best.
        cyber.esports.v1.SessionAttemptDetail:
            type: object
            properties:
                ability:
                    type: string
                    description: The six-word vocabulary; the face filters its own ability's rows.
                gameCode:
                    type: string
                attemptNo:
                    type: integer
                    description: The attempt's ordinal within the game — the retest counter.
                    format: int32
                rawScore:
                    type: number
                    description: |-
                        The uncapped linear track — the only number a curve-pending attempt
                         has.
                    format: double
                authoritativeScore:
                    type: number
                    description: |-
                        Null while the game's calibration curve is pending; the row still
                         travels.
                    format: double
                grade:
                    type: string
                    description: The authoritative answer's band; null with the score.
                at:
                    type: string
                    format: date-time
            description: |-
                One attempt's read-back row — the raw track always present, the
                 authoritative answer only once the game's curve has spoken. A pending
                 row (raw set, authoritative null) renders under the same raw-score
                 label law the settlement face holds.
