        cyber.system.v1.CalendarOverride:
            type: object
            properties:
                date:
                    type: string
                allowed:
                    type: boolean
                    description: true = allowed on this date, false = denied.
            description: A single-date exception on the calendar; dates are server-local.
        cyber.system.v1.CalendarParams:
            type: object
            properties:
                base:
                    type: string
                    description: Periodic default when no override matches the day.
                overrides:
                    type: array
                    items:
                        $ref: '#/components/schemas/cyber.system.v1.CalendarOverride'
                    description: At most one entry per date (deep-validated on save).
            description: |-
                Calendar constraint: a periodic base plus per-date overrides that win over
                 it. Three forms: WEEKDAYS + deny overrides = workday calendar (holidays);
                 NONE + allow overrides = on-call/inspection calendar; ALL + deny
                 overrides = lockdown calendar.
