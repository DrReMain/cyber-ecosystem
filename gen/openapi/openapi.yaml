            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/cyber.system.v1.ConfirmUploadRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/cyber.system.v1.ConfirmUploadResponse'
    /api/v1/system/uploads/{id}/parts:
        get:
            tags:
                - FilePresignService
            operationId: FilePresignService_ListUploadedParts
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/cyber.system.v1.ListUploadedPartsResponse'
    /api/v1/system/users:
        get:
            tags:
                - UserService
            operationId: UserService_ListUsers
            parameters:
                - name: page.pageNo
                  in: query
                  description: Page number (1-based).
                  schema:
                    type: integer
                    format: int32
                - name: page.pageSize
                  in: query
                  description: Page size.
                  schema:
                    type: integer
                    format: int32
                - name: page.all
                  in: query
                  description: Return all results without pagination.
                  schema:
                    type: boolean
                - name: page.createdAtA
                  in: query
                  description: Filter by created_at >= this value.
                  schema:
                    type: string
                    format: date-time
                - name: page.createdAtZ
                  in: query
                  description: Filter by created_at <= this value.
                  schema:
                    type: string
                    format: date-time
                - name: page.updatedAtA
                  in: query
                  description: Filter by updated_at >= this value.
                  schema:
                    type: string
                    format: date-time
                - name: page.updatedAtZ
                  in: query
                  description: Filter by updated_at <= this value.
                  schema:
                    type: string
                    format: date-time
                - name: account
                  in: query
                  schema:
                    type: string
                - name: enabled
                  in: query
                  schema:
                    type: boolean
                - name: deptId
                  in: query
                  schema:
                    type: string
                - name: orderBy
                  in: query
                  schema:
                    type: array
                    items:
                        type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/cyber.system.v1.ListUsersResponse'
        post:
            tags:
                - UserService
            operationId: UserService_CreateUser
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/cyber.system.v1.CreateUserRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/cyber.system.v1.CreateUserResponse'
    /api/v1/system/users/batch-get:
        post:
            tags:
                - UserService
            operationId: UserService_BatchGetUsers
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/cyber.system.v1.BatchGetUsersRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/cyber.system.v1.BatchGetUsersResponse'
    /api/v1/system/users/by-population:
        post:
            tags:
                - UserService
            operationId: UserService_ListUsersByPopulation
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/cyber.system.v1.ListUsersByPopulationRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/cyber.system.v1.ListUsersByPopulationResponse'
    /api/v1/system/users/{id}:
        get:
            tags:
                - UserService
            operationId: UserService_GetUser
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/cyber.system.v1.GetUserResponse'
        put:
            tags:
                - UserService
            operationId: UserService_UpdateUser
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/cyber.system.v1.UpdateUserRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/cyber.system.v1.UpdateUserResponse'
        delete:
            tags:
                - UserService
            operationId: UserService_DeleteUser
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/cyber.system.v1.DeleteUserResponse'
    /api/v1/system/users/{id}/status:
        put:
            tags:
                - UserService
            operationId: UserService_UpdateUserStatus
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/cyber.system.v1.UpdateUserStatusRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/cyber.system.v1.UpdateUserStatusResponse'
components:
    schemas:
        cyber.agent.v1.AgentConfig:
            type: object
            properties:
                id:
                    type: string
                createdAt:
                    type: string
                    format: date-time
                updatedAt:
                    type: string
                    format: date-time
                userId:
                    type: string
                baseUrl:
                    type: string
                apiKeySet:
                    type: boolean
        cyber.agent.v1.AgentConfigView:
            type: object
            properties:
                id:
                    type: string
                createdAt:
                    type: string
                    format: date-time
                updatedAt:
                    type: string
                    format: date-time
                userId:
                    type: string
                userAccount:
                    type: string
                userAvatar:
                    type: string
                baseUrl:
                    type: string
                apiKeySet:
                    type: boolean
        cyber.agent.v1.ChatRequest:
            type: object
            properties:
                model:
                    type: string
                    description: |-
                        Model id as named by the user's endpoint (GET /v1/models vocabulary);
                         required, 1..128 chars.
                sessionId:
                    type: string
                    description: |-
                        Existing session id (max 20 chars); empty = the server creates a session
                         for this exchange.
                content:
                    type: string
                    description: |-
                        The new user turn; required, 1..32768 chars. History is loaded
                         server-side from the session.
            description: |-
                Constraints are enforced by explicit checks in the service handler: the
                 unary protovalidate middleware never sees streaming requests, so annotations
                 here would be dead rules.
        cyber.agent.v1.ChatResponse:
            type: object
            properties:
                contentDelta:
                    type: string
                    description: Incremental assistant text since the previous frame.
                reasoningDelta:
                    type: string
                    description: Incremental model reasoning (thinking output) since the previous frame.
                finishReason:
                    type: string
                    description: Present only on the final frame ("stop"/"length"/...), empty while streaming.
                sessionId:
                    type: string
                    description: |-
                        Present only on the first frame of a newly created session (strictly
                         before any delta); unset otherwise — protojson omits it.
            description: |-
                One streaming frame: deltas are incremental (append-only) and at most one
                 is set per frame; the final frame carries finish_reason with empty deltas.
                 Failures terminate the stream as a Connect error, never as a frame.
        cyber.agent.v1.ChatSession:
            type: object
            properties:
                id:
                    type: string
                createdAt:
                    type: string
                    format: date-time
                updatedAt:
                    type: string
                    format: date-time
                title:
                    type: string
                    description: First user message clipped server-side at creation; user-renamable.
            description: list sessions
        cyber.agent.v1.DeleteMyAgentConfigResponse:
            type: object
            properties: {}
        cyber.agent.v1.DeleteSessionResponse:
            type: object
            properties: {}
        cyber.agent.v1.GetMyAgentConfigResponse:
            type: object
            properties:
                agentConfig:
                    $ref: '#/components/schemas/cyber.agent.v1.AgentConfig'
        cyber.agent.v1.GetSessionMessagesResponse:
            type: object
            properties:
                page:
                    $ref: '#/components/schemas/cyber.shared.common.v1.PageResponse'
                list:
                    type: array
                    items:
                        $ref: '#/components/schemas/cyber.agent.v1.SessionMessage'
                    description: 'Fixed order: created_at DESC (page 1 = newest turns; later pages go back).'
        cyber.agent.v1.ListAgentConfigsResponse:
            type: object
            properties:
                page:
                    $ref: '#/components/schemas/cyber.shared.common.v1.PageResponse'
                list:
                    type: array
                    items:
                        $ref: '#/components/schemas/cyber.agent.v1.AgentConfigView'
        cyber.agent.v1.ListModelsResponse:
            type: object
            properties:
                models:
                    type: array
                    items:
                        type: string
                    description: Model ids exposed by the user's endpoint, order preserved.
        cyber.agent.v1.ListSessionsResponse:
            type: object
            properties:
                page:
                    $ref: '#/components/schemas/cyber.shared.common.v1.PageResponse'
                list:
                    type: array
                    items:
                        $ref: '#/components/schemas/cyber.agent.v1.ChatSession'
                    description: 'Fixed order: updated_at DESC (latest activity first).'
        cyber.agent.v1.SessionMessage:
            type: object
            properties:
                id:
                    type: string
                createdAt:
                    type: string
                    format: date-time
                role:
                    type: string
                    description: |-
                        Free-form role vocabulary (user/assistant today; tool parts are the S4
                         evolution) — deliberately unpatterned.
                content:
                    type: string
                reasoning:
                    type: string
                    description: Accumulated model reasoning on the assistant turn; empty on user turns.
                model:
                    type: string
                    description: Model id that produced the assistant turn; empty on user turns.
            description: get session messages
        cyber.agent.v1.UpdateMyAgentConfigRequest:
            type: object
            properties:
                baseUrl:
                    type: string
                apiKey:
                    type: string
            description: update
        cyber.agent.v1.UpdateMyAgentConfigResponse:
            type: object
            properties: {}
        cyber.agent.v1.UpdateSessionRequest:
            type: object
            properties:
                sessionId:
                    type: string
                    description: Session id; absent and unowned both resolve to not found (no existence leak).
                title:
                    type: string
                    description: New title; replaces the creation-time clip.
            description: update session
        cyber.agent.v1.UpdateSessionResponse:
            type: object
            properties: {}
        cyber.esports.v1.BackgroundSpan:
            type: object
            properties:
                elapsedMs:
                    type: integer
                    format: int32
                durationMs:
                    type: integer
                    format: int32
            description: |-
                The engine marks backgrounding spans; validity is judged server-side at
                 submit against TestConfig.background_invalid_seconds.
        cyber.esports.v1.CharacterCounterDetail:
            type: object
            properties:
                rounds:
                    type: array
                    items:
                        $ref: '#/components/schemas/cyber.esports.v1.CharacterCounterRound'
            description: |-
                character_counter — lineup counter-picking; the counter score is a
                 server-side judgment against the counter matrix.
        cyber.esports.v1.CharacterCounterRound:
            type: object
            properties:
                roundNumber:
                    type: integer
                    format: int32
                enemyLineup:
                    type: array
                    items:
                        type: string
                selectedLineup:
                    type: array
                    items:
                        type: string
                timeSpentMs:
                    type: integer
                    format: int32
        cyber.esports.v1.DualZoneBehavior:
            type: object
            properties:
                elapsedMs:
                    type: integer
                    format: int32
                zone:
                    type: string
                    description: Open vocabulary {left | right} — legacy LEFT/RIGHT lowercased.
                event:
                    type: string
                    description: Open vocabulary {collision | dodge}.
                position:
                    $ref: '#/components/schemas/cyber.esports.v1.Point'
                obstacleId:
                    type: integer
                    format: int32
        cyber.esports.v1.DualZoneDetail:
            type: object
            properties:
                behaviors:
                    type: array
                    items:
                        $ref: '#/components/schemas/cyber.esports.v1.DualZoneBehavior'
            description: |-
                dual_zone — two-lane dodging; the behavior stream carries zone sides and
                 collision/dodge events with optional geometry.
        cyber.esports.v1.EconomicSimDetail:
            type: object
            properties:
                lastHits:
                    type: array
                    items:
                        $ref: '#/components/schemas/cyber.esports.v1.EconomicSimLastHit'
                purchases:
                    type: array
                    items:
                        $ref: '#/components/schemas/cyber.esports.v1.EconomicSimPurchase'
                missedMinions:
                    type: integer
                    description: |-
                        Minions that died untended — a missed lane creep leaves no event, so
                         the count rides the top level (legacy missedMinions).
                    format: int32
                finalHealthHp:
                    type: integer
                    description: Terminal health on the legacy 0-1500 hp wire scale (health% × 15).
                    format: int32
            description: economic_sim — last-hitting and spending economy.
        cyber.esports.v1.EconomicSimLastHit:
            type: object
            properties:
                elapsedMs:
                    type: integer
                    format: int32
                isLastHit:
                    type: boolean
                goldEarned:
                    type: integer
                    format: int32
                minionType:
                    type: string
                    description: Open vocabulary {melee | ranged | cannon} — the minion on the block.
                minionHealth:
                    type: integer
                    description: |-
                        The minion's remaining health at the tap — the window verdict is a
                         server-side judgment from it (legacy judged client-side).
                    format: int32
        cyber.esports.v1.EconomicSimPurchase:
            type: object
            properties:
                elapsedMs:
                    type: integer
                    format: int32
                itemName:
                    type: string
                cost:
                    type: integer
                    format: int32
        cyber.esports.v1.FlashAimingDetail:
            type: object
            properties:
                shots:
                    type: array
                    items:
                        $ref: '#/components/schemas/cyber.esports.v1.FlashAimingShot'
                misses:
                    type: integer
                    description: |-
                        Expired-or-replaced targets, legacy: targetsMissed. No click exists for
                         these, so the shot stream can never rebuild the count.
                    format: int32
            description: flash_aiming — snap shots at flashing targets.
        cyber.esports.v1.FlashAimingShot:
            type: object
            properties:
                targetId:
                    type: string
                target:
                    $ref: '#/components/schemas/cyber.esports.v1.Point'
                targetSize:
                    type: number
                    format: double
                click:
                    $ref: '#/components/schemas/cyber.esports.v1.Point'
                deviation:
                    type: number
                    format: double
                aimTimeMs:
                    type: integer
                    format: int32
        cyber.esports.v1.Game:
            type: object
            properties:
                id:
                    type: string
                    description: |-
                        Immutable code join key (e.g. "lol") — same law as tenant/population
                         codes: born once, referenced forever.
                name:
                    type: string
                category:
                    type: string
                    description: |-
                        Seeded fps/moba; the vocabulary is admin-managed and open — new
                         categories classify in without a contract change.
                iconUrl:
                    type: string
                description:
                    type: string
                createdAt:
                    type: string
                    format: date-time
                updatedAt:
                    type: string
                    format: date-time
        cyber.esports.v1.GamePreferenceInput:
            type: object
            properties:
                gameIds:
                    type: array
                    items:
                        type: string
                customNames:
                    type: array
                    items:
                        type: string
        cyber.esports.v1.GetMemberResponse:
            type: object
            properties:
                member:
                    $ref: '#/components/schemas/cyber.esports.v1.Member'
        cyber.esports.v1.GetProfileResponse:
            type: object
            properties:
                profile:
                    $ref: '#/components/schemas/cyber.esports.v1.Profile'
        cyber.esports.v1.GetTestConfigResponse:
            type: object
            properties:
                config:
                    $ref: '#/components/schemas/cyber.esports.v1.TestConfig'
        cyber.esports.v1.GetTestResponse:
            type: object
            properties:
                test:
                    $ref: '#/components/schemas/cyber.esports.v1.Test'
                introduction:
                    type: string
                    description: |-
                        Long-form how-to copy, per test — seeded from the six ability texts
                         and free to diverge per test; copy changes are content, never contract.
        cyber.esports.v1.ListGamesResponse:
            type: object
            properties:
                games:
                    type: array
                    items:
                        $ref: '#/components/schemas/cyber.esports.v1.Game'
        cyber.esports.v1.ListMembersResponse:
            type: object
            properties:
                page:
                    $ref: '#/components/schemas/cyber.shared.common.v1.PageResponse'
                members:
                    type: array
                    items:
                        $ref: '#/components/schemas/cyber.esports.v1.Member'
        cyber.esports.v1.ListTestsResponse:
            type: object
            properties:
                tests:
                    type: array
                    items:
                        $ref: '#/components/schemas/cyber.esports.v1.Test'
        cyber.esports.v1.Member:
            type: object
            properties:
                userId:
                    type: string
                    description: Identity part, hydrated from the system roster.
                account:
                    type: string
                avatar:
                    type: string
                enabled:
                    type: boolean
                registeredAt:
                    type: string
                    description: |-
                        The identity row's creation time — the registration trace the
                         identity core carries.
                    format: date-time
                nickname:
                    type: string
                    description: Profile part; an absent profile row renders as all-unset fields.
                birthYear:
                    type: integer
                    format: int32
                birthMonth:
                    type: integer
                    format: int32
                ageBand:
                    type: string
                games:
                    type: array
                    items:
                        $ref: '#/components/schemas/cyber.esports.v1.ProfileGame'
        cyber.esports.v1.MovingTargetDetail:
            type: object
            properties:
                shots:
                    type: array
                    items:
                        $ref: '#/components/schemas/cyber.esports.v1.MovingTargetShot'
            description: |-
                moving_target — tracking across movement patterns; the pattern phase is a
                 fact the server needs to reproduce per-pattern aggregates (legacy had it
                 only as a client-side summary).
        cyber.esports.v1.MovingTargetShot:
            type: object
            properties:
                elapsedMs:
                    type: integer
                    format: int32
                target:
                    $ref: '#/components/schemas/cyber.esports.v1.Point'
                crosshair:
                    $ref: '#/components/schemas/cyber.esports.v1.Point'
                deviation:
                    type: number
                    format: double
                hit:
                    type: boolean
                pattern:
                    type: string
                    description: Open vocabulary {straight | curve | zigzag | circle | random | variable}.
        cyber.esports.v1.MultiTargetDetail:
            type: object
            properties:
                picks:
                    type: array
                    items:
                        $ref: '#/components/schemas/cyber.esports.v1.MultiTargetPick'
                missedHigh:
                    type: integer
                    description: |-
                        High-tier targets lost to expiry, legacy: missedHighValue. The picks
                         stream carries only picked targets, so the loss count has no other carrier.
                    format: int32
            description: |-
                multi_target — priority firing under value tiers. The legacy pick stream
                 carried no tier; the tier rides here now so the server can rebuild every
                 priority aggregate from facts.
        cyber.esports.v1.MultiTargetPick:
            type: object
            properties:
                targetId:
                    type: string
                tier:
                    type: string
                    description: Open vocabulary {high | medium | low | trap}.
                isHit:
                    type: boolean
                elapsedMs:
                    type: integer
                    format: int32
        cyber.esports.v1.NumberStarsClick:
            type: object
            properties:
                number:
                    type: integer
                    format: int32
                elapsedMs:
                    type: integer
                    format: int32
                position:
                    $ref: '#/components/schemas/cyber.esports.v1.Point'
        cyber.esports.v1.NumberStarsDetail:
            type: object
            properties:
                rounds:
                    type: array
                    items:
                        $ref: '#/components/schemas/cyber.esports.v1.NumberStarsRound'
            description: |-
                number_stars — numeric sequence tapping; the round's target sequence plus
                 the click stream let the server rebuild accuracy and decision intervals
                 (legacy asserted isCorrect/expectedNumber client-side — now derived).
        cyber.esports.v1.NumberStarsRound:
            type: object
            properties:
                roundNumber:
                    type: integer
                    format: int32
                numbers:
                    type: array
                    items:
                        type: integer
                        format: int32
                clicks:
                    type: array
                    items:
                        $ref: '#/components/schemas/cyber.esports.v1.NumberStarsClick'
        cyber.esports.v1.OffenseDefenseDecision:
            type: object
            properties:
                scenarioId:
                    type: string
                choice:
                    type: string
                    description: Open vocabulary {attack | defense | retreat}; absent = unanswered.
                decisionTimeMs:
                    type: integer
                    format: int32
                timeout:
                    type: boolean
        cyber.esports.v1.OffenseDefenseDetail:
            type: object
            properties:
                decisions:
                    type: array
                    items:
                        $ref: '#/components/schemas/cyber.esports.v1.OffenseDefenseDecision'
            description: |-
                offense_defense — scenario decisions; correctness is judged server-side
                 against the scenario answer key (legacy isCorrect dropped).
        cyber.esports.v1.Point:
            type: object
            properties:
                x:
                    type: number
                    format: double
                y:
                    type: number
                    format: double
        cyber.esports.v1.Profile:
            type: object
            properties:
                id:
                    type: string
                    description: Owning key resolved from the session; never client-supplied.
                nickname:
                    type: string
                    description: |-
                        2-12 chars once set — the onboarding display constraint, carried from
                         legacy experience data.
                birthYear:
                    type: integer
                    format: int32
                birthMonth:
                    type: integer
                    description: |-
                        1-12. Year+month is the collected granularity: a day would be fabricated
                         precision nothing consumes (bands are year-granular).
                    format: int32
                ageBand:
                    type: string
                    description: |-
                        Server-derived from birth year/month; null while birth is unknown. Word
                         set (frozen 8-band split): under12 | 12-14 | 15-17 | 18-22 | 23-25 |
                         26-29 | 30-40 | over40. Clients render, never compute.
                avatarUrl:
                    type: string
                guardianConsentedAt:
                    type: string
                    description: |-
                        Stamped server-side when guardian_accepted arrives with a derived age
                         under 13; null = not consented. The under-13 hard gate refuses saves
                         without it (ESPORTS_PROFILE_GUARDIAN_CONSENT_REQUIRED).
                    format: date-time
                games:
                    type: array
                    items:
                        $ref: '#/components/schemas/cyber.esports.v1.ProfileGame'
                createdAt:
                    type: string
                    format: date-time
                updatedAt:
                    type: string
                    format: date-time
            description: |-
                The member's own profile. Entity fields are wrappers: null means "not set
                 yet" (the row is born lazily on first save), never a zero value.
        cyber.esports.v1.ProfileGame:
            type: object
            properties:
                gameId:
                    type: string
                customName:
                    type: string
            description: |-
                One preference entry: exactly one of the pair is set — a catalog reference
                 or a user-typed name awaiting admin classification.
        cyber.esports.v1.RedDotDetail:
            type: object
            properties:
                events:
                    type: array
                    items:
                        $ref: '#/components/schemas/cyber.esports.v1.RedDotEvent'
            description: red_dot — reaction tap on a moving spot.
        cyber.esports.v1.RedDotEvent:
            type: object
            properties:
                target:
                    $ref: '#/components/schemas/cyber.esports.v1.Point'
                click:
                    $ref: '#/components/schemas/cyber.esports.v1.Point'
                reactionTimeMs:
                    type: integer
                    format: int32
                deviation:
                    type: number
                    format: double
                isHit:
                    type: boolean
        cyber.esports.v1.ResourceMatchCollect:
            type: object
            properties:
                kind:
                    type: string
