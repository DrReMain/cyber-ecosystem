pre-commit:
  parallel: true
  commands:
    nx-fmt:
      run: ./nx run tools:go:fmt && ./nx affected -t check --base HEAD
    docs-gate:
      run: ./nx run docs:check
    gen-guard:
      run: >
        staged=$(git diff --cached --name-only);
        if echo "$staged" | grep -q '^gen/'; then
          echo "$staged" | grep -qE '\.proto$' || echo "$staged" | grep -q '^pnpm-lock\.yaml$' || {
            echo "gen/ is derived — never hand-edit; stage the .proto (or the generator-bump's pnpm-lock) and run ./nx run proto:generate" >&2;
            exit 1;
          };
        fi
    ledger-guard:
      run: >
        if git diff --cached --name-only | grep -q '^docs/roadmap/'; then
          echo "docs/roadmap/ holds working ledgers — never committed" >&2;
          exit 1;
        fi

pre-push:
  commands:
    gates:
      run: ./nx run tools:gates:push
