syntax = "proto3";

// buf:lint:ignore PACKAGE_DIRECTORY_MATCH — repo-level extension, not a cyber domain directory
package cyber.ext.v1;

import "google/protobuf/descriptor.proto";

option go_package = "cyber-ecosystem/gen/go/cyber/ext/v1";

// Authorization NATURE, orthogonal to `access` (which is audience: who may
// reach an RPC). `builtin` marks a session-contract operation — always
// allowed for any authenticated principal, evaluated before grants, and not
// configurable away: an operator must not be able to lock a user out of
// their own identity or own base capabilities (e.g. personal file space).
// Keep the set tiny — identity-introspective or base self-space; business
// operations never qualify. Enforcement engines collect the set from proto
// reflection at compile time (per-service, own protos only); guard tests
// enforce builtin => ACCESS_ADMIN (a PUBLIC method needs no builtin).
extend google.protobuf.MethodOptions {
  bool builtin = 10002;
}

// Row-level narrowing applicability: the operation's result rows / target
// rows are filtered by the ctx Decision's scopes — an entity with
// DatascopeMixin consumes them. Create-style methods never qualify (no row
// to narrow yet). The catalog relays the flag; the grant editor offers
// scope selection only on annotated rows — never offer configuration that
// will not take effect. Guard tests enforce datascope => ACCESS_ADMIN &&
// !builtin.
extend google.protobuf.MethodOptions {
  bool datascope = 10004;
}
