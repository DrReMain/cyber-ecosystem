syntax = "proto3";

package cyber.transfer.v1;

import "google/protobuf/timestamp.proto";

option go_package = "cyber-ecosystem/gen/go/cyber/transfer/v1";

// Streaming transport message payloads (Subscribe / Echo / Pipe / Raw).
//
// Message-only package: the services that expose these streaming primitives
// (SSE / client-stream / bidi / HttpBody) live in edge packages, e.g.
// cyber/mobile/v1/mobile_transfer.proto.

// Subscribe request.
message SubscribeRequest {
  // Topic to subscribe.
  string topic = 1;
  // Last event ID for reconnection.
  string last_event_id = 2;
}

// Subscribe event response.
message SubscribeResponse {
  // Event ID for SSE reconnection.
  string event_id = 1;
  // Event type for SSE client-side filtering.
  string event_type = 2;
  // Event payload.
  bytes data = 3;
  // Event timestamp.
  google.protobuf.Timestamp timestamp = 4;
}

// Echo request message.
message EchoRequest {
  // Message payload.
  bytes data = 1;
  // Sequence number.
  int64 sequence = 2;
}

// Echo response summary.
message EchoResponse {
  // Total messages received.
  int32 total_messages = 1;
  // Total bytes received.
  int64 total_bytes = 2;
  // Last sequence number.
  int64 last_sequence = 3;
  // Round-trip duration in nanoseconds.
  int64 duration_ns = 4;
}

// Bidirectional pipe request.
message PipeRequest {
  // Message payload.
  bytes data = 1;
  // Message type.
  string type = 2;
  // Sequence number.
  int64 sequence = 3;
}

// Bidirectional pipe response.
message PipeResponse {
  // Message payload.
  bytes data = 1;
  // Message type.
  string type = 2;
  // Sequence number.
  int64 sequence = 3;
}

// Raw bytes request.
message RawRequest {
  // Desired content type for the response.
  string content_type = 1;
  // Request body.
  bytes data = 2;
}
