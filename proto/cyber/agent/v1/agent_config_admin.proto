syntax = "proto3";

package cyber.agent.v1;

import "cyber/shared/common/v1/pagination.proto";
import "ext/v1/access.proto";
import "ext/v1/desc.proto";
import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";

option go_package = "cyber-ecosystem/gen/go/cyber/agent/v1";

service AgentConfigAdminService {
  option (cyber.ext.v1.service_comment) = "agent连接管理";
  rpc ListAgentConfigs(ListAgentConfigsRequest) returns (ListAgentConfigsResponse) {
    option (cyber.ext.v1.method) = {
      comment: "查询agent连接"
      action: ACTION_READ
    };
    option (cyber.ext.v1.access) = ACCESS_ADMIN;
    option (google.api.http) = {get: "/api/v1/agent/agent-configs"};
  }
}

// list
message ListAgentConfigsRequest {
  cyber.shared.common.v1.PageRequest page = 1;
}

message ListAgentConfigsResponse {
  cyber.shared.common.v1.PageResponse page = 1;
  repeated AgentConfigView list = 2;
}

message AgentConfigView {
  google.protobuf.StringValue id = 1;
  google.protobuf.Timestamp created_at = 2;
  google.protobuf.Timestamp updated_at = 3;
  google.protobuf.StringValue user_id = 4;
  google.protobuf.StringValue user_email = 5;
  google.protobuf.StringValue user_avatar = 6;
  google.protobuf.StringValue base_url = 7;
  google.protobuf.BoolValue api_key_set = 8;
}
