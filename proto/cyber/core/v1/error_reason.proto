syntax = "proto3";

package cyber.core.v1;

import "errors/errors.proto";

option go_package = "cyber-ecosystem/gen/go/cyber/core/v1";

// business errors (service-level): domain-specific failures the
// service layer returns actively, distinct from the generic codes in
// cyber/shared/errors (General/Auth/Flow/Infra). The 6xxx range is reserved for
// core business errors.
enum ErrorReason {
  option (.errors.default_code) = 400;

  ERROR_REASON_UNSPECIFIED = 0 [(.errors.code) = 500];

  // A status change the current status does not allow (FSM transition violation).
  ERROR_REASON_STATUS_INVALID_TRANSITION = 6000 [(.errors.code) = 400];
  // The phone is already created.
  ERROR_REASON_USER_ALREADY_EXISTS = 6001 [(.errors.code) = 409];
}
