syntax = "proto3";

package cyber.mobile.v1;

import "cyber/shared/ext/v1/desc.proto";
import "cyber/transfer/v1/transfer.proto";
import "google/api/annotations.proto";
import "google/api/httpbody.proto";

option go_package = "cyber-ecosystem/gen/go/cyber/mobile/v1";

// Mobile transfer service. Exposes the streaming transport primitives
// (SSE / client-stream / bidi / HttpBody) to mobile clients.
service MobileTransferService {
  // Subscribe to events via SSE.
  rpc Subscribe(cyber.transfer.v1.SubscribeRequest) returns (stream cyber.transfer.v1.SubscribeResponse) {
    option (cyber.shared.ext.v1.method_comment) = "订阅事件流";
    option (google.api.http) = {get: "/api/v1/mobile/transfer/subscribe"};
  }
  // Echo back a summary of received messages.
  rpc Echo(stream cyber.transfer.v1.EchoRequest) returns (cyber.transfer.v1.EchoResponse) {
    option (cyber.shared.ext.v1.method_comment) = "流式回显";
    option (google.api.http) = {get: "/api/v1/mobile/transfer/echo"};
  }
  // Bidirectional data pipe via WebSocket.
  rpc Pipe(stream cyber.transfer.v1.PipeRequest) returns (stream cyber.transfer.v1.PipeResponse) {
    option (cyber.shared.ext.v1.method_comment) = "双向数据管道";
    option (google.api.http) = {get: "/api/v1/mobile/transfer/pipe"};
  }
  // Return raw bytes via HttpBody.
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME -- HttpBody is intentional: raw binary response, not a conventional *Response message.
  rpc Raw(cyber.transfer.v1.RawRequest) returns (google.api.HttpBody) {
    option (cyber.shared.ext.v1.method_comment) = "原始字节响应";
    option (google.api.http) = {
      post: "/api/v1/mobile/transfer/raw"
      body: "*"
    };
  }
}
