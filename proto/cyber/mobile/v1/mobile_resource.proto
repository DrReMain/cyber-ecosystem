syntax = "proto3";

package cyber.mobile.v1;

import "cyber/resource/v1/resource.proto";
import "cyber/shared/ext/v1/desc.proto";
import "google/api/annotations.proto";

option go_package = "cyber-ecosystem/gen/go/cyber/mobile/v1";

// Mobile resource introspection service. Lists all RPC service/method info by
// reflecting on the registered proto descriptors.
service MobileResourceService {
  // List all RPC service and method info.
  rpc ListResource(cyber.resource.v1.ListResourceRequest) returns (cyber.resource.v1.ListResourceResponse) {
    option (cyber.shared.ext.v1.method_comment) = "获取所有rpc信息";
    option (google.api.http) = {get: "/api/v1/mobile/resource"};
  }
}
