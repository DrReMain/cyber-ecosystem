  FLOW_ERROR_UNSPECIFIED = 0 [(cyber.shared.errors.v1.code) = 500];

  FLOW_ERROR_RATE_LIMITED = 4000 [(cyber.shared.errors.v1.code) = 429];
  FLOW_ERROR_CIRCUIT_BREAKER = 4001 [(cyber.shared.errors.v1.code) = 503];
  FLOW_ERROR_QUOTA_EXCEEDED = 4002 [(cyber.shared.errors.v1.code) = 429];
  FLOW_ERROR_CONCURRENT_LIMIT = 4003 [(cyber.shared.errors.v1.code) = 429];
}
