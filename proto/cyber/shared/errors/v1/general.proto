syntax = "proto3";

package cyber.shared.errors.v1;

import "errors/errors.proto";

option go_package = "cyber-ecosystem/gen/go/cyber/shared/errors/v1";

enum GeneralError {
  option (.errors.default_code) = 500;

  GENERAL_ERROR_UNSPECIFIED = 0 [(.errors.code) = 500];

  // 400 Bad Request
  GENERAL_ERROR_INVALID_ARGUMENT = 100 [(.errors.code) = 400];
  GENERAL_ERROR_VALIDATION_FAILED = 101 [(.errors.code) = 400];
  GENERAL_ERROR_PAGINATION_INVALID_ARGUMENT = 102 [(.errors.code) = 400];

  // 401 Unauthorized / 403 Forbidden
  GENERAL_ERROR_UNAUTHENTICATED = 200 [(.errors.code) = 401];
  GENERAL_ERROR_TOKEN_EXPIRED = 201 [(.errors.code) = 401];
  GENERAL_ERROR_PERMISSION_DENIED = 202 [(.errors.code) = 403];

  // 404 / 405 / 409 / 412 / 413
  GENERAL_ERROR_NOT_FOUND = 300 [(.errors.code) = 404];
  GENERAL_ERROR_METHOD_NOT_ALLOWED = 301 [(.errors.code) = 405];
  GENERAL_ERROR_ALREADY_EXISTS = 302 [(.errors.code) = 409];
  GENERAL_ERROR_PRECONDITION_FAILED = 303 [(.errors.code) = 412];
  GENERAL_ERROR_PAYLOAD_TOO_LARGE = 304 [(.errors.code) = 413];

  // 429 Too Many Requests
  GENERAL_ERROR_RESOURCE_EXHAUSTED = 400 [(.errors.code) = 429];

  // 5xx Server Errors
  GENERAL_ERROR_INTERNAL = 500 [(.errors.code) = 500];
  GENERAL_ERROR_NOT_IMPLEMENTED = 501 [(.errors.code) = 501];
  GENERAL_ERROR_UNAVAILABLE = 502 [(.errors.code) = 503];
  GENERAL_ERROR_TIMEOUT = 503 [(.errors.code) = 504];
}
