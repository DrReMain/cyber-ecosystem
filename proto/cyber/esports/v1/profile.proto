syntax = "proto3";

package cyber.esports.v1;

import "buf/validate/validate.proto";
import "ext/v1/access.proto";
import "ext/v1/desc.proto";
import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";

option go_package = "cyber-ecosystem/gen/go/cyber/esports/v1";

// Player profile, the C-end onboarding aggregate: nickname, birth year/month,
// the age band derived from it, guardian consent for under-13s, and game
// preference. Identity stays in system — every face here is caller-scoped:
// the owning key resolves from the session seat (system introspection) and
// never appears in a request.
service ProfileService {
  option (cyber.ext.v1.service_comment) = "玩家画像";
  rpc GetProfile(GetProfileRequest) returns (GetProfileResponse) {
    option (cyber.ext.v1.method) = {
      comment: "获取当前玩家画像"
      action: ACTION_READ
    };
    option (cyber.ext.v1.access) = ACCESS_BUILTIN;
    option (google.api.http) = {get: "/api/v1/esports/profile"};
  }
  rpc UpdateProfile(UpdateProfileRequest) returns (UpdateProfileResponse) {
    option (cyber.ext.v1.method) = {
      comment: "保存当前玩家画像"
      action: ACTION_WRITE
    };
    option (cyber.ext.v1.access) = ACCESS_BUILTIN;
    option (google.api.http) = {
      put: "/api/v1/esports/profile"
      body: "*"
    };
  }
  rpc PreviewMerge(PreviewMergeRequest) returns (PreviewMergeResponse) {
    option (cyber.ext.v1.method) = {
      comment: "合并 offer 面：空号判据与两账号摘要"
      action: ACTION_READ
    };
    option (cyber.ext.v1.access) = ACCESS_BUILTIN;
    option (google.api.http) = {
      post: "/api/v1/esports/profile/preview-merge"
      body: "*"
    };
  }
}

// previewMerge ------------------------------------------------------------------------

// The merge offer's decision input. The sms branch carries the bare phone —
// occupancy is not a secret the bind flow doesn't already reveal, and the
// merge itself re-proves with a fresh code. The wechat branch carries the
// OAuth proof: only the exchange learns the openid, so the preview burns
// state and code exactly like a bind attempt would.
message PreviewMergeRequest {
  option (buf.validate.message).cel = {
    id: "PreviewMergeRequest.state_pairing"
    message: "state rides the wechat branch only"
    expression: "has(this.wechat) == has(this.state)"
  };

  oneof credential {
    option (buf.validate.oneof).required = true;
    string phone = 1 [(buf.validate.field).string.pattern = "^[0-9+]{5,20}$"];
    WeChatMergeProof wechat = 2;
  }
  // Wechat branch only: the bind-minted one-shot state.
  optional string state = 3 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 128
  ];
}

message WeChatMergeProof {
  optional string code = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
}

// The offer verdict. KEEP_CALLER: the other side is the empty one and the
// caller's session executes the merge as-is. KEEP_OTHER: the caller is the
// empty one; the client decomposes — log in via the other side's wechat,
// then merge with the caller's phone code. BLOCKED: both sides carry
// business weight, no automatic merge. FREE and SELF answer the plain-bind
// question so the bind pages can route without a second vocabulary.
enum MergePreviewStatus {
  MERGE_PREVIEW_STATUS_UNSPECIFIED = 0;
  MERGE_PREVIEW_STATUS_FREE = 1;
  MERGE_PREVIEW_STATUS_SELF = 2;
  MERGE_PREVIEW_STATUS_KEEP_CALLER = 3;
  MERGE_PREVIEW_STATUS_KEEP_OTHER = 4;
  MERGE_PREVIEW_STATUS_BLOCKED = 5;
}

// One side's confirm-page facts. Identifier-shaped values arrive masked by
// the system service; clients render, never re-derive. The plain scalars
// (user_id, wechat, sessions, unlocked) ride the success-implies-present
// carve-out: every preview computes them, so zero means a real zero (no
// sessions, no wechat, nothing unlocked) — never "not computed".
message MergeAccountSummary {
  string user_id = 1;
  // Masked phone when the side holds an sms credential, else null.
  google.protobuf.StringValue phone_mask = 2;
  // True when the side holds a wechat credential.
  bool wechat = 3;
  // Distinct assessment sessions with a valid attempt.
  int32 sessions = 4;
  // The furthest live membership window; null = no live membership.
  google.protobuf.Timestamp member_until = 5;
  // Any unlocked report family.
  bool unlocked = 6;
}

message PreviewMergeResponse {
  MergePreviewStatus status = 1;
  MergeAccountSummary caller = 2;
  MergeAccountSummary other = 3;
}

// The member's own profile. Entity fields are wrappers: null means "not set
// yet" (the row is born lazily on first save), never a zero value.
message Profile {
  // Owning key resolved from the session; never client-supplied.
  google.protobuf.StringValue id = 1;
  // 2-12 chars once set — the onboarding display constraint, carried from
  // legacy experience data.
  google.protobuf.StringValue nickname = 2;
  google.protobuf.Int32Value birth_year = 3;
  // 1-12. Year+month is the collected granularity: a day would be fabricated
  // precision nothing consumes (bands are year-granular).
  google.protobuf.Int32Value birth_month = 4;
  // Server-derived from birth year/month; null while birth is unknown. Word
  // set (frozen 8-band split): under12 | 12-14 | 15-17 | 18-22 | 23-25 |
  // 26-29 | 30-40 | over40. Clients render, never compute.
  google.protobuf.StringValue age_band = 5;
  google.protobuf.StringValue avatar_url = 6;
  // Stamped server-side when guardian_accepted arrives with a derived age
  // under 13; null = not consented. The under-13 hard gate refuses saves
  // without it (ESPORTS_PROFILE_GUARDIAN_CONSENT_REQUIRED).
  google.protobuf.Timestamp guardian_consented_at = 7;
  repeated ProfileGame games = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
  // Three states by the sex ruling: male, female, undetermined — the last
  // is the honest "not said", never guessed from anything. The report
  // cohort's same-age-same-sex benchmark reads it; undetermined benches
  // against the same-age pool regardless of sex.
  optional ProfileSex sex = 11;
}

// The profile's sex vocabulary, three states by ruling.
enum ProfileSex {
  PROFILE_SEX_UNSPECIFIED = 0;
  PROFILE_SEX_MALE = 1;
  PROFILE_SEX_FEMALE = 2;
  PROFILE_SEX_UNDETERMINED = 3;
}

// One preference entry: exactly one of the pair is set — a catalog reference
// or a user-typed name awaiting admin classification.
message ProfileGame {
  google.protobuf.StringValue game_id = 1;
  google.protobuf.StringValue custom_name = 2;
}

// getProfile
message GetProfileRequest {}

message GetProfileResponse {
  Profile profile = 1;
  // The furthest live membership window's end; null = no live membership —
  // the same liveness read the merge preview promises, riding the probe the
  // home greet already reads so membership adds no extra call. Clients
  // render presence, never re-derive expiry.
  google.protobuf.Timestamp member_until = 2;
}

// updateProfile — presence-based partial update: a field left out stays
// untouched; each onboarding step saves its own slice.
message UpdateProfileRequest {
  option (buf.validate.message).cel = {
    id: "UpdateProfileRequest.birth_pair"
    message: "birth_year and birth_month must be set together"
    expression: "has(this.birth_year) == has(this.birth_month)"
  };

  optional string nickname = 1 [(buf.validate.field).string = {
    min_len: 2
    max_len: 12
  }];
  optional string avatar_url = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 500
  }];
  optional int32 birth_year = 3 [(buf.validate.field).int32 = {
    gte: 1900
    lte: 2100
  }];
  optional int32 birth_month = 4 [(buf.validate.field).int32 = {
    gte: 1
    lte: 12
  }];
  // True stamps guardian_consented_at server-side — the server is the only
  // writer of that timestamp.
  optional bool guardian_accepted = 5;
  // Replace-set: presence rewrites the whole preference list (present with
  // empty lists clears it). The business custom-game cap is a product
  // constant enforced server-side; the repeated bounds below are static
  // backstops only.
  optional GamePreferenceInput game_preference = 6;
  optional ProfileSex sex = 7;
}

message GamePreferenceInput {
  repeated string game_ids = 1 [(buf.validate.field).repeated = {
    max_items: 50
    items: {
      string: {
        min_len: 1
        max_len: 64
      }
    }
  }];
  repeated string custom_names = 2 [(buf.validate.field).repeated = {
    max_items: 20
    items: {
      string: {
        min_len: 1
        max_len: 40
      }
    }
  }];
}

message UpdateProfileResponse {
  Profile profile = 1;
}
