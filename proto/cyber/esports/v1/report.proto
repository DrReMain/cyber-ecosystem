syntax = "proto3";

package cyber.esports.v1;

import "buf/validate/validate.proto";
import "cyber/esports/v1/entitlement.proto";
import "ext/v1/access.proto";
import "ext/v1/desc.proto";
import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";

option go_package = "cyber-ecosystem/gen/go/cyber/esports/v1";

// The member's report read face. The single-attempt ability report is one
// record's board under the unlock state the entitlement ledger holds for
// it — a trial-scope grant on this record (the pay domain's settle, the
// pricing ruling's unlock unit), an active membership window, or a
// redeemed family code; the same three facts the family access judgement
// reads, never re-derived here. The free tier renders the tier badge, the
// ability radar and the composite percentile; the unlocked tier adds the
// per-ability peer detail, the last-attempt comparison and the improvement
// board. Numbers travel, copy does not: the five-zone wording stays with
// the client until its configuration face lands.
//
// Beside the record board sit the two read-back faces: the session
// scoreboard (GetSessionReport) and the cross-session aggregate
// (GetAbilityDigest) — what a member sees of scores they already earned.
// Neither runs cohort math: the frozen snapshot is their only percentile
// source, same as the record board itself.
//
// The cluster faces (GetCognitiveReport, GetTrendReport, GetCareerReport)
// fold cross-session history into read-only pages beyond the single
// attempt. Each response embeds its own access verdict — the same two
// facts GetReportAccess answers — so a closed policy or an inactive
// membership renders a locked face, never an error, and the numbers
// behind a closed gate never travel.
service ReportService {
  option (cyber.ext.v1.service_comment) = "报告";
  rpc GetReport(GetReportRequest) returns (GetReportResponse) {
    option (cyber.ext.v1.method) = {
      comment: "获取单次能力报告"
      action: ACTION_READ
    };
    option (cyber.ext.v1.access) = ACCESS_BUILTIN;
    option (google.api.http) = {
      post: "/api/v1/esports/reports/get"
      body: "*"
    };
  }
  rpc GetSessionReport(GetSessionReportRequest) returns (GetSessionReportResponse) {
    option (cyber.ext.v1.method) = {
      comment: "获取场次成绩汇总"
      action: ACTION_READ
    };
    option (cyber.ext.v1.access) = ACCESS_BUILTIN;
    option (google.api.http) = {
      post: "/api/v1/esports/reports/session"
      body: "*"
    };
  }
  rpc GetAbilityDigest(GetAbilityDigestRequest) returns (GetAbilityDigestResponse) {
    option (cyber.ext.v1.method) = {
      comment: "获取能力成绩总览"
      action: ACTION_READ
    };
    option (cyber.ext.v1.access) = ACCESS_BUILTIN;
    option (google.api.http) = {
      post: "/api/v1/esports/reports/digest"
      body: "*"
    };
  }
  rpc GetCognitiveReport(GetCognitiveReportRequest) returns (GetCognitiveReportResponse) {
    option (cyber.ext.v1.method) = {
      comment: "获取认知报告(8 维聚合)"
      action: ACTION_READ
    };
    option (cyber.ext.v1.access) = ACCESS_BUILTIN;
    option (google.api.http) = {
      post: "/api/v1/esports/reports/cognitive"
      body: "*"
    };
  }
  rpc GetTrendReport(GetTrendReportRequest) returns (GetTrendReportResponse) {
    option (cyber.ext.v1.method) = {
      comment: "获取成长趋势(基础层)"
      action: ACTION_READ
    };
    option (cyber.ext.v1.access) = ACCESS_BUILTIN;
    option (google.api.http) = {
      post: "/api/v1/esports/reports/trend"
      body: "*"
    };
  }
  rpc GetCareerReport(GetCareerReportRequest) returns (GetCareerReportResponse) {
    option (cyber.ext.v1.method) = {
      comment: "获取职业聚合报告"
      action: ACTION_READ
    };
    option (cyber.ext.v1.access) = ACCESS_BUILTIN;
    option (google.api.http) = {
      post: "/api/v1/esports/reports/career"
      body: "*"
    };
  }
}

message GetReportRequest {
  string record_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 20
  }];
}

message GetReportResponse {
  string record_id = 1;
  // The unlock state at read time — the ledger's answer, never this face's.
  bool unlocked = 2;
  // The tier badge renders in the free tier, S/A/B/C by the composite
  // percentile (top 5/15/40 percent); once the record is unlocked the
  // snapshot pins the badge so later rubric changes never move it.
  ReportTier tier = 3;
  // The composite percentile: the equal-weight mean of the measured
  // abilities' percentiles — a missing ability never counts as zero.
  // Null when no measured ability carries a percentile at all.
  optional double composite_percentile = 4;
  // The measured primary abilities, one radar axis each; a missing
  // ability is an absent entry, never a zero axis.
  repeated ReportAbility abilities = 5;
  // The genre's secondary contributions (fps: decisionEfficiency; moba:
  // aimingAccuracy and trackingStability) — radar satellites, same shape.
  repeated ReportAbility sub_abilities = 6;
  // Unlocked-only: how each ability moved against the same ability on
  // this member's previous attempt — the previous session's record, not
  // the previous retry inside this one.
  optional ReportComparison comparison = 7;
  // Unlocked-only: the improvement board, weakest abilities first. The
  // target is the tier ladder's excellence line (the A threshold),
  // expressed in the same percentile currency as everything else.
  repeated ReportImprovement improvements = 8;
  // The completeness headline: how many of the record's genre-order
  // abilities were measured, over how many the genre orders.
  int32 tested_dimensions = 9;
  int32 total_dimensions = 10;
}

message GetSessionReportRequest {
  string session_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
}

message GetSessionReportResponse {
  string session_id = 1;
  string genre = 2;
  // The session's latest scored record — the composite verdict's owner;
  // absent while nothing scored (the same derivation the match face
  // carries, never this face's to claim).
  google.protobuf.StringValue anchor_record_id = 3;
  // The anchor's verdict: the frozen snapshot when one exists, the live
  // judgement otherwise — the free tier's own law, same as the record
  // board. UNSPECIFIED while no anchor exists.
  ReportTier tier = 4;
  google.protobuf.DoubleValue composite_percentile = 5;
  // One line per ability the session measured, in the lineup's order —
  // an unmeasured step never lands a line, never a zero line.
  repeated SessionAbilityLine abilities = 6;
  // The completeness headline over the genre's ordered abilities.
  int32 tested_dimensions = 7;
  int32 total_dimensions = 8;
  google.protobuf.Timestamp started_at = 9;
  // Every valid attempt the session's lineup admitted, in submit order —
  // the read-back detail rows, the detail-row group's single source. A
  // curve-pending attempt rides the same list with a null authoritative
  // score: the score the member earned is visible the moment it exists,
  // never held hostage to the game's calibration curve (curves freeze
  // one game at a time). The per-line attempt_scores stay the calibrated
  // receipt; this list is the full truth, pending rows included.
  repeated SessionAttemptDetail attempt_details = 10;
}

// One attempt's read-back row — the raw track always present, the
// authoritative answer only once the game's curve has spoken. A pending
// row (raw set, authoritative null) renders under the same raw-score
// label law the settlement face holds.
message SessionAttemptDetail {
  // The six-word vocabulary; the face filters its own ability's rows.
  string ability = 1;
  string game_code = 2;
  // The attempt's ordinal within the game — the retest counter.
  int32 attempt_no = 3;
  // The uncapped linear track — the only number a curve-pending attempt
  // has.
  double raw_score = 4;
  // Null while the game's calibration curve is pending; the row still
  // travels.
  google.protobuf.DoubleValue authoritative_score = 5;
  // The authoritative answer's band; null with the score.
  google.protobuf.StringValue grade = 6;
  google.protobuf.Timestamp at = 7;
}

// One ability's session verdict — the three numbers the settlement face
// keeps distinct: this session's best, the previous session's word, and
// the cross-session best.
message SessionAbilityLine {
  string ability = 1;
  // The game whose best attempt fed the line.
  string game_code = 2;
  // This session's best valid attempt — the settlement headline (a line
  // exists only when a valid attempt landed, so this is never empty).
  double best_score = 3;
  // Every valid attempt's authoritative score in ordinal order — the
  // "N attempts, best taken" receipt.
  repeated double attempt_scores = 4;
  // The best attempt's grade; null when that attempt carried no cohort
  // answer.
  google.protobuf.StringValue best_grade = 5;
  // The ability's percentile from the anchor's frozen snapshot; null
  // while the cohort says nothing.
  google.protobuf.DoubleValue percentile = 6;
  // The same ability's score on the member's previous session — null on
  // the first session (the note renders "first", never zero).
  google.protobuf.DoubleValue prev_session_score = 7;
  // The cross-session best including this session's attempts — the mark
  // the comparison track and the "new personal best" note read.
  google.protobuf.DoubleValue history_best_score = 8;
}

message GetAbilityDigestRequest {}

message GetAbilityDigestResponse {
  // Sessions carrying at least one valid attempt — practice runs never
  // count as sessions.
  int32 sessions_total = 1;
  int32 sessions_fps = 2;
  int32 sessions_moba = 3;
  // One line per measured ability of the six-word vocabulary; an untested
  // ability is an absent entry, never a zero row (the covered-count face
  // reads the absence).
  repeated DigestAbilityLine abilities = 4;
  // The latest session line per genre — at most one row each, absent
  // when the genre was never played.
  repeated DigestSessionLine sessions = 5;
}

message DigestAbilityLine {
  string ability = 1;
  // The cross-session best score — the ability board's bar.
  double best_score = 2;
  // The best attempt's grade; null when that attempt carried no cohort
  // answer.
  google.protobuf.StringValue best_grade = 3;
  // The best's percentile; null while the cohort says nothing.
  google.protobuf.DoubleValue best_percentile = 4;
  // How many distinct sessions carried a valid attempt for the ability.
  int32 sessions_tested = 5;
  google.protobuf.Timestamp last_at = 6;
}

message DigestSessionLine {
  string session_id = 1;
  string genre = 2;
  // All steps done — the history card's finished state; false keeps the
  // resume entry alive.
  bool finished = 3;
  int32 done_count = 4;
  int32 step_count = 5;
  google.protobuf.Timestamp created_at = 6;
  // The session's anchor — the report entry; absent while nothing
  // scored. The line carries no verdict of its own: the composite face
  // reads GetSessionReport with this id.
  google.protobuf.StringValue anchor_record_id = 7;
}

// One radar axis: the ability's own numbers plus the cohort answer. The
// percentile is the same-age same-sex cohort's; a cohort too thin to say
// anything yields a null percentile and a LOW confidence — the axis then
// renders score-only, never a made-up percentile.
message ReportAbility {
  // The six-word ability vocabulary.
  string ability = 1;
  // The game whose score fed this ability (the axis's provenance).
  string game_code = 2;
  double score = 3;
  optional double percentile = 4;
  PeerConfidence confidence = 5;
  int32 sample_count = 6;
  optional double peer_average = 7;
}

// The tier ladder, judged by percentile: S ≥95, A ≥85, B ≥60, else C.
enum ReportTier {
  REPORT_TIER_UNSPECIFIED = 0;
  REPORT_TIER_S = 1;
  REPORT_TIER_A = 2;
  REPORT_TIER_B = 3;
  REPORT_TIER_C = 4;
}

// Cohort trust: LOW sits below the confidence floor (percentile null),
// MEDIUM spans the thin middle, HIGH is the settled band.
enum PeerConfidence {
  PEER_CONFIDENCE_UNSPECIFIED = 0;
  PEER_CONFIDENCE_LOW = 1;
  PEER_CONFIDENCE_MEDIUM = 2;
  PEER_CONFIDENCE_HIGH = 3;
}

message ReportComparison {
  message Delta {
    string ability = 1;
    // The previous attempt's percentile; null when that attempt carried
    // none — the delta renders as "first measurement", not as zero.
    optional double previous_percentile = 2;
    optional double delta_percentile = 3;
  }
  repeated Delta deltas = 1;
}

message ReportImprovement {
  string ability = 1;
  double current_percentile = 2;
  double target_percentile = 3;
  // How far short of the target, in percent of it.
  double gap_percent = 4;
}

// The same two-fact answer GetReportAccess returns, embedded in each
// cluster face so a page carries its own gate: the judgement order
// (code redemption outranks policy outranks the standing default) lives
// in the entitlement module and is never re-derived here. A false
// allowed means the face renders locked; the numbers behind a closed
// gate never travel.
message ReportAccessVerdict {
  bool allowed = 1;
  ReportAccessReason reason = 2;
}

message GetCognitiveReportRequest {}

message GetCognitiveReportResponse {
  // Cognitive is closed to the ToC member by default; the verdict's
  // reason names which fact answered — policy, membership, or a
  // redeemed code.
  ReportAccessVerdict access = 1;
  // How many of the six-word ability vocabulary the member has measured
  // — the report header's covered count. Not gate-sensitive: the digest
  // face answers the same number to anyone.
  int32 covered_abilities = 2;
  // How many dimension rows carry a value, over the eight the model
  // defines — the completeness headline, same shape the record board
  // carries.
  int32 tested_dimensions = 3;
  int32 total_dimensions = 4;
  // Only dimensions whose every source ability has both a history-best
  // score and a cohort answer; a partially-fed dimension is an absent
  // row, never a zero axis — the same missing-never-zero law the record
  // board holds. Values are the weighted sum of the source abilities'
  // history-best percentiles, rounded to integers, weights server-side
  // and single-sourced.
  repeated CognitiveDimension dimensions = 5;
  // Equal-weight mean over the rendered dimensions only — a missing
  // dimension never counts as zero. Null when no dimension rendered.
  google.protobuf.DoubleValue composite = 6;
  // The composite's tier under the same ladder the record board judges
  // by; UNSPECIFIED while the composite is null.
  ReportTier tier = 7;
}

// One rendered dimension of the cognitive model. The dimension keys are
// the legal eight-word vocabulary; the wording a client renders them
// with stays with the client.
message CognitiveDimension {
  string dimension = 1;
  // The weighted percentile sum, rounded to an integer (0-100 scale).
  double value = 2;
  ReportTier tier = 3;
}

message GetTrendReportRequest {}

message GetTrendReportResponse {
  // Sessions carrying at least one scored record — the same count the
  // digest face answers; zero renders the honest empty page.
  int32 sessions_total = 1;
  // One series per ability that carries at least one cohort-answered
  // point; an ability with no answer is an absent series, never a flat
  // zero line.
  repeated TrendAbilitySeries abilities = 2;
  // The advanced tier's gate (cross-report comparison, prescriptions,
  // percentile drift) rides the membership verdict — the base tier is
  // free for anyone who has tested. The advanced content itself is a
  // later face; the verdict travels now so the page renders its locked
  // state from one call.
  ReportAccessVerdict advanced_access = 3;
}

message TrendAbilitySeries {
  string ability = 1;
  // Ascending by time; first and last deltas are the client's own
  // derivation off these points.
  repeated TrendPoint points = 2;
}

// One session-anchor's cohort answer for one ability. The genre rides
// the point because the two genres order different ability sets — a
// mixed history must label itself, or a reader would take a curve's
// rise and fall for skill change when it is vocabulary change.
message TrendPoint {
  google.protobuf.Timestamp at = 1;
  double percentile = 2;
  string genre = 3;
}

message GetCareerReportRequest {}

message GetCareerReportResponse {
  // Career is open by the standing default; the verdict carries the
  // policy word if the operator closed or member-gated it.
  ReportAccessVerdict access = 1;
  // Career areas ordered by match, descending. The area vocabulary and
  // its library facts (elimination rate, training intensity, advice)
  // are seeded server-side and travel with the rows — library copy is
  // data, not page wording.
  repeated CareerRecommendation recommendations = 2;
  // The gap board and the prescription cards render from one array:
  // weakest dimensions first, the target line and suggestions carried
  // per row so the client never hardcodes a rubric constant.
  repeated CareerImprovement improvements = 3;
}

message CareerRecommendation {
  // The seeded area code — the single source of the area's identity.
  string career_area = 1;
  string name = 2;
  // The area's match against the member's rendered dimensions, 0-100.
  double matched_score = 3;
  // The dimensions the match weighed, legal keys.
  repeated string basis_dimensions = 4;
  // Library facts, seeded with the area — percent of entrants washed
  // out and the training-load tier's own wording.
  double elimination_rate = 5;
  string training_intensity = 6;
  string suggestion = 7;
}

message CareerImprovement {
  // The legal dimension key; a row exists only for a rendered
  // dimension — a missing dimension has no gap to state.
  string dimension = 1;
  double current = 2;
  // The excellence line the rubric defines — server-owned, seed-fed.
  double target = 3;
  // How far short of the target, in percent of it.
  int32 gap_percent = 4;
  // Seeded prescription copy, the library's own words.
  repeated string suggestions = 5;
}
