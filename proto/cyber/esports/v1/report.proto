syntax = "proto3";

package cyber.esports.v1;

import "buf/validate/validate.proto";
import "ext/v1/access.proto";
import "ext/v1/desc.proto";
import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";

option go_package = "cyber-ecosystem/gen/go/cyber/esports/v1";

// The member's report read face. The single-attempt ability report is one
// record's board under the unlock state the entitlement ledger holds for
// it — a trial-scope grant on this record (the pay domain's settle, the
// pricing ruling's unlock unit), an active membership window, or a
// redeemed family code; the same three facts the family access judgement
// reads, never re-derived here. The free tier renders the tier badge, the
// ability radar and the composite percentile; the unlocked tier adds the
// per-ability peer detail, the last-attempt comparison and the improvement
// board. Numbers travel, copy does not: the five-zone wording stays with
// the client until its configuration face lands.
//
// Beside the record board sit the two read-back faces: the session
// scoreboard (GetSessionReport) and the cross-session aggregate
// (GetAbilityDigest) — what a member sees of scores they already earned.
// Neither runs cohort math: the frozen snapshot is their only percentile
// source, same as the record board itself.
service ReportService {
  option (cyber.ext.v1.service_comment) = "报告";
  rpc GetReport(GetReportRequest) returns (GetReportResponse) {
    option (cyber.ext.v1.method) = {
      comment: "获取单次能力报告"
      action: ACTION_READ
    };
    option (cyber.ext.v1.access) = ACCESS_BUILTIN;
    option (google.api.http) = {
      post: "/api/v1/esports/reports/get"
      body: "*"
    };
  }
  rpc GetSessionReport(GetSessionReportRequest) returns (GetSessionReportResponse) {
    option (cyber.ext.v1.method) = {
      comment: "获取场次成绩汇总"
      action: ACTION_READ
    };
    option (cyber.ext.v1.access) = ACCESS_BUILTIN;
    option (google.api.http) = {
      post: "/api/v1/esports/reports/session"
      body: "*"
    };
  }
  rpc GetAbilityDigest(GetAbilityDigestRequest) returns (GetAbilityDigestResponse) {
    option (cyber.ext.v1.method) = {
      comment: "获取能力成绩总览"
      action: ACTION_READ
    };
    option (cyber.ext.v1.access) = ACCESS_BUILTIN;
    option (google.api.http) = {
      post: "/api/v1/esports/reports/digest"
      body: "*"
    };
  }
}

message GetReportRequest {
  string record_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 20
  }];
}

message GetReportResponse {
  string record_id = 1;
  // The unlock state at read time — the ledger's answer, never this face's.
  bool unlocked = 2;
  // The tier badge renders in the free tier, S/A/B/C by the composite
  // percentile (top 5/15/40 percent); once the record is unlocked the
  // snapshot pins the badge so later rubric changes never move it.
  ReportTier tier = 3;
  // The composite percentile: the equal-weight mean of the measured
  // abilities' percentiles — a missing ability never counts as zero.
  // Null when no measured ability carries a percentile at all.
  optional double composite_percentile = 4;
  // The measured primary abilities, one radar axis each; a missing
  // ability is an absent entry, never a zero axis.
  repeated ReportAbility abilities = 5;
  // The genre's secondary contributions (fps: decisionEfficiency; moba:
  // aimingAccuracy and trackingStability) — radar satellites, same shape.
  repeated ReportAbility sub_abilities = 6;
  // Unlocked-only: how each ability moved against the same ability on
  // this member's previous attempt — the previous session's record, not
  // the previous retry inside this one.
  optional ReportComparison comparison = 7;
  // Unlocked-only: the improvement board, weakest abilities first. The
  // target is the tier ladder's excellence line (the A threshold),
  // expressed in the same percentile currency as everything else.
  repeated ReportImprovement improvements = 8;
  // The completeness headline: how many of the record's genre-order
  // abilities were measured, over how many the genre orders.
  int32 tested_dimensions = 9;
  int32 total_dimensions = 10;
}

message GetSessionReportRequest {
  string session_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
}

message GetSessionReportResponse {
  string session_id = 1;
  string genre = 2;
  // The session's latest scored record — the composite verdict's owner;
  // absent while nothing scored (the same derivation the match face
  // carries, never this face's to claim).
  google.protobuf.StringValue anchor_record_id = 3;
  // The anchor's verdict: the frozen snapshot when one exists, the live
  // judgement otherwise — the free tier's own law, same as the record
  // board. UNSPECIFIED while no anchor exists.
  ReportTier tier = 4;
  google.protobuf.DoubleValue composite_percentile = 5;
  // One line per ability the session measured, in the lineup's order —
  // an unmeasured step never lands a line, never a zero line.
  repeated SessionAbilityLine abilities = 6;
  // The completeness headline over the genre's ordered abilities.
  int32 tested_dimensions = 7;
  int32 total_dimensions = 8;
  google.protobuf.Timestamp started_at = 9;
}

// One ability's session verdict — the three numbers the settlement face
// keeps distinct: this session's best, the previous session's word, and
// the cross-session best.
message SessionAbilityLine {
  string ability = 1;
  // The game whose best attempt fed the line.
  string game_code = 2;
  // This session's best valid attempt — the settlement headline (a line
  // exists only when a valid attempt landed, so this is never empty).
  double best_score = 3;
  // Every valid attempt's authoritative score in ordinal order — the
  // "N attempts, best taken" receipt.
  repeated double attempt_scores = 4;
  // The best attempt's grade; null when that attempt carried no cohort
  // answer.
  google.protobuf.StringValue best_grade = 5;
  // The ability's percentile from the anchor's frozen snapshot; null
  // while the cohort says nothing.
  google.protobuf.DoubleValue percentile = 6;
  // The same ability's score on the member's previous session — null on
  // the first session (the note renders "first", never zero).
  google.protobuf.DoubleValue prev_session_score = 7;
  // The cross-session best including this session's attempts — the mark
  // the comparison track and the "new personal best" note read.
  google.protobuf.DoubleValue history_best_score = 8;
}

message GetAbilityDigestRequest {}

message GetAbilityDigestResponse {
  // Sessions carrying at least one valid attempt — practice runs never
  // count as sessions.
  int32 sessions_total = 1;
  int32 sessions_fps = 2;
  int32 sessions_moba = 3;
  // One line per measured ability of the six-word vocabulary; an untested
  // ability is an absent entry, never a zero row (the covered-count face
  // reads the absence).
  repeated DigestAbilityLine abilities = 4;
  // The latest session line per genre — at most one row each, absent
  // when the genre was never played.
  repeated DigestSessionLine sessions = 5;
}

message DigestAbilityLine {
  string ability = 1;
  // The cross-session best score — the ability board's bar.
  double best_score = 2;
  // The best attempt's grade; null when that attempt carried no cohort
  // answer.
  google.protobuf.StringValue best_grade = 3;
  // The best's percentile; null while the cohort says nothing.
  google.protobuf.DoubleValue best_percentile = 4;
  // How many distinct sessions carried a valid attempt for the ability.
  int32 sessions_tested = 5;
  google.protobuf.Timestamp last_at = 6;
}

message DigestSessionLine {
  string session_id = 1;
  string genre = 2;
  // All steps done — the history card's finished state; false keeps the
  // resume entry alive.
  bool finished = 3;
  int32 done_count = 4;
  int32 step_count = 5;
  google.protobuf.Timestamp created_at = 6;
  // The session's anchor — the report entry; absent while nothing
  // scored. The line carries no verdict of its own: the composite face
  // reads GetSessionReport with this id.
  google.protobuf.StringValue anchor_record_id = 7;
}

// One radar axis: the ability's own numbers plus the cohort answer. The
// percentile is the same-age same-sex cohort's; a cohort too thin to say
// anything yields a null percentile and a LOW confidence — the axis then
// renders score-only, never a made-up percentile.
message ReportAbility {
  // The six-word ability vocabulary.
  string ability = 1;
  // The game whose score fed this ability (the axis's provenance).
  string game_code = 2;
  double score = 3;
  optional double percentile = 4;
  PeerConfidence confidence = 5;
  int32 sample_count = 6;
  optional double peer_average = 7;
}

// The tier ladder, judged by percentile: S ≥95, A ≥85, B ≥60, else C.
enum ReportTier {
  REPORT_TIER_UNSPECIFIED = 0;
  REPORT_TIER_S = 1;
  REPORT_TIER_A = 2;
  REPORT_TIER_B = 3;
  REPORT_TIER_C = 4;
}

// Cohort trust: LOW sits below the confidence floor (percentile null),
// MEDIUM spans the thin middle, HIGH is the settled band.
enum PeerConfidence {
  PEER_CONFIDENCE_UNSPECIFIED = 0;
  PEER_CONFIDENCE_LOW = 1;
  PEER_CONFIDENCE_MEDIUM = 2;
  PEER_CONFIDENCE_HIGH = 3;
}

message ReportComparison {
  message Delta {
    string ability = 1;
    // The previous attempt's percentile; null when that attempt carried
    // none — the delta renders as "first measurement", not as zero.
    optional double previous_percentile = 2;
    optional double delta_percentile = 3;
  }
  repeated Delta deltas = 1;
}

message ReportImprovement {
  string ability = 1;
  double current_percentile = 2;
  double target_percentile = 3;
  // How far short of the target, in percent of it.
  double gap_percent = 4;
}
