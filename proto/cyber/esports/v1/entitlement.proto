syntax = "proto3";

package cyber.esports.v1;

import "buf/validate/validate.proto";
import "ext/v1/access.proto";
import "ext/v1/desc.proto";
import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

option go_package = "cyber-ecosystem/gen/go/cyber/esports/v1";

// The member's entitlement faces. Redeem is idempotent per (member,
// family): the family's grant already standing, a later code of the same
// family answers that grant without taking the code's use, while a rival
// member's redeem takes the code's single use.
// Access folds every openable fact — policy config, an active membership,
// a redeemed code — into one answer with one reason, so the client never
// re-derives entitlement rules.
service EntitlementService {
  option (cyber.ext.v1.service_comment) = "权益";
  rpc RedeemActivationCode(RedeemActivationCodeRequest) returns (RedeemActivationCodeResponse) {
    option (cyber.ext.v1.method) = {
      comment: "兑换激活码"
      action: ACTION_WRITE
    };
    option (cyber.ext.v1.access) = ACCESS_BUILTIN;
    option (google.api.http) = {
      post: "/api/v1/esports/entitlements/redeem"
      body: "*"
    };
  }
  rpc GetReportAccess(GetReportAccessRequest) returns (GetReportAccessResponse) {
    option (cyber.ext.v1.method) = {
      comment: "报告访问判定"
      action: ACTION_READ
    };
    option (cyber.ext.v1.access) = ACCESS_BUILTIN;
    option (google.api.http) = {get: "/api/v1/esports/report-access/{report_type}"};
  }
}

// The report families a type code opens. The two report domains of the
// assessment chain carry over from the legacy corpus, school is the ToB
// aggregate — the same three families the legacy codes knew.
enum ReportType {
  REPORT_TYPE_UNSPECIFIED = 0;
  REPORT_TYPE_COGNITIVE = 1;
  REPORT_TYPE_CAREER = 2;
  REPORT_TYPE_SCHOOL = 3;
}

// Why a report family is open or closed to the asking member. The policy
// values come from the operator's config; membership and redemption are
// the member's own facts — the reason names which fact answered.
enum ReportAccessReason {
  REPORT_ACCESS_REASON_UNSPECIFIED = 0;
  REPORT_ACCESS_REASON_POLICY_OPEN = 1;
  REPORT_ACCESS_REASON_MEMBERSHIP_ACTIVE = 2;
  REPORT_ACCESS_REASON_CODE_REDEEMED = 3;
  REPORT_ACCESS_REASON_POLICY_CLOSED = 4;
  REPORT_ACCESS_REASON_NO_ENTITLEMENT = 5;
}

message RedeemActivationCodeRequest {
  optional string code = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      min_len: 2
      max_len: 64
    }
  ];
}

message RedeemActivationCodeResponse {
  ReportType report_type = 1;
  // Null when the grant is permanent — a code's grant lasts as long as
  // the code said, and an absent expiry never ends.
  google.protobuf.Timestamp expires_at = 2;
  google.protobuf.Timestamp granted_at = 3;
}

message GetReportAccessRequest {
  ReportType report_type = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];
}

message GetReportAccessResponse {
  // Plain bool by design: two states are the whole vocabulary — there is
  // no third "absent" reading a wrapper would preserve.
  bool allowed = 1;
  ReportAccessReason reason = 2;
}
