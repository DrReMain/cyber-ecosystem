syntax = "proto3";

package cyber.esports.v1;

import "buf/validate/validate.proto";
import "cyber/esports/v1/entitlement.proto";
import "cyber/shared/common/v1/pagination.proto";
import "ext/v1/access.proto";
import "ext/v1/desc.proto";
import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";

option go_package = "cyber-ecosystem/gen/go/cyber/esports/v1";

// The operator face of the entitlement domain: minting and listing type
// codes, and the access policy they judge by. A code is a type code — the
// pricing ruling retired single-record codes, so redeeming opens one
// report family, never one trial's report. Generation mints each code for
// a single redeem; an operator who needs N hands-out mints N. Codes live
// in clear text because operators re-copy them for support. This whole
// service is a strippable module: deployments without the operator plane
// drop it and the business faces never notice.
service EntitleAdminService {
  option (cyber.ext.v1.service_comment) = "权益运营";
  rpc GenerateActivationCodes(GenerateActivationCodesRequest) returns (GenerateActivationCodesResponse) {
    option (cyber.ext.v1.method) = {
      comment: "批量生成激活码"
      action: ACTION_WRITE
    };
    option (cyber.ext.v1.access) = ACCESS_ADMIN;
    option (google.api.http) = {
      post: "/api/v1/esports/activation-codes/generate"
      body: "*"
    };
  }
  rpc ListActivationCodes(ListActivationCodesRequest) returns (ListActivationCodesResponse) {
    option (cyber.ext.v1.method) = {
      comment: "激活码列表"
      action: ACTION_READ
    };
    option (cyber.ext.v1.access) = ACCESS_ADMIN;
    option (google.api.http) = {get: "/api/v1/esports/activation-codes"};
  }
  rpc SetReportAccessPolicy(SetReportAccessPolicyRequest) returns (SetReportAccessPolicyResponse) {
    option (cyber.ext.v1.method) = {
      comment: "设置报告访问策略"
      action: ACTION_WRITE
    };
    option (cyber.ext.v1.access) = ACCESS_ADMIN;
    option (google.api.http) = {
      post: "/api/v1/esports/report-access-policy"
      body: "*"
    };
  }
}

// The operator's access policy for one report family. A redeemed code
// outranks the policy — a type code is an explicit grant someone handed
// out, never something a config switch revokes; the policy shapes who
// else gets in.
enum ReportAccessPolicy {
  REPORT_ACCESS_POLICY_UNSPECIFIED = 0;
  REPORT_ACCESS_POLICY_OPEN = 1;
  REPORT_ACCESS_POLICY_MEMBERSHIP = 2;
  REPORT_ACCESS_POLICY_TENANT = 3;
  REPORT_ACCESS_POLICY_CLOSED = 4;
}

message ActivationCode {
  google.protobuf.StringValue code = 1;
  ReportType report_type = 2;
  google.protobuf.Int32Value quantity = 3;
  google.protobuf.Int32Value used_count = 4;
  google.protobuf.Timestamp expires_at = 5;
  google.protobuf.Timestamp created_at = 6;
}

message GenerateActivationCodesRequest {
  optional ReportType report_type = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];
  optional int32 count = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).int32 = {
      gte: 1
      lte: 1000
    }
  ];
  optional int32 expire_days = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).int32 = {
      gte: 1
      lte: 3650
    }
  ];
}

message GenerateActivationCodesResponse {
  // The codes in full, this once and on every later list — generation
  // answers what was minted so the operator hands them out.
  repeated string codes = 1;
}

message ListActivationCodesRequest {
  cyber.shared.common.v1.PageRequest page = 1;
  optional ReportType report_type = 2;
}

message ListActivationCodesResponse {
  cyber.shared.common.v1.PageResponse page = 1;
  repeated ActivationCode codes = 2;
}

message SetReportAccessPolicyRequest {
  optional ReportType report_type = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];
  optional ReportAccessPolicy policy = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];
}

message SetReportAccessPolicyResponse {
  ReportType report_type = 1;
  ReportAccessPolicy policy = 2;
}
