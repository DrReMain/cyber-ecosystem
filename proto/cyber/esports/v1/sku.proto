syntax = "proto3";

package cyber.esports.v1;

import "ext/v1/access.proto";
import "ext/v1/desc.proto";
import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";

option go_package = "cyber-ecosystem/gen/go/cyber/esports/v1";

// Purchasable catalog read face for the member plane. Values are product
// territory (P1: a single purchase permanently unlocks one trial's
// report; membership is a 31-day window); the structure carries both the
// selling price and the list price so a future discount display is a
// value change, not a contract change — no discount is displayed either
// way in M1. The list also answers the pay gate's facts, folded into the
// read the wall already makes — the member plane has no compliance read
// of its own, and the gate is sale-shaped, so the selling face carries it.
service SkuService {
  option (cyber.ext.v1.service_comment) = "SKU";
  rpc ListSkus(ListSkusRequest) returns (ListSkusResponse) {
    option (cyber.ext.v1.method) = {
      comment: "在售SKU列表"
      action: ACTION_READ
    };
    option (cyber.ext.v1.access) = ACCESS_BUILTIN;
    option (google.api.http) = {get: "/api/v1/esports/skus"};
  }
}

// What a sku sells: a trial unlocks one test record's report
// permanently; a membership opens a time window during which reports
// auto-unlock and stay unlocked forever.
enum SkuKind {
  SKU_KIND_UNSPECIFIED = 0;
  SKU_KIND_TRIAL = 1;
  SKU_KIND_MEMBERSHIP = 2;
}

message Sku {
  // Catalog code join key (e.g. member_month) — the row ULID never
  // crosses the wire, the same law as game codes.
  google.protobuf.StringValue sku_code = 1;
  google.protobuf.StringValue name = 2;
  google.protobuf.StringValue description = 3;
  SkuKind kind = 4;
  // Fen amounts (1/100 yuan); money never rides yuan or floats anywhere.
  google.protobuf.Int64Value price_fen = 5;
  // List price — equal to price_fen in M1; carried so discounting is
  // product data, not a schema change.
  google.protobuf.Int64Value list_price_fen = 6;
  // Membership window in days; null on trial skus.
  google.protobuf.Int32Value period_days = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}

message ListSkusRequest {}

// The compliance facts the pay wall gates on, folded into the catalog
// read (the same fold GetProfileResponse.member_until rides on: the wall
// reads the gate with a call it already makes, zero extra hop).
message PayGate {
  // Plain scalars by the success-implies-present carve-out: an absent
  // config row still answers the shipped defaults (18 and 7), so the
  // gate always speaks.
  int32 pay_age_line = 1;
  // Days before membership expiry the renewal reminder shows — the same
  // name the compliance knob answers, one vocabulary end to end.
  int32 renewal_remind_days = 2;
  // Operator overrides shown as-is in every locale (the sku-name
  // precedent for operator text); null = the face renders its own
  // localized default.
  google.protobuf.StringValue minor_prompt = 3;
  google.protobuf.StringValue missing_birth_prompt = 4;
}

message ListSkusResponse {
  repeated Sku skus = 1;
  PayGate pay_gate = 2;
}
