syntax = "proto3";

package cyber.esports.v1;

import "errors/errors.proto";

option go_package = "cyber-ecosystem/gen/go/cyber/esports/v1";

// business errors (service-level): domain-specific failures the service
// layer returns actively, distinct from the generic codes in
// cyber/shared/errors. Service blocks inside 6xxx are disjoint — system
// holds 60xx, esports holds 61xx; a third service takes the next free
// block, at which point this note graduates to the proto conventions.
enum Esports {
  option (.errors.default_code) = 400;

  ESPORTS_UNSPECIFIED = 0 [(.errors.code) = 500];

  // 610x: profile
  ESPORTS_PROFILE_GUARDIAN_CONSENT_REQUIRED = 6100 [(.errors.code) = 400];
  ESPORTS_PROFILE_GAME_UNKNOWN = 6101 [(.errors.code) = 400];
  ESPORTS_PROFILE_CUSTOM_GAME_CAP = 6102 [(.errors.code) = 400];

  // 611x: test
  ESPORTS_TEST_NOT_FOUND = 6110 [(.errors.code) = 404];

  // 612x: member
  ESPORTS_MEMBER_NOT_FOUND = 6120 [(.errors.code) = 404];

  // 613x: match
  ESPORTS_MATCH_GENRE_UNDECIDED = 6130 [(.errors.code) = 400];
  ESPORTS_MATCH_GENRE_UNKNOWN = 6131 [(.errors.code) = 400];
  ESPORTS_MATCH_SESSION_NOT_FOUND = 6132 [(.errors.code) = 404];
  ESPORTS_MATCH_TEST_NOT_IN_SESSION = 6133 [(.errors.code) = 400];
  ESPORTS_MATCH_RETEST_EXHAUSTED = 6134 [(.errors.code) = 400];

  // 614x: order & sku
  ESPORTS_ORDER_NOT_FOUND = 6140 [(.errors.code) = 404];
  ESPORTS_SKU_NOT_FOUND = 6141 [(.errors.code) = 404];
  ESPORTS_SKU_OFF_SHELF = 6142 [(.errors.code) = 400];
  ESPORTS_ORDER_SCOPE_INVALID = 6143 [(.errors.code) = 400];
  ESPORTS_ORDER_SCOPE_ALREADY_GRANTED = 6144 [(.errors.code) = 400];
  ESPORTS_ORDER_CHANNEL_INVALID = 6145 [(.errors.code) = 400];
  ESPORTS_ORDER_STATE_CONFLICT = 6146 [(.errors.code) = 400];

  // 615x: activation code & entitlement
  ESPORTS_ACTIVATION_CODE_INVALID = 6150 [(.errors.code) = 400];
  ESPORTS_ACTIVATION_CODE_EXPIRED = 6151 [(.errors.code) = 400];
  ESPORTS_ACTIVATION_CODE_EXHAUSTED = 6152 [(.errors.code) = 400];
  ESPORTS_REPORT_POLICY_NOT_READY = 6153 [(.errors.code) = 400];

  // 616x: report
  ESPORTS_REPORT_RECORD_NOT_FOUND = 6160 [(.errors.code) = 404];
  ESPORTS_REPORT_RECORD_NOT_OWNED = 6161 [(.errors.code) = 403];
  ESPORTS_REPORT_RECORD_INVALID = 6162 [(.errors.code) = 400];
  ESPORTS_REPORT_SESSION_NOT_OWNED = 6163 [(.errors.code) = 403];
}
