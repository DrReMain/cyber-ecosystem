syntax = "proto3";

package cyber.esports.v1;

import "buf/validate/validate.proto";
import "ext/v1/access.proto";
import "ext/v1/desc.proto";
import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";

option go_package = "cyber-ecosystem/gen/go/cyber/esports/v1";

// The match session — the orchestration aggregate the C-end assessment
// flow rides. One active session per member: steps are drawn once (seeded
// jitter, so lineups cannot be memorized) and locked into the row, resume
// inside the seven-day window never redraws, and a fresh draw starts only
// on window expiry or an explicit genre switch (forced new seed). The
// difficulty mode axis lives on the session: every attempt inside scores
// on the session's mode, consumed at the submit seam.
service MatchService {
  option (cyber.ext.v1.service_comment) = "匹配会话";
  rpc GetMatchSession(GetMatchSessionRequest) returns (GetMatchSessionResponse) {
    option (cyber.ext.v1.method) = {
      comment: "获取匹配会话(无则按偏好多数票编排)"
      action: ACTION_READ
    };
    option (cyber.ext.v1.access) = ACCESS_BUILTIN;
    option (google.api.http) = {get: "/api/v1/esports/match/session"};
  }
  // The explicit re-draw: the target genre validates first, then the active
  // session closes (even a fresh one) and a new one opens with a forced-new
  // seed — the same test may be drawn again in the replacement.
  rpc SwitchMatchGenre(SwitchMatchGenreRequest) returns (SwitchMatchGenreResponse) {
    option (cyber.ext.v1.method) = {
      comment: "切换类型重排匹配会话"
      action: ACTION_WRITE
    };
    option (cyber.ext.v1.access) = ACCESS_BUILTIN;
    option (google.api.http) = {
      post: "/api/v1/esports/match/session/switch"
      body: "*"
    };
  }
  // The read-only sibling of GetMatchSession: reports the member's active
  // in-window session, if any — never creates, never lazily expires, never
  // votes a genre. (A minting surface here would hijack a later explicit
  // genre choice: a resume ignores the genre param.) Over-window sessions
  // read absent; the next GetMatchSession owns closing and redrawing them.
  rpc PeekMatchSession(PeekMatchSessionRequest) returns (PeekMatchSessionResponse) {
    option (cyber.ext.v1.method) = {
      comment: "窥视进行中的匹配会话(只读,无则空)"
      action: ACTION_READ
    };
    option (cyber.ext.v1.access) = ACCESS_BUILTIN;
    option (google.api.http) = {get: "/api/v1/esports/match/session/peek"};
  }
}

message GetMatchSessionRequest {
  // Seeds session creation only — an active in-window session resumes
  // regardless of this value (switching is the explicit SwitchMatchGenre
  // action; Get never closes a session implicitly). Absent → the server
  // votes the member's preferred-game majority through the catalog
  // categories; a tie or no classified picks returns
  // ESPORTS_MATCH_GENRE_UNDECIDED and the pick page owns the manual choice.
  optional string genre = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 16
  }];
}

message SwitchMatchGenreRequest {
  optional string genre = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 16
    }
  ];
}

message MatchStep {
  // The ability the step was drawn for (a match_config row) and the drawn
  // test's catalog code — names hydrate client-side from the test list.
  google.protobuf.StringValue ability = 1;
  google.protobuf.StringValue test_code = 2;
}

message MatchSession {
  google.protobuf.StringValue id = 1;
  // The session's type-axis value (fps|moba|...) — frozen at creation;
  // changing it is a new session, never a mutation.
  google.protobuf.StringValue genre = 2;
  // Mode-axis word vocabulary: experience | standard; every attempt in
  // the session scores on this mode.
  google.protobuf.StringValue difficulty = 3;
  // The locked arrangement, emitted in match_config render_order.
  repeated MatchStep steps = 4;
  // Step codes with at least one attempt record since session start —
  // derived from records, never client-asserted.
  repeated string done = 5;
  // Remaining attempts per step code (budget minus records); the "N/3" face.
  map<string, int32> retest_left = 6;
  google.protobuf.Timestamp created_at = 7;
  // True when this session is the member's first ever — the 3-vs-1 retest
  // budget face (the budget itself rides the session row).
  google.protobuf.BoolValue first_session = 8;
}

message GetMatchSessionResponse {
  MatchSession session = 1;
  // True when this call created the session (intro face); false when an
  // in-window session resumed (continue face). Success implies present.
  bool created = 2;
}

message SwitchMatchGenreResponse {
  MatchSession session = 1;
}

message PeekMatchSessionRequest {}

message PeekMatchSessionResponse {
  // Absent when no in-window session exists — message-field presence is
  // the null/zero contract for entities (§3); a present session is the
  // resume face's whole truth.
  MatchSession session = 1;
}
