syntax = "proto3";

package cyber.system.v1;

import "buf/validate/validate.proto";
import "cyber/shared/common/v1/pagination.proto";
import "ext/v1/access.proto";
import "ext/v1/desc.proto";
import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";

option go_package = "cyber-ecosystem/gen/go/cyber/system/v1";

service TenantService {
  option (cyber.ext.v1.service_comment) = "租户管理";
  rpc UpdateTenantStatus(UpdateTenantStatusRequest) returns (UpdateTenantStatusResponse) {
    option (cyber.ext.v1.method) = {
      comment: "启停租户"
      action: ACTION_WRITE
    };
    option (cyber.ext.v1.access) = ACCESS_PLATFORM;
    option (google.api.http) = {
      put: "/api/v1/system/tenants/{id}/status"
      body: "*"
    };
  }
  rpc ListTenants(ListTenantsRequest) returns (ListTenantsResponse) {
    option (cyber.ext.v1.method) = {
      comment: "租户列表"
      action: ACTION_READ
    };
    option (cyber.ext.v1.access) = ACCESS_PLATFORM;
    option (google.api.http) = {get: "/api/v1/system/tenants"};
  }
  rpc GetTenant(GetTenantRequest) returns (GetTenantResponse) {
    option (cyber.ext.v1.method) = {
      comment: "租户详情"
      action: ACTION_READ
    };
    option (cyber.ext.v1.access) = ACCESS_PLATFORM;
    option (google.api.http) = {get: "/api/v1/system/tenants/{id}"};
  }
}

message Tenant {
  google.protobuf.StringValue id = 1;
  google.protobuf.Timestamp created_at = 2;
  google.protobuf.Timestamp updated_at = 3;
  google.protobuf.StringValue code = 4;
  google.protobuf.StringValue name = 5;
  google.protobuf.BoolValue enabled = 6;
}

// list
message ListTenantsRequest {
  cyber.shared.common.v1.PageRequest page = 1;
  optional string code = 2;
  optional string name = 3;
  repeated string order_by = 100 [(buf.validate.field).cel = {
    id: "ListTenantsRequest.order_by"
    message: ""
    expression: "this.all(item, size(item) == 0 || item.matches('^(code|name|createdAt|updatedAt):(asc|desc)$'))"
  }];
}

message ListTenantsResponse {
  cyber.shared.common.v1.PageResponse page = 1;
  repeated Tenant list = 2;
}

// get
message GetTenantRequest {
  string id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.len = 20
  ];
}

message GetTenantResponse {
  Tenant tenant = 1;
}

// status
message UpdateTenantStatusRequest {
  string id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.len = 20
  ];
  optional bool enabled = 2 [(buf.validate.field).required = true];
}

message UpdateTenantStatusResponse {}
