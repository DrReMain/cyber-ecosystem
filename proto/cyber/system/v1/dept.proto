syntax = "proto3";

package cyber.system.v1;

import "buf/validate/validate.proto";
import "cyber/shared/common/v1/pagination.proto";
import "ext/v1/access.proto";
import "ext/v1/authz.proto";
import "ext/v1/desc.proto";
import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";

option go_package = "cyber-ecosystem/gen/go/cyber/system/v1";

service DeptService {
  option (cyber.ext.v1.service_comment) = "部门组织管理";
  rpc CreateDept(CreateDeptRequest) returns (CreateDeptResponse) {
    option (cyber.ext.v1.method) = {
      comment: "创建部门"
      action: ACTION_WRITE
    };
    option (cyber.ext.v1.access) = ACCESS_ADMIN;
    option (google.api.http) = {
      post: "/api/v1/system/depts"
      body: "*"
    };
  }
  rpc UpdateDept(UpdateDeptRequest) returns (UpdateDeptResponse) {
    option (cyber.ext.v1.method) = {
      comment: "修改部门"
      action: ACTION_WRITE
    };
    option (cyber.ext.v1.access) = ACCESS_ADMIN;
    option (cyber.ext.v1.datascope) = true;
    option (google.api.http) = {
      put: "/api/v1/system/depts/{id}"
      body: "*"
    };
  }
  rpc DeleteDept(DeleteDeptRequest) returns (DeleteDeptResponse) {
    option (cyber.ext.v1.method) = {
      comment: "删除部门"
      action: ACTION_WRITE
    };
    option (cyber.ext.v1.access) = ACCESS_ADMIN;
    option (cyber.ext.v1.datascope) = true;
    option (google.api.http) = {delete: "/api/v1/system/depts/{id}"};
  }
  rpc ListDepts(ListDeptsRequest) returns (ListDeptsResponse) {
    option (cyber.ext.v1.method) = {
      comment: "查询部门列表"
      action: ACTION_READ
    };
    option (cyber.ext.v1.access) = ACCESS_ADMIN;
    option (cyber.ext.v1.datascope) = true;
    option (google.api.http) = {get: "/api/v1/system/depts"};
  }
  rpc GetDept(GetDeptRequest) returns (GetDeptResponse) {
    option (cyber.ext.v1.method) = {
      comment: "查询部门详情"
      action: ACTION_READ
    };
    option (cyber.ext.v1.access) = ACCESS_ADMIN;
    option (cyber.ext.v1.datascope) = true;
    option (google.api.http) = {get: "/api/v1/system/depts/{id}"};
  }
  rpc RemoveDeptMember(RemoveDeptMemberRequest) returns (RemoveDeptMemberResponse) {
    option (cyber.ext.v1.method) = {
      comment: "移出部门成员"
      action: ACTION_WRITE
    };
    option (cyber.ext.v1.access) = ACCESS_ADMIN;
    option (cyber.ext.v1.datascope) = true;
    option (google.api.http) = {delete: "/api/v1/system/depts/{dept_id}/members/{user_id}"};
  }
  rpc ListDeptMembers(ListDeptMembersRequest) returns (ListDeptMembersResponse) {
    option (cyber.ext.v1.method) = {
      comment: "查询部门成员列表"
      action: ACTION_READ
    };
    option (cyber.ext.v1.access) = ACCESS_ADMIN;
    option (cyber.ext.v1.datascope) = true;
    option (google.api.http) = {get: "/api/v1/system/depts/{dept_id}/members"};
  }
}

message Dept {
  google.protobuf.StringValue id = 1;
  google.protobuf.Timestamp created_at = 2;
  google.protobuf.Timestamp updated_at = 3;
  google.protobuf.StringValue name = 4;
  google.protobuf.StringValue parent_id = 5;
  google.protobuf.StringValue remark = 6;
  google.protobuf.Int64Value user_count = 7; // computed on list (live, scope-visible)
}

// create
message CreateDeptRequest {
  optional string name = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 64
    }
  ];
  optional string parent_id = 2;
  optional string remark = 3 [(buf.validate.field).string.max_len = 255];
}

message CreateDeptResponse {
  google.protobuf.StringValue id = 1;
}

// update
message UpdateDeptRequest {
  string id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.len = 20
  ];
  optional string name = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  optional string parent_id = 3;
  optional string remark = 4 [(buf.validate.field).string.max_len = 255];
  repeated string fields_mask = 100 [(buf.validate.field).repeated = {
    min_items: 1
    unique: true
    items: {string: {pattern: "^(name|parent_id|remark)$"}}
  }];
}

message UpdateDeptResponse {}

// delete
message DeleteDeptRequest {
  string id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.len = 20
  ];
}

message DeleteDeptResponse {}

// list
message ListDeptsRequest {
  cyber.shared.common.v1.PageRequest page = 1;
  optional string name = 2;
  repeated string order_by = 100 [(buf.validate.field).cel = {
    id: "ListDeptsRequest.order_by"
    message: ""
    expression: "this.all(item, size(item) == 0 || item.matches('^(name|createdAt|updatedAt):(asc|desc)$'))"
  }];
}

message ListDeptsResponse {
  cyber.shared.common.v1.PageResponse page = 1;
  repeated Dept list = 2;
}

// get
message GetDeptRequest {
  string id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.len = 20
  ];
}

message GetDeptResponse {
  Dept dept = 1;
}

// removeDeptMember
message RemoveDeptMemberRequest {
  string dept_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.len = 20
  ];
  string user_id = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.len = 20
  ];
}

message RemoveDeptMemberResponse {}

// listDeptMembers
message ListDeptMembersRequest {
  string dept_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.len = 20
  ];
  cyber.shared.common.v1.PageRequest page = 2;
}

message ListDeptMembersResponse {
  cyber.shared.common.v1.PageResponse page = 1;
  repeated DeptMember list = 2;
}

// Membership is the user's dept_id attribute, not a join row — the member
// view carries the user's live account fields.
message DeptMember {
  google.protobuf.StringValue user_id = 1;
  google.protobuf.StringValue email = 2;
  google.protobuf.BoolValue enabled = 3;
}
