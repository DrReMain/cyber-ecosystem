syntax = "proto3";

package cyber.system.v1;

import "buf/validate/validate.proto";
import "cyber/system/v1/user.proto";
import "ext/v1/access.proto";
import "ext/v1/desc.proto";
import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

option go_package = "cyber-ecosystem/gen/go/cyber/system/v1";

service AuthService {
  option (cyber.ext.v1.service_comment) = "认证与会话";
  rpc Login(LoginRequest) returns (LoginResponse) {
    option (cyber.ext.v1.method) = {
      comment: "登录"
      action: ACTION_WRITE
    };
    option (cyber.ext.v1.access) = ACCESS_PUBLIC;
    option (google.api.http) = {
      post: "/api/v1/system/auth/login"
      body: "*"
    };
  }
  rpc LoginByIdentity(LoginByIdentityRequest) returns (LoginByIdentityResponse) {
    option (cyber.ext.v1.method) = {
      comment: "身份交换登录：第三方凭证换会话"
      action: ACTION_WRITE
    };
    option (cyber.ext.v1.access) = ACCESS_PUBLIC;
    option (google.api.http) = {
      post: "/api/v1/system/auth/login-by-identity"
      body: "*"
    };
  }
  rpc BeginIdentityLogin(BeginIdentityLoginRequest) returns (BeginIdentityLoginResponse) {
    option (cyber.ext.v1.method) = {
      comment: "发起身份登录：铸造授权跳转"
      action: ACTION_READ
    };
    option (cyber.ext.v1.access) = ACCESS_PUBLIC;
    option (google.api.http) = {
      post: "/api/v1/system/auth/begin-identity-login"
      body: "*"
    };
  }
  rpc SendSmsCode(SendSmsCodeRequest) returns (SendSmsCodeResponse) {
    option (cyber.ext.v1.method) = {
      comment: "发送短信验证码：铸造一次性 state 供 LoginByIdentity 消费"
      action: ACTION_WRITE
    };
    option (cyber.ext.v1.access) = ACCESS_PUBLIC;
    option (google.api.http) = {
      post: "/api/v1/system/auth/send-sms-code"
      body: "*"
    };
  }
  rpc BindCredential(BindCredentialRequest) returns (BindCredentialResponse) {
    option (cyber.ext.v1.method) = {
      comment: "绑定第三方身份凭证"
      action: ACTION_WRITE
    };
    option (cyber.ext.v1.access) = ACCESS_BUILTIN;
    option (google.api.http) = {
      post: "/api/v1/system/auth/bind-credential"
      body: "*"
    };
  }
  rpc BeginBindCredential(BeginBindCredentialRequest) returns (BeginBindCredentialResponse) {
    option (cyber.ext.v1.method) = {
      comment: "发起凭证绑定：为已登录会话铸造绑定态授权跳转"
      action: ACTION_READ
    };
    option (cyber.ext.v1.access) = ACCESS_BUILTIN;
    option (google.api.http) = {
      post: "/api/v1/system/auth/begin-bind-credential"
      body: "*"
    };
  }
  rpc SendBindSmsCode(SendBindSmsCodeRequest) returns (SendBindSmsCodeResponse) {
    option (cyber.ext.v1.method) = {
      comment: "发送绑定用短信验证码：铸造绑定当前会话的一次性 state"
      action: ACTION_WRITE
    };
    option (cyber.ext.v1.access) = ACCESS_BUILTIN;
    option (google.api.http) = {
      post: "/api/v1/system/auth/send-bind-sms-code"
      body: "*"
    };
  }
  rpc MergeAccounts(MergeAccountsRequest) returns (MergeAccountsResponse) {
    option (cyber.ext.v1.method) = {
      comment: "账号合并：富号吞并空号（凭证迁移+空号注销+审计）"
      action: ACTION_WRITE
    };
    option (cyber.ext.v1.access) = ACCESS_BUILTIN;
    option (google.api.http) = {
      post: "/api/v1/system/auth/merge-accounts"
      body: "*"
    };
  }
  rpc ResolveCredential(ResolveCredentialRequest) returns (ResolveCredentialResponse) {
    option (cyber.ext.v1.method) = {
      comment: "凭证属主解析：合并 offer 面的取数腿"
      action: ACTION_READ
    };
    option (cyber.ext.v1.access) = ACCESS_BUILTIN;
    option (google.api.http) = {
      post: "/api/v1/system/auth/resolve-credential"
      body: "*"
    };
  }
  rpc ResetPassword(ResetPasswordRequest) returns (ResetPasswordResponse) {
    option (cyber.ext.v1.method) = {
      comment: "重置登录密码：短信码证明手机号归属"
      action: ACTION_WRITE
    };
    option (cyber.ext.v1.access) = ACCESS_PUBLIC;
    option (google.api.http) = {
      post: "/api/v1/system/auth/reset-password"
      body: "*"
    };
  }
  rpc GetSecurityStatus(GetSecurityStatusRequest) returns (GetSecurityStatusResponse) {
    option (cyber.ext.v1.method) = {
      comment: "获取当前账号绑定面"
      action: ACTION_READ
    };
    option (cyber.ext.v1.access) = ACCESS_BUILTIN;
    option (google.api.http) = {get: "/api/v1/system/me/security"};
  }
  rpc Logout(LogoutRequest) returns (LogoutResponse) {
    option (cyber.ext.v1.method) = {
      comment: "登出"
      action: ACTION_WRITE
    };
    option (cyber.ext.v1.access) = ACCESS_BUILTIN;
    option (google.api.http) = {
      post: "/api/v1/system/auth/logout"
      body: "*"
    };
  }
  rpc GetCurrentUser(GetCurrentUserRequest) returns (GetCurrentUserResponse) {
    option (cyber.ext.v1.method) = {
      comment: "获取当前登录用户"
      action: ACTION_READ
    };
    option (cyber.ext.v1.access) = ACCESS_BUILTIN;
    option (google.api.http) = {get: "/api/v1/system/me"};
  }
}

message LoginRequest {
  optional string account = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
  optional string password = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
  optional string population = 3;
}

message LoginResponse {
  string session_token = 1;
  google.protobuf.Timestamp issued_at = 2;
  google.protobuf.Timestamp expires_at = 3;
}

// identity exchange --------------------------------------------------------------

message LoginByIdentityRequest {
  optional string provider = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 64
  ];
  oneof payload {
    option (buf.validate.oneof).required = true;
    WeChatIdentityPayload wechat = 2;
    SmsIdentityPayload sms = 4;
  }
  // The state is the one-shot proof a flow began: Begin mints it for
  // redirect providers, SendSmsCode for direct-code ones; the exchange
  // consumes it exactly once.
  optional string state = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 128
  ];
}

message WeChatIdentityPayload {
  // OAuth authorization code from the wechat redirect.
  optional string code = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
}

// The direct-code payload: the phone the code was sent to plus the code
// itself. The contract checks phone shape and code charset only; which
// market the phone belongs to is the provider's channel knowledge.
message SmsIdentityPayload {
  optional string phone = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.pattern = "^[0-9+]{5,20}$"
  ];
  optional string code = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.pattern = "^[0-9]{6}$"
  ];
}

message LoginByIdentityResponse {
  string session_token = 1;
  google.protobuf.Timestamp issued_at = 2;
  google.protobuf.Timestamp expires_at = 3;
}

message BeginIdentityLoginRequest {
  optional string provider = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 64
  ];
  optional string redirect_uri = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 512
  ];
}

message BeginIdentityLoginResponse {
  string authorize_url = 1;
}

message SendSmsCodeRequest {
  optional string provider = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 64
  ];
  optional string phone = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.pattern = "^[0-9+]{5,20}$"
  ];
}

message SendSmsCodeResponse {
  // The one-shot state the caller presents at LoginByIdentity — the same
  // shape Begin mints for redirect flows.
  string state = 1;
}

message BindCredentialRequest {
  optional string provider = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 64
  ];
  oneof payload {
    option (buf.validate.oneof).required = true;
    WeChatIdentityPayload wechat = 2;
    SmsIdentityPayload sms = 4;
  }
  // The state must be one minted on an authenticated rung (SendBindSmsCode
  // or BeginBindCredential) and carries the minting session: the exchange
  // refuses a state born in another session or anonymous, so a phished code
  // cannot be injected into a foreign bind flow. Login faces accept any
  // live state of their provider — the code itself is the login proof.
  optional string state = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 128
  ];
}

message BindCredentialResponse {}

message BeginBindCredentialRequest {
  optional string provider = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 64
  ];
  optional string redirect_uri = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 512
  ];
}

message BeginBindCredentialResponse {
  string authorize_url = 1;
}

message SendBindSmsCodeRequest {
  optional string provider = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 64
  ];
  optional string phone = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.pattern = "^[0-9+]{5,20}$"
  ];
}

message SendBindSmsCodeResponse {
  // The one-shot state bound to the calling session; present it at
  // BindCredential together with the code the phone received.
  string state = 1;
}

// Merge runs in one direction only: the calling session is the surviving
// account, and the proven credential's current owner is the account being
// absorbed. The caller proves control of that credential (SMS code or OAuth
// code, same exchange as bind), which is the anti-takeover gate. The
// absorbed account must be system-side weightless — no password, exactly
// the one proven credential, no operator seats — or the merge refuses; the
// richer both-sides-have-data judgment over business records lives in the
// consuming service's offer face and is not re-derived here. A flow whose
// session is the empty side decomposes client-side: log in via the rich
// side's credential, then merge from there.
message MergeAccountsRequest {
  optional string provider = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 64
  ];
  oneof payload {
    option (buf.validate.oneof).required = true;
    WeChatIdentityPayload wechat = 2;
    SmsIdentityPayload sms = 4;
  }
  optional string state = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 128
  ];
}

message MergeAccountsResponse {}

// resolveCredential ------------------------------------------------------------------

// The offer face's lookup leg. The sms branch is a bare owner lookup by
// phone — no proof rides it because the merge itself re-proves with a
// fresh code, and the consumer rate-guards the occupancy oracle. The wechat
// branch carries the OAuth proof (the state BeginBindCredential minted plus
// the redirect code): only the exchange learns the openid, and it burns
// state and code exactly like a bind attempt would.
message ResolveCredentialRequest {
  option (buf.validate.message).cel = {
    id: "ResolveCredentialRequest.state_pairing"
    message: "state rides the wechat branch only"
    expression: "has(this.wechat) == has(this.state)"
  };

  optional string provider = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 64
  ];
  oneof credential {
    option (buf.validate.oneof).required = true;
    string phone = 2 [(buf.validate.field).string.pattern = "^[0-9+]{5,20}$"];
    WeChatIdentityPayload wechat = 3;
  }
  // Wechat branch only: the bind-minted one-shot state.
  optional string state = 4 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 128
  ];
}

message ResolveCredentialResponse {
  // Unset when the credential is free — no owner, the plain-bind path.
  CredentialOwner owner = 1;
}

// The owner facts an offer needs. Masked identifiers only: the raw values
// never leave the service. The mergeable verdict is the system-side hard
// gate (no password, exactly the resolved credential, no operator seats);
// the richer both-sides-have-data judgment over business records stays in
// the consuming service.
message CredentialOwner {
  string user_id = 1;
  bool enabled = 2;
  bool mergeable = 3;
  repeated SecurityCredential credentials = 4;
}

// resetPassword ----------------------------------------------------------------------

// The proof-carrying password setter for accounts whose only reach is their
// phone: the forgot-password leg on the login page and the first-password
// leg in account security both land here. The sms code to the account's own
// phone is the anti-takeover gate; the state is the one SendSmsCode minted.
// The account owning the sms credential is the one rehashed; sessions stay
// standing (a rotation is not a revocation).
message ResetPasswordRequest {
  optional string provider = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 64
  ];
  oneof payload {
    option (buf.validate.oneof).required = true;
    SmsIdentityPayload sms = 2;
  }
  optional string state = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 128
  ];
  optional string new_password = 4 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      min_len: 6
      max_len: 128
    }
  ];
}

message ResetPasswordResponse {}

// getSecurityStatus ------------------------------------------------------------------

message GetSecurityStatusRequest {}

// The caller's own binding surface: password set or not, and each
// credential with a display-masked identifier. The mask is server policy
// with one home; clients render what they receive and never re-derive it.
message GetSecurityStatusResponse {
  bool has_password = 1;
  repeated SecurityCredential credentials = 2;
}

// One binding row of the security surface; kind is the credential family
// (sms, wechat_mp).
message SecurityCredential {
  string kind = 1;
  string masked_identifier = 2;
}

message LogoutRequest {}

message LogoutResponse {}

// getCurrentUser
message GetCurrentUserRequest {}

message GetCurrentUserResponse {
  cyber.system.v1.User user = 1;
  repeated string permissions = 2;
  repeated Membership memberships = 3;
}

// Plain scalars by the success-implies-present carve-out: a seat row always
// carries its two join keys.
message Membership {
  string tenant = 1;
  string population = 2;
}
