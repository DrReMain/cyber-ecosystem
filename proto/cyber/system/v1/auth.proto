syntax = "proto3";

package cyber.system.v1;

import "buf/validate/validate.proto";
import "ext/v1/access.proto";
import "ext/v1/desc.proto";
import "google/api/annotations.proto";

option go_package = "cyber-ecosystem/gen/go/cyber/system/v1";

service AuthService {
  rpc Login(LoginRequest) returns (LoginResponse) {
    option (cyber.ext.v1.method_comment) = "登录";
    option (cyber.ext.v1.access) = ACCESS_PUBLIC;
    option (google.api.http) = {
      post: "/api/v1/system/auth/login"
      body: "*"
    };
  }

  rpc Logout(LogoutRequest) returns (LogoutResponse) {
    option (cyber.ext.v1.method_comment) = "登出";
    option (cyber.ext.v1.access) = ACCESS_ADMIN;
    option (google.api.http) = {
      post: "/api/v1/system/auth/logout"
      body: "*"
    };
  }

  rpc Refresh(RefreshRequest) returns (RefreshResponse) {
    option (cyber.ext.v1.method_comment) = "刷新令牌";
    option (cyber.ext.v1.access) = ACCESS_PUBLIC;
    option (google.api.http) = {
      post: "/api/v1/system/auth/refresh"
      body: "*"
    };
  }
}

// login
message LoginRequest {
  optional string email = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
  optional string password = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
}

message LoginResponse {
  string token = 1;
  string refresh_token = 2;
}

message LogoutRequest {}

message LogoutResponse {}

message RefreshRequest {
  optional string refresh_token = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
}

message RefreshResponse {
  string token = 1;
  string refresh_token = 2;
}
