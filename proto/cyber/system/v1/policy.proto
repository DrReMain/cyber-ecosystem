syntax = "proto3";

package cyber.system.v1;

import "buf/validate/validate.proto";
import "cyber/shared/common/v1/pagination.proto";
import "ext/v1/access.proto";
import "ext/v1/desc.proto";
import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";

option go_package = "cyber-ecosystem/gen/go/cyber/system/v1";

service PolicyService {
  option (cyber.ext.v1.service_comment) = "策略管理";
  rpc CreatePolicy(CreatePolicyRequest) returns (CreatePolicyResponse) {
    option (cyber.ext.v1.method) = {
      comment: "创建策略"
      action: ACTION_WRITE
    };
    option (cyber.ext.v1.access) = ACCESS_ADMIN;
    option (google.api.http) = {
      post: "/api/v1/system/policies"
      body: "*"
    };
  }
  rpc UpdatePolicy(UpdatePolicyRequest) returns (UpdatePolicyResponse) {
    option (cyber.ext.v1.method) = {
      comment: "修改策略"
      action: ACTION_WRITE
    };
    option (cyber.ext.v1.access) = ACCESS_ADMIN;
    option (google.api.http) = {
      put: "/api/v1/system/policies/{id}"
      body: "*"
    };
  }
  rpc DeletePolicy(DeletePolicyRequest) returns (DeletePolicyResponse) {
    option (cyber.ext.v1.method) = {
      comment: "删除策略"
      action: ACTION_WRITE
    };
    option (cyber.ext.v1.access) = ACCESS_ADMIN;
    option (google.api.http) = {delete: "/api/v1/system/policies/{id}"};
  }
  rpc ListPolicies(ListPoliciesRequest) returns (ListPoliciesResponse) {
    option (cyber.ext.v1.method) = {
      comment: "查询策略列表"
      action: ACTION_READ
    };
    option (cyber.ext.v1.access) = ACCESS_ADMIN;
    option (google.api.http) = {get: "/api/v1/system/policies"};
  }
  rpc GetPolicy(GetPolicyRequest) returns (GetPolicyResponse) {
    option (cyber.ext.v1.method) = {
      comment: "查询策略详情"
      action: ACTION_READ
    };
    option (cyber.ext.v1.access) = ACCESS_ADMIN;
    option (google.api.http) = {get: "/api/v1/system/policies/{id}"};
  }
}

// Typed constraint params: the oneof case doubles as the policy kind, so an
// unregistered kind cannot even be expressed. New kinds = new oneof members
// (a proto addition, non-breaking).
message PolicyParams {
  oneof params {
    TimeWindowParams time_window = 1;
    CalendarParams calendar = 3;
  }
  reserved 2;
  reserved "ip_cidr";
}

// Daily allowed windows, OR within one policy — the reason multi-segment is
// a list and not two linked policies (linking ANDs). Times are "HH:MM" local
// to the operating timezone (v1: server-local). Spans are same-day only:
// a cross-midnight schedule is two explicit windows (e.g. 22:00–24:00 and
// 00:00–06:00), which OR into the nightly shape.
message TimeWindowParams {
  repeated TimeWindowSpan windows = 1 [(buf.validate.field).repeated.min_items = 1];
  // Go time.Weekday order: 0=Sunday … 6=Saturday. Empty = every day.
  repeated uint32 days = 2 [(buf.validate.field).repeated.items.uint32.lte = 6];
}

// Half-open [start, end) span of minutes within a day; start < end is
// deep-validated on save. end also accepts the sentinel "24:00": through
// the end of the day (a plain clock has no 24:00).
message TimeWindowSpan {
  optional string start = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.pattern = "^([01]\\d|2[0-3]):[0-5]\\d$"
  ];
  optional string end = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.pattern = "^(([01]\\d|2[0-3]):[0-5]\\d|24:00)$"
  ];
}

// Calendar constraint: a periodic base plus per-date overrides that win over
// it. Three forms: WEEKDAYS + deny overrides = workday calendar (holidays);
// NONE + allow overrides = on-call/inspection calendar; ALL + deny
// overrides = lockdown calendar.
message CalendarParams {
  // Periodic default when no override matches the day.
  optional string base = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      in: [
        "ALL",
        "WEEKDAYS",
        "NONE"
      ]
    }
  ];
  // At most one entry per date (deep-validated on save).
  repeated CalendarOverride overrides = 2;
}

// A single-date exception on the calendar; dates are server-local.
message CalendarOverride {
  optional string date = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.pattern = "^\\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\\d|3[01])$"
  ];
  // true = allowed on this date, false = denied.
  optional bool allowed = 2 [(buf.validate.field).required = true];
}

message Policy {
  google.protobuf.StringValue id = 1;
  google.protobuf.Timestamp created_at = 2;
  google.protobuf.Timestamp updated_at = 3;
  google.protobuf.StringValue kind = 4;
  google.protobuf.StringValue name = 5;
  PolicyParams params = 6;
  google.protobuf.BoolValue enabled = 7;
  google.protobuf.Int64Value bound_count = 8;
}

// create
message CreatePolicyRequest {
  optional string name = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 128
    }
  ];
  PolicyParams params = 2 [(buf.validate.field).required = true];
}

message CreatePolicyResponse {
  google.protobuf.StringValue id = 1;
}

// update
message UpdatePolicyRequest {
  string id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.len = 20
  ];
  optional string name = 2;
  optional bool enabled = 3;
  optional PolicyParams params = 4;
  repeated string fields_mask = 100 [(buf.validate.field).repeated = {
    min_items: 1
    unique: true
  }];
}

message UpdatePolicyResponse {}

// delete
message DeletePolicyRequest {
  string id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.len = 20
  ];
}

message DeletePolicyResponse {}

// list
message ListPoliciesRequest {
  cyber.shared.common.v1.PageRequest page = 1;
  optional string kind = 2;
  optional string name = 3;
  optional bool enabled = 4;
  repeated string order_by = 100 [(buf.validate.field).cel = {
    id: "ListPoliciesRequest.order_by"
    message: ""
    expression: "this.all(item, size(item) == 0 || item.matches('^(kind|name|createdAt|updatedAt):(asc|desc)$'))"
  }];
}

message ListPoliciesResponse {
  cyber.shared.common.v1.PageResponse page = 1;
  repeated Policy list = 2;
}

// get
message GetPolicyRequest {
  string id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.len = 20
  ];
}

message GetPolicyResponse {
  Policy policy = 1;
}
