apiVersion: v1
kind: Secret
metadata:
  name: centrifugo-secrets
  namespace: realtime
type: Opaque
stringData:
  CENTRIFUGO_HTTP_API_KEY: "cyber-ecosystem-api-key"
  CENTRIFUGO_CLIENT_TOKEN_HMAC_SECRET_KEY: "Cyber-Ecosystem-centrifugo-hmac"
  CENTRIFUGO_ADMIN_PASSWORD: "Cyber-Ecosystem123"
  CENTRIFUGO_ADMIN_SECRET: "Cyber-Ecosystem-admin-secret"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: centrifugo
  namespace: realtime
spec:
  replicas: 1
  selector:
    matchLabels:
      app: centrifugo
  template:
    metadata:
      labels:
        app: centrifugo
    spec:
      containers:
        - name: centrifugo
          image: centrifugo/centrifugo:v6.9.1
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - secretRef:
                name: centrifugo-secrets
          env:
            - name: CENTRIFUGO_ADMIN_ENABLED
              value: "true"
            - name: CENTRIFUGO_HEALTH_ENABLED
              value: "true"
            - name: CENTRIFUGO_USAGE_STATS_DISABLED
              value: "true"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: centrifugo
  namespace: realtime
spec:
  type: ClusterIP
  selector:
    app: centrifugo
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: centrifugo
  namespace: realtime
spec:
  ingressClassName: traefik
  rules:
    - host: realtime.cyber.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: centrifugo
                port:
                  number: 8000
