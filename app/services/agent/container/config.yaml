# Container config (baked by the Dockerfile; configs/config.yaml holds the
# dev shape). Key set and order mirror the dev file; defaults point at the
# compose network aliases.
server:
  http: {addr: 0.0.0.0:11002, timeout: 1s}
  grpc: {addr: 0.0.0.0:12002, timeout: 1s}
  connect: {addr: 0.0.0.0:13002, timeout: 1s}
data:
  database:
    driver: postgres
    host: ${DB_HOST:postgresql.db}
    port: ${DB_PORT:5432}
    user: ${DB_USER:postgres}
    password: ${DB_PASS:postgres}
    db_name: ${DB_NAME:agent}
    max_open_conns: 100
    max_idle_conns: 50
    conn_max_lifetime: 3600s
observability:
  endpoint: ${OTLP_ENDPOINT:signoz-otel-collector.observability:4318}
  insecure: true
  trace:
    enabled: ${TRACE_ENABLED:false}
  metrics:
    enabled: ${METRICS_ENABLED:false}
  log:
    level: info
    console: true
    otlp: ${LOG_OTLP:false}
  slow_query:
    db: 0.2s
remote:
  system_connect: ${SYSTEM_CONNECT:http://system.api:13001}
crypto:
  # Empty default: the boot guard rejects an unset key, so a bare docker run
  # without the env fails loudly instead of encrypting with a known key; the
  # app compose injects the dev key through AGENT_MASTER_KEY.
  master_key: ${AGENT_MASTER_KEY:}
