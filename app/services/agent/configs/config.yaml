# Dev config (bare metal). container/config.yaml mirrors this file's key
# set and order for the baked image; keep the two aligned when either
# changes. The boot banner prints the values actually in effect — read
# it back after exporting.
server:
  http: {addr: 0.0.0.0:11002, timeout: 1s}
  grpc: {addr: 0.0.0.0:12002, timeout: 1s}
  connect: {addr: 0.0.0.0:13002, timeout: 1s}
data:
  database:
    driver: postgres
    host: ${DB_HOST:localhost}
    port: ${DB_PORT:5432}
    user: ${DB_USER:postgres}
    password: ${DB_PASS:postgres}
    db_name: ${DB_NAME:agent}
    max_open_conns: 100
    max_idle_conns: 50
    conn_max_lifetime: 3600s
observability:
  endpoint: ${OTLP_ENDPOINT:localhost:4318} # otlp http collector
  insecure: true
  trace:
    enabled: ${TRACE_ENABLED:false}
  metrics:
    enabled: ${METRICS_ENABLED:false}
  log:
    level: debug
    console: true
    otlp: ${LOG_OTLP:false}
  slow_query:
    db: 0.2s
remote:
  system_connect: ${SYSTEM_CONNECT:localhost:13001} # system connect face
crypto:
  # Empty default mirrors container/config.yaml; required — the deploy plane
  # owns the one dev value (compose injects it via AGENT_MASTER_KEY), and
  # a missing key fails service start at UC construction (min 16 bytes).
  master_key: ${AGENT_MASTER_KEY:}
