# Container-mode bootstrap config (baked by the Dockerfile; configs/ holds
# only the bare-metal dev config). Endpoints are network discovery aliases
# (<service>.<domain> — the same names k8s Service DNS resolves), so one file
# serves every container shape. Deployment-sensitive values are
# ${VAR:default} placeholders overridden by APP_-prefixed env vars (e.g
# APP_DB_HOST=prod-db reconfigures without a rebuild); booleans included —
# main.go wires WithResolveActualTypes for the string→bool conversion.
# Placeholder coverage is field-aligned with configs/config.yaml — a key
# that carries one here carries the same one there (defaults differ per
# environment); a key stays literal in both when neither flips. When a key
# changes in configs/config.yaml, mirror it here.
server:
  http: {addr: 0.0.0.0:11003, timeout: 1s}
  grpc: {addr: 0.0.0.0:12003, timeout: 1s}
  connect: {addr: 0.0.0.0:13003, timeout: 1s}
data:
  database:
    driver: postgres
    host: ${DB_HOST:postgresql.db}
    port: ${DB_PORT:5432}
    user: ${DB_USER:postgres}
    password: ${DB_PASS:postgres}
    db_name: ${DB_NAME:esports}
    max_open_conns: 100        # connections (max)
    max_idle_conns: 50         # connections (max idle)
    conn_max_lifetime: 3600s   # duration (max connection lifetime)
  mq:
    pg:
      dsn: ${MQ_DSN:postgres://postgres:postgres@postgresql.db:5432/mq?sslmode=disable}
      poll_interval: 0.5s
      visibility_timeout: 30s
      max_retries: 5              # attempts (delivery ceiling)
      retention: 604800s          # duration (7 days)
observability:
  endpoint: ${OTLP_ENDPOINT:signoz-otel-collector.observability:4318} # SigNoz OTLP HTTP
  insecure: true
  trace:
    enabled: ${TRACE_ENABLED:false}
  metrics:
    enabled: ${METRICS_ENABLED:false}
  slow_query:
    db: 0.2s
  log:
    level: info
    console: true
    otlp: false

remote:
  system_connect: ${SYSTEM_CONNECT:http://system.api:13001} # system connect

payment:
  default_provider: ${PAY_PROVIDER:mock}
  # The notify base WeChat's servers call back — a public edge origin the
  # deploy plane must name, never an in-mesh alias; empty fails the boot
  # validate once a wechat provider is selected.
  notify_base_url: ${PAY_NOTIFY_BASE_URL:}
  providers:
    - name: ${PAY_PROVIDER:mock}
      kind: ${PAY_PROVIDER:mock}
      # Inert under the mock default; selecting wechat via APP_PAY_PROVIDER
      # with empty env fails the boot validate — credentials are deploy-plane
      # facts, never literals. Env overrides need the APP_ prefix (bare names
      # never land), and a numeric-looking string value (mch_id) must ride
      # quoted or the proto scan rejects it.
      wechat:
        mch_id: ${WECHAT_MCH_ID:}
        mch_serial: ${WECHAT_MCH_SERIAL:}
        app_id: ${WECHAT_APP_ID:}
        apiv3_key: ${WECHAT_APIV3_KEY:}
        private_key_pem: ${WECHAT_PRIVATE_KEY_PEM:}
        public_key_id: ${WECHAT_PUBLIC_KEY_ID:}
        public_key_pem: ${WECHAT_PUBLIC_KEY_PEM:}
        base_url: ${WECHAT_BASE_URL:}
