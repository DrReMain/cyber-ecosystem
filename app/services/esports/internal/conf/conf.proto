syntax = "proto3";

package cyber.conf;

import "google/protobuf/duration.proto";

option go_package = "cyber-ecosystem/app/services/esports/internal/conf;conf";

message Bootstrap {
  Server server = 1;
  Data data = 2;
  Observability observability = 3;
  Remote remote = 4;
  Payment payment = 5;
}

message Server {
  message HTTP {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }
  message GRPC {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }
  message Connect {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }
  HTTP http = 1;
  GRPC grpc = 2;
  Connect connect = 3;
}

message Data {
  message Database {
    string driver = 1;
    string host = 2;
    int32 port = 3;
    string user = 4;
    string password = 5;
    string db_name = 6;
    int32 max_open_conns = 7;
    int32 max_idle_conns = 8;
    google.protobuf.Duration conn_max_lifetime = 9;
  }
  message MQ {
    message NATS {
      string endpoint = 1;
      string creds = 2;
      google.protobuf.Duration max_age = 3;
      int64 max_bytes = 4;
      int32 max_retries = 5;
      google.protobuf.Duration ack_wait = 6;
      int32 max_ack_pending = 7; // in-flight unacked cap per consumer (0 → backend default)
      google.protobuf.Duration dlq_max_age = 8; // DLQ stream TTL (0 → backend default)
      int64 dlq_max_bytes = 9; // DLQ stream size cap (0 → backend default)
      google.protobuf.Duration nak_backoff_step = 10; // linear Nak redelivery delay step (0 → backend default)
    }
    message PG {
      string dsn = 1; // postgres://... to the standalone `mq` database
      google.protobuf.Duration poll_interval = 2; // consumer poll interval (0 → backend default)
      google.protobuf.Duration visibility_timeout = 3; // = NATS ack_wait (0 → backend default)
      int32 max_retries = 4; // delivery attempts before DLQ (0 → backend default)
      google.protobuf.Duration retention = 5; // message retention, age-based eviction (0 → backend default)
      int32 batch_size = 6; // max messages per poll batch (0 → backend default)
    }
    NATS nats = 1;
    PG pg = 2;
  }
  Database database = 1;
  MQ mq = 2;
}

message Observability {
  message Trace {
    bool enabled = 1;
    double sampling_ratio = 2;
  }
  message Metrics {
    bool enabled = 1;
  }
  message Log {
    message FileOutput {
      string path = 1;
      int32 max_size_mb = 2;
      int32 max_backups = 3;
      int32 max_age_days = 4;
      bool compress = 5;
    }
    string level = 1;
    bool console = 2;
    bool otlp = 3;
    FileOutput file = 4;
  }
  message SlowQuery {
    google.protobuf.Duration db = 1; // slow SQL threshold; 0/omit = disabled
  }
  string endpoint = 1;
  bool insecure = 2;
  Trace trace = 3;
  Metrics metrics = 4;
  Log log = 5;
  SlowQuery slow_query = 6;
}

// Remote holds endpoints of other services this service calls (ACL targets).
message Remote {
  string system_connect = 1; // system service connect face (session introspection, grant decide)
}

message Payment {
  string default_provider = 1; // provider orders are created against; also the callback URL's provider segment
  string notify_base_url = 2;  // public base the channel pushes notifications to (the client edge's domain)
  repeated Provider providers = 3;

  message Provider {
    string name = 1; // provider value orders carry (wechat, mock)
    string kind = 2; // constructor dispatch: mock | wechat
    Wechat wechat = 3;
  }

  message Wechat {
    string mch_id = 1;
    string mch_serial = 2;
    string app_id = 3;
    string apiv3_key = 4;           // 32 bytes
    string private_key_pem = 5;     // apiclient_key.pem contents
    string public_key_id = 6;       // PUB_KEY_ID_... (public-key mode, the only mode new merchants get)
    string public_key_pem = 7;      // pub_key.pem contents
    string base_url = 8;            // override for channel-edge tests
  }
}
