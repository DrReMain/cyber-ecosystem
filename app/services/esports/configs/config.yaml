# Bare-metal dev config (container/ holds the baked container shape; the two
# mirror each other per the config-image law). Deployment-sensitive values are
# ${VAR:default} placeholders overridden ONLY by APP_-prefixed env vars
# (APP_DB_HOST=x reconfigures): the env source in main.go reads the APP_
# prefix alone, so a bare DB_HOST=... is silently ignored.
server:
  http: {addr: 0.0.0.0:11003, timeout: 1s}
  grpc: {addr: 0.0.0.0:12003, timeout: 1s}
  connect: {addr: 0.0.0.0:13003, timeout: 1s}
data:
  database:
    driver: postgres
    host: ${DB_HOST:localhost}
    port: ${DB_PORT:5432}
    user: ${DB_USER:postgres}
    password: ${DB_PASS:postgres}
    db_name: ${DB_NAME:esports}
    max_open_conns: 100        # 个 (最大连接数)
    max_idle_conns: 50         # 个 (最大空闲连接数)
    conn_max_lifetime: 3600s   # 时长 (连接最大存活)
  mq:
    pg: # 与 nats 二选一；无 NATS 部署用；需预先 CREATE DATABASE mq
      dsn: ${MQ_DSN:postgres://postgres:postgres@localhost:5432/mq?sslmode=disable}
      poll_interval: 0.5s
      visibility_timeout: 30s
      max_retries: 5
      retention: 604800s         # 7 天
observability:
  endpoint: ${OTLP_ENDPOINT:localhost:4318}
  insecure: true
  trace:
    enabled: ${TRACE_ENABLED:false}
  metrics:
    enabled: ${METRICS_ENABLED:false}
  slow_query:
    db: 0.2s
  log:
    level: debug
    console: true
    otlp: false

remote:
  system_connect: ${SYSTEM_CONNECT:localhost:13001} # system connect

payment:
  default_provider: ${PAY_PROVIDER:mock}
  notify_base_url: ${PAY_NOTIFY_BASE_URL:http://localhost:5174}
  providers:
    - name: ${PAY_PROVIDER:mock}
      kind: ${PAY_PROVIDER:mock}
      # The wechat block is inert under the mock default; selecting wechat
      # via APP_PAY_PROVIDER with empty env fails the boot validate —
      # credentials are deploy-plane facts, never literals. Env overrides
      # need the APP_ prefix (bare names never land), and a numeric-looking
      # string value (mch_id) must ride quoted or the proto scan rejects it.
      wechat:
        mch_id: ${WECHAT_MCH_ID:}
        mch_serial: ${WECHAT_MCH_SERIAL:}
        app_id: ${WECHAT_APP_ID:}
        apiv3_key: ${WECHAT_APIV3_KEY:}
        private_key_pem: ${WECHAT_PRIVATE_KEY_PEM:}
        public_key_id: ${WECHAT_PUBLIC_KEY_ID:}
        public_key_pem: ${WECHAT_PUBLIC_KEY_PEM:}
        base_url: ${WECHAT_BASE_URL:}
