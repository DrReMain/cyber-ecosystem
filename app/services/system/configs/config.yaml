# Dev config (bare metal). container/config.yaml mirrors this file's key
# set and order for the baked image; keep the two aligned when either
# changes. Overrides come ONLY from APP_-prefixed env vars (APP_DB_HOST=x);
# the boot banner ("sms channel resolved" / "auth provider resolved")
# prints the values actually in effect — read it back after exporting.
# Optional blocks (nats mq, log file sink) stay commented until needed.
server:
  http: {addr: 0.0.0.0:11001, timeout: 1s}
  grpc: {addr: 0.0.0.0:12001, timeout: 1s}
  connect: {addr: 0.0.0.0:13001, timeout: 1s}
data:
  database:
    driver: postgres
    host: ${DB_HOST:localhost}
    port: ${DB_PORT:5432}
    user: ${DB_USER:postgres}
    password: ${DB_PASS:postgres}
    db_name: ${DB_NAME:system}
    max_open_conns: 100
    max_idle_conns: 50
    conn_max_lifetime: 3600s
  redis:
    network: tcp
    addr: ${REDIS_ADDR:localhost:6379}
    password: ${REDIS_PASS:}
    db: 0
    pool_size: 50
    min_idle_conns: 5
    conn_max_lifetime: 1800s
    read_timeout: 0.2s
    write_timeout: 0.2s
    dial_timeout: 5s
    pool_timeout: 1.2s
  storage:
    s3:
      endpoint: ${S3_ENDPOINT:http://localhost:8333}
      access_key: ${S3_ACCESS_KEY:admin@cyber-ecosystem.com}
      secret_key: ${S3_SECRET_KEY:Cyber-Ecosystem123}
      bucket: ${S3_BUCKET:core}
      region: ${S3_REGION:us-east-1}
      use_path_style: true
      multipart_threshold: 8388608 # 8 MiB — uploads above split into parts
      part_size: 5242880           # 5 MiB
      presign_ttl: 900s
      max_file_size: 2147483648    # 2 GiB; proxy channel caps at 4 MiB by contract
      public_endpoint: ${S3_PUBLIC_ENDPOINT:} # browser-facing presign base; empty = endpoint; set for LAN deploys
  mq:
    pg: # postgres-backed queue; needs CREATE DATABASE mq once; alternative to nats below
      dsn: ${MQ_DSN:postgres://postgres:postgres@localhost:5432/mq?sslmode=disable}
      poll_interval: 0.5s
      visibility_timeout: 30s
      max_retries: 5
      retention: 604800s # 7 days
      batch_size: 16
#    nats:
#      endpoint: nats://localhost:4222
#      # creds: ""               # dev runs without auth
#      max_age: 604800s          # 7 days
#      max_bytes: 1073741824     # 1 GiB
#      max_retries: 5            # then dlq
#      ack_wait: 30s             # keep above handler p99
#      max_ack_pending: 256      # in-flight cap per consumer
#      dlq_max_age: 2592000s     # 30 days — longer than the business stream
#      dlq_max_bytes: 1073741824
#      nak_backoff_step: 0.5s
observability:
  endpoint: ${OTLP_ENDPOINT:localhost:4318} # otlp http collector
  insecure: true
  trace:
    enabled: ${TRACE_ENABLED:false}
  metrics:
    enabled: ${METRICS_ENABLED:false}
  log:
    level: debug
    console: true
    otlp: false
#    file:
#      path: app.log
#      max_size_mb: 100
#      max_backups: 10
#      max_age_days: 30
#      compress: true
  slow_query:
    db: 0.2s
    cache: 0.05s
catalog:
  dir: ${CATALOG_DIR:../../../../../gen/catalog}
auth:
  providers:
    - key: wechat            # instance key — the login request's provider param
      kind: wechat_mp
      enabled: ${WECHAT_ENABLED:true}
      auto_register: ${WECHAT_AUTO_REGISTER:true}
      endpoint: ${WECHAT_ENDPOINT:}
      population: ${WECHAT_POPULATION:member} # landing population for this provider's logins
      wechat:
        appid: ${WECHAT_APPID:wxfda597a14a57bf08}   # test account
        secret: ${WECHAT_SECRET:da1ce920bfcee3db140f431d2c1f3a5b}
    - key: sms
      kind: sms
      enabled: ${SMS_ENABLED:true}
      auto_register: ${SMS_AUTO_REGISTER:true}
      population: ${SMS_POPULATION:member}
      sms:
        backend: ${SMS_BACKEND:mock} # dysmsapi (credential pair required) | mock (record, never dial)
        access_key_id: ${SMS_ACCESS_KEY_ID:}
        access_key_secret: ${SMS_ACCESS_KEY_SECRET:}
        sign_name: ${SMS_SIGN_NAME:曦光未来}
        template_code: ${SMS_TEMPLATE_CODE:SMS_460000000}
        endpoint: ${SMS_ENDPOINT:}
seed:
  super_admins:
    accounts:
      - admin
    initial_password: ${SEED_INITIAL_PASSWORD:admin123456}
  populations:
    - code: member
      name: Member
      plane: member
