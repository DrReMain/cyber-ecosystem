server:
  http: {addr: 0.0.0.0:11001, timeout: 1s}
  grpc: {addr: 0.0.0.0:12001, timeout: 1s}
  connect: {addr: 0.0.0.0:13001, timeout: 1s}
data:
  database:
    driver: postgres
    host: localhost
    port: 5432
    user: postgres
    password: postgres
    db_name: system
    max_open_conns: 100        # 个 (最大连接数)
    max_idle_conns: 50         # 个 (最大空闲连接数)
    conn_max_lifetime: 3600s   # 时长 (连接最大存活)
  redis:
    network: tcp
    addr: localhost:6379
    password: ""
    db: 0                      # 序号 (Redis 数据库 0–15)
    pool_size: 50              # 个 (连接池大小)
    min_idle_conns: 5          # 个 (最小空闲连接数)
    conn_max_lifetime: 1800s   # 时长 (连接最大存活)
    read_timeout: 0.2s         # 时长 (读超时)
    write_timeout: 0.2s        # 时长 (写超时)
    dial_timeout: 5s           # 时长 (拨号超时)
    pool_timeout: 1.2s         # 时长 (池等待超时)
  storage:
    s3:
      endpoint: http://localhost:8333
      public_endpoint: http://192.168.50.203:8333 # presign 铸造基址（浏览器可达；LAN/边缘域）；空=endpoint
      access_key: admin@cyber-ecosystem.com
      secret_key: Cyber-Ecosystem123
      bucket: core
      region: us-east-1
      use_path_style: true
      multipart_threshold: 8388608  # 8 MiB；直传单发/会话裁决 + 服务端 transfermanager 大文件自动分片
      part_size: 5242880            # 5 MiB；直传分片规划 + 服务端 multipart 分片规划
      presign_ttl: 900s             # 预签名有效期；仅直传上传与下载铸造
      max_file_size: 2147483648     # 2 GiB；直传预检 + 服务端流式上限（代理通道 4MiB 上限是 proto 契约常量，不在此处）
  mq:
    pg: # 与 nats 二选一；无 NATS 部署用；需预先 CREATE DATABASE mq
      dsn: postgres://postgres:postgres@localhost:5432/mq?sslmode=disable
      poll_interval: 0.5s
      visibility_timeout: 30s
      max_retries: 5
      retention: 604800s         # 7 天
      batch_size: 16
#    nats:
#      endpoint: nats://localhost:4222
#      # creds: ""                 # dev 无鉴权
#      max_age: 604800s            # 7 天 (protobuf Duration: 秒)
#      max_bytes: 1073741824       # 1 GiB
#      max_retries: 5              # 次 (投递上限，超过则 DLQ)
#      ack_wait: 30s               # 时长 (重投等待，须大于 handler p99)
#      max_ack_pending: 256        # 个 (每消费者在途未 ack 上限，限内存+重投)
#      dlq_max_age: 2592000s       # 30 天 (DLQ 流保留，长于业务流)
#      dlq_max_bytes: 1073741824   # 1 GiB (DLQ 流容量)
#      nak_backoff_step: 0.5s      # 线性退避步长 (Nak 重投延迟)
observability:
  endpoint: localhost:4318        # SigNoz OTLP HTTP
  insecure: true
  trace:
    enabled: false
  metrics:
    enabled: false
  slow_query:
    db: 0.2s
    cache: 0.05s
  log:
    level: debug
    console: true
    otlp: false
#    file:
#      path: app.log
#      max_size_mb: 100 # MiB (单文件最大)
#      max_backups: 10 # 个 (保留备份数)
#      max_age_days: 30 # 天 (最大保留天数)
#      compress: true

authz:
  super_admins:
    - admin1@cyber.local            # 邮箱 (种子超管)
    - admin2@cyber.local
  initial_password: "Admin@123456" # 口令
