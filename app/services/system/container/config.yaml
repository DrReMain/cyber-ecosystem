# Container config (baked by the Dockerfile; configs/config.yaml holds the
# dev shape). Key set and order mirror the dev file; defaults point at the
# compose network aliases. Overrides come ONLY from APP_-prefixed env vars.
server:
  http: {addr: 0.0.0.0:11001, timeout: 1s}
  grpc: {addr: 0.0.0.0:12001, timeout: 1s}
  connect: {addr: 0.0.0.0:13001, timeout: 1s}
data:
  database:
    driver: postgres
    host: ${DB_HOST:postgresql.db}
    port: ${DB_PORT:5432}
    user: ${DB_USER:postgres}
    password: ${DB_PASS:postgres}
    db_name: ${DB_NAME:system}
    max_open_conns: 100
    max_idle_conns: 50
    conn_max_lifetime: 3600s
  redis:
    network: tcp
    addr: ${REDIS_ADDR:redis.db:6379}
    password: ${REDIS_PASS:}
    db: 0
    pool_size: 50
    min_idle_conns: 5
    conn_max_lifetime: 1800s
    read_timeout: 0.2s
    write_timeout: 0.2s
    dial_timeout: 5s
    pool_timeout: 1.2s
  storage:
    s3:
      endpoint: ${S3_ENDPOINT:http://s3.cyber.test}
      access_key: ${S3_ACCESS_KEY:admin@cyber-ecosystem.com}
      secret_key: ${S3_SECRET_KEY:Cyber-Ecosystem123}
      bucket: ${S3_BUCKET:core}
      region: ${S3_REGION:us-east-1}
      use_path_style: true
      multipart_threshold: 8388608
      part_size: 5242880
      presign_ttl: 900s
      max_file_size: 2147483648
      public_endpoint: ${S3_PUBLIC_ENDPOINT:http://s3.cyber.test}
  mq:
    pg:
      dsn: ${MQ_DSN:postgres://postgres:postgres@postgresql.db:5432/mq?sslmode=disable}
      poll_interval: 0.5s
      visibility_timeout: 30s
      max_retries: 5
      retention: 604800s
      batch_size: 16
observability:
  endpoint: ${OTLP_ENDPOINT:signoz-otel-collector.observability:4318}
  insecure: true
  trace:
    enabled: ${TRACE_ENABLED:false}
  metrics:
    enabled: ${METRICS_ENABLED:false}
  log:
    level: info
    console: true
    otlp: false
  slow_query:
    db: 0.2s
    cache: 0.05s
catalog:
  dir: ${CATALOG_DIR:/etc/cyber/catalog}
auth:
  providers:
    - key: wechat
      kind: wechat_mp
      enabled: ${WECHAT_ENABLED:false}
      auto_register: ${WECHAT_AUTO_REGISTER:false}
      endpoint: ${WECHAT_ENDPOINT:}
      population: ${WECHAT_POPULATION:member}
      wechat:
        appid: ${WECHAT_APPID:}
        secret: ${WECHAT_SECRET:}
    - key: sms
      kind: sms
      enabled: ${SMS_ENABLED:false}
      auto_register: ${SMS_AUTO_REGISTER:false}
      population: ${SMS_POPULATION:member}
      sms:
        backend: ${SMS_BACKEND:mock}
        access_key_id: ${SMS_ACCESS_KEY_ID:}
        access_key_secret: ${SMS_ACCESS_KEY_SECRET:}
        sign_name: ${SMS_SIGN_NAME:}
        template_code: ${SMS_TEMPLATE_CODE:SMS_460000000}
        endpoint: ${SMS_ENDPOINT:}
seed:
  super_admins:
    accounts:
      - admin
    initial_password: ${SEED_INITIAL_PASSWORD:admin123456}
  populations:
    - code: member
      name: Member
      plane: member
