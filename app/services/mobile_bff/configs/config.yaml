server:
  http:
    addr: 0.0.0.0:11002
    timeout: 1s
  grpc:
    addr: 0.0.0.0:12002
    timeout: 1s
  connect:
    addr: 0.0.0.0:13002
    timeout: 1s
data:
  database:
    driver: postgres
    source: "host=localhost port=5432 user=postgres password=postgres dbname=mobile_bff sslmode=disable"
  redis:
    addr: localhost:6379
    read_timeout: 0.2s
    write_timeout: 0.2s
