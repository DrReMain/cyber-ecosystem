syntax = "proto3";

package cyber.conf;

import "google/protobuf/duration.proto";

option go_package = "cyber-ecosystem/app/services/edge_mobile/internal/conf;conf";

message Bootstrap {
  Server server = 1;
  Data data = 2;
  Observability observability = 3;
}

message Server {
  message HTTP {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }
  message GRPC {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }
  message Connect {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }
  HTTP http = 1;
  GRPC grpc = 2;
  Connect connect = 3;
}

message Data {
  message Database {
    string driver = 1;
    string host = 2;
    int32 port = 3;
    string user = 4;
    string password = 5;
    string db_name = 6;
    int32 max_open_conns = 7;
    int32 max_idle_conns = 8;
    google.protobuf.Duration conn_max_lifetime = 9;
  }
  message Redis {
    string network = 1;
    string addr = 2;
    string password = 3;
    int32 db = 4;
    int32 pool_size = 5;
    int32 min_idle_conns = 6;
    google.protobuf.Duration conn_max_lifetime = 7;
    google.protobuf.Duration read_timeout = 8;
    google.protobuf.Duration write_timeout = 9;
    google.protobuf.Duration dial_timeout = 10;
    google.protobuf.Duration pool_timeout = 11;
  }
  message Storage {
    message S3 {
      string endpoint = 1;
      string access_key = 2;
      string secret_key = 3;
      string bucket = 4;
      string region = 5;
      bool use_path_style = 6;
      int64 multipart_threshold = 7;
      int64 part_size = 8;
      google.protobuf.Duration presign_ttl = 9;
    }
    int64 max_file_size = 1;
    S3 s3 = 2;
  }
  Database database = 1;
  Redis redis = 2;
  Storage storage = 3;
}

message Observability {
  message Trace {
    bool enabled = 1;
    double sampling_ratio = 2;
  }
  message Metrics {
    bool enabled = 1;
  }
  message Log {
    message FileOutput {
      string path = 1;
      int32 max_size_mb = 2;
      int32 max_backups = 3;
      int32 max_age_days = 4;
      bool compress = 5;
    }
    string level = 1;
    bool console = 2;
    bool otlp = 3;
    FileOutput file = 4;
  }
  string endpoint = 1;
  bool insecure = 2;
  Trace trace = 3;
  Metrics metrics = 4;
  Log log = 5;
}

