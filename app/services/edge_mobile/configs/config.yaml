server:
  http: {addr: 0.0.0.0:11002, timeout: 1s}
  grpc: {addr: 0.0.0.0:12002, timeout: 1s}
  connect: {addr: 0.0.0.0:13002, timeout: 1s}
data:
  database:
    driver: postgres
    host: localhost
    port: 5432
    user: postgres
    password: postgres
    db_name: edge_mobile
    max_open_conns: 100
    max_idle_conns: 50
    conn_max_lifetime: 3600s
  redis:
    network: tcp
    addr: localhost:6379
    password: ""
    db: 0
    pool_size: 50
    min_idle_conns: 5
    conn_max_lifetime: 1800s
    read_timeout: 0.2s
    write_timeout: 0.2s
    # dial_timeout: 5s # omit → go-redis default (5s)
    # pool_timeout: 4s # omit → go-redis default (ReadTimeout+1s ≈ 1.2s here)
observability:
  endpoint: localhost:4318
  insecure: true
  trace:
    enabled: true
#    sampling_ratio: 0.1
  metrics:
    enabled: true
  log:
    level: debug
    console: true
    otlp: true
#    file:
#      path: edge_mobile.log
#      max_size_mb: 100
#      max_backups: 10
#      max_age_days: 30
#      compress: true
